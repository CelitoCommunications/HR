<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Access Denied — Celito Onboarding Portal</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #00447c 0%, #003366 50%, #001a33 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #333;
        }
        .container {
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 48px 40px;
            max-width: 480px;
            width: 90%;
            text-align: center;
        }
        .icon {
            width: 64px;
            height: 64px;
            background: #fef2f2;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px;
        }
        .icon svg {
            width: 32px;
            height: 32px;
            color: #dc2626;
        }
        h1 {
            font-size: 28px;
            font-weight: 700;
            color: #dc2626;
            margin-bottom: 12px;
        }
        .message {
            font-size: 15px;
            color: #555;
            line-height: 1.6;
            margin-bottom: 32px;
        }
        .home-link {
            display: inline-block;
            padding: 12px 28px;
            background: #00447c;
            color: #fff;
            text-decoration: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            transition: background 0.2s;
        }
        .home-link:hover { background: #003366; }
        .footer {
            margin-top: 32px;
            font-size: 12px;
            color: #999;
        }
        .company {
            font-size: 13px;
            color: #00447c;
            font-weight: 600;
            margin-bottom: 24px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="company">Celito Communications, Inc.</div>
        <div class="icon">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" d="M18.364 18.364A9 9 0 005.636 5.636m12.728 12.728A9 9 0 015.636 5.636m12.728 12.728L5.636 5.636" />
            </svg>
        </div>
        <h1>Access Denied</h1>
        <p class="message">
            You don't have permission to access this resource.<br>
            Contact your administrator if you believe this is an error.
        </p>
        <a href="/" class="home-link">← Back to Home</a>
        <div class="footer">&copy; 2026 Celito Communications, Inc.</div>
    </div>
</body>
</html>
