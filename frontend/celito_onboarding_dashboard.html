/* =============================================================
   TEAM REPORTS (MANAGER)
   ============================================================= */
async function renderManagerReports(container) {
    container.innerHTML = '<div class="loading-center"><div class="spinner"></div> Loading team reports...</div>';
    try {
        var data = await api('/api/manager/dashboard');
        if (!data) { container.innerHTML = '<div class="empty-state">Unable to load reports.</div>'; return; }

        var team = (data.team || []).filter(function(e) { return e.status !== 'departed'; });
        if (team.length === 0) {
            container.innerHTML = '<div class="card" style="padding:40px;text-align:center">' +
                '<h2>No Active Team Members</h2>' +
                '<p style="color:var(--text-secondary)">Reports will appear when you have active onboarding employees.</p></div>';
            return;
        }

        // Calculate aggregate metrics
        var totalTasks = 0, completedTasks = 0, overdueTasks = 0;
        var today = new Date().toISOString().slice(0,10);
        var byPhase = {};
        var byEmployee = [];

        for (var i = 0; i < team.length; i++) {
            var emp = team[i];
            var empTasks = emp.tasks || [];
            var empTotal = empTasks.length;
            var empDone = empTasks.filter(function(t) { return t.status === 'completed'; }).length;
            var empOverdue = empTasks.filter(function(t) { return t.status !== 'completed' && t.status !== 'skipped' && t.due_date && t.due_date < today; }).length;
            totalTasks += empTotal;
            completedTasks += empDone;
            overdueTasks += empOverdue;

            var empPct = empTotal > 0 ? Math.round(empDone / empTotal * 100) : 0;
            var startDate = emp.start_date ? new Date(emp.start_date) : null;
            var dayNum = startDate ? Math.floor((Date.now() - startDate) / 86400000) : 0;

            byEmployee.push({
                name: emp.first_name + ' ' + emp.last_name,
                department: emp.department,
                dayNum: dayNum,
                total: empTotal,
                done: empDone,
                overdue: empOverdue,
                pct: empPct,
                phase: emp.phase || 'unknown'
            });

            empTasks.forEach(function(t) {
                var p = t.phase || 'other';
                if (!byPhase[p]) byPhase[p] = { total: 0, done: 0 };
                byPhase[p].total++;
                if (t.status === 'completed') byPhase[p].done++;
            });
        }

        var overallPct = totalTasks > 0 ? Math.round(completedTasks / totalTasks * 100) : 0;

        var html = '<div style="max-width:900px;margin:0 auto">';
        html += '<h2 style="margin:0 0 4px;font-size:20px">📊 Team Onboarding Reports</h2>';
        html += '<p style="margin:0 0 20px;font-size:13px;color:var(--text-secondary)">' + team.length + ' active onboardings</p>';

        // Summary cards
        html += '<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:24px">';
        html += '<div class="card" style="padding:16px;text-align:center"><div style="font-size:28px;font-weight:700;color:var(--primary)">' + overallPct + '%</div><div style="font-size:11px;color:var(--text-secondary);text-transform:uppercase;letter-spacing:0.5px">Overall Progress</div></div>';
        html += '<div class="card" style="padding:16px;text-align:center"><div style="font-size:28px;font-weight:700">' + completedTasks + '</div><div style="font-size:11px;color:var(--text-secondary);text-transform:uppercase;letter-spacing:0.5px">Tasks Completed</div></div>';
        html += '<div class="card" style="padding:16px;text-align:center"><div style="font-size:28px;font-weight:700">' + (totalTasks - completedTasks) + '</div><div style="font-size:11px;color:var(--text-secondary);text-transform:uppercase;letter-spacing:0.5px">Remaining</div></div>';
        html += '<div class="card" style="padding:16px;text-align:center"><div style="font-size:28px;font-weight:700;color:' + (overdueTasks > 0 ? 'var(--danger)' : 'var(--success)') + '">' + overdueTasks + '</div><div style="font-size:11px;color:var(--text-secondary);text-transform:uppercase;letter-spacing:0.5px">Overdue</div></div>';
        html += '</div>';

        // Employee comparison table
        html += '<div class="card" style="padding:20px;margin-bottom:16px">';
        html += '<div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:12px"><h3 style="margin:0;font-size:15px">👥 Employee Progress Comparison</h3>';
        html += '<div class="status-legend"><span class="status-legend-item">🟢 On Track</span><span class="status-legend-item">🟡 At Risk</span><span class="status-legend-item">🔴 Behind</span></div></div>';
        html += '<div class="table-wrap"><table class="table">';
        html += '<thead><tr><th>Employee</th><th>Department</th><th>Day</th><th>Progress</th><th>Overdue</th><th>Status</th></tr></thead>';
        html += '<tbody>';
        byEmployee.sort(function(a, b) { return a.pct - b.pct; });
        for (var j = 0; j < byEmployee.length; j++) {
            var e = byEmployee[j];
            var status = '';
            var expectedPct = Math.min(100, Math.round(e.dayNum / 90 * 100));
            if (e.pct >= expectedPct - 10) status = '<span style="color:var(--success)">🟢 On Track</span>';
            else if (e.pct >= expectedPct - 25) status = '<span style="color:var(--warning)">🟡 At Risk</span>';
            else status = '<span style="color:var(--danger)">🔴 Behind</span>';

            html += '<tr>';
            html += '<td style="font-weight:500">' + esc(e.name) + '</td>';
            html += '<td>' + esc(e.department || '') + '</td>';
            html += '<td>Day ' + e.dayNum + '</td>';
            html += '<td style="min-width:150px">' + progressBar(e.pct) + '<span style="font-size:11px;color:var(--text-secondary)">' + e.done + '/' + e.total + ' (' + e.pct + '%)</span></td>';
            html += '<td>' + (e.overdue > 0 ? '<span class="badge badge-danger">' + e.overdue + ' overdue</span>' : '<span class="badge badge-success">None</span>') + '</td>';
            html += '<td>' + status + '</td>';
            html += '</tr>';
        }
        html += '</tbody></table></div>';
        html += '</div>';

        // Phase breakdown
        html += '<div class="card" style="padding:20px;margin-bottom:16px">';
        html += '<h3 style="margin:0 0 12px;font-size:15px">📈 Progress by Phase</h3>';
        var phaseLabels = { pre_boarding: 'Pre-boarding', company_onboarding: 'Company Onboarding', role_specific: 'Role-Specific', integration: 'Integration', ongoing: 'Ongoing' };
        var phaseOrder = ['pre_boarding', 'company_onboarding', 'role_specific', 'integration', 'ongoing'];
        for (var pi = 0; pi < phaseOrder.length; pi++) {
            var pk = phaseOrder[pi];
            var pd = byPhase[pk];
            if (!pd) continue;
            var ppct = pd.total > 0 ? Math.round(pd.done / pd.total * 100) : 0;
            html += '<div style="margin-bottom:12px">';
            html += '<div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px"><span style="font-weight:500">' + (phaseLabels[pk] || pk) + '</span><span style="color:var(--text-secondary)">' + pd.done + '/' + pd.total + ' (' + ppct + '%)</span></div>';
            if (PHASE_DESCRIPTIONS[pk]) html += '<div class="phase-description">' + esc(PHASE_DESCRIPTIONS[pk]) + '</div>';
            html += progressBar(ppct);
            html += '</div>';
        }
        html += '</div>';

        // Export button
        html += '<div style="text-align:right;margin-bottom:24px">';
        html += '<button onclick="exportManagerReport()" class="btn btn-light" style="padding:8px 16px;font-size:13px">📥 Export as CSV</button>';
        html += '</div>';

        html += '</div>';
        container.innerHTML = html;
    } catch(e) {
        container.innerHTML = '<div class="card" style="padding:20px;color:var(--danger)">Error loading reports: ' + esc(String(e)) + '</div>';
    }
}

function exportManagerReport() {
    var table = document.querySelector('.table-wrap table');
    if (!table) return;
    var rows = table.querySelectorAll('tr');
    var csv = [];
    rows.forEach(function(row) {
        var cells = row.querySelectorAll('th, td');
        var rowData = [];
        cells.forEach(function(cell) { rowData.push('"' + cell.textContent.replace(/"/g, '""').trim() + '"'); });
        csv.push(rowData.join(','));
    });
    var blob = new Blob([csv.join('\n')], { type: 'text/csv' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = 'team-onboarding-report.csv'; a.click();
    URL.revokeObjectURL(url);
    showToast('Report exported!', 'success');
}

/* =============================================================
   TEAM ONBOARDING GRID (MANAGER / HR)
   ============================================================= */
async function renderTeamOnboarding(el) {
    el.innerHTML = '<h1>🗂️ Team Onboarding Grid</h1><div id="grid-loading"><div class="loading-center"><div class="spinner lg"></div><div>Loading team grid...</div></div></div>';
    const data = await api('/api/team/onboarding-grid');
    if (!data || !data.cards) { el.innerHTML = '<div class="empty-state"><div class="icon">🗂️</div><h3>Unable to load team grid</h3><p>Please try refreshing.</p></div>'; return; }

    const cards = data.cards;
    const sum = data.summary || {};

    if (!cards.length) {
        el.innerHTML = '<h1>🗂️ Team Onboarding Grid</h1><div class="empty-state"><div class="icon">🎉</div><h3>No active onboardings</h3><p>Your team has no one currently onboarding.</p></div>';
        return;
    }

    const phaseNames = { pre_boarding: 'Pre-boarding', company_onboarding: 'Company', department_onboarding: 'Department', role_training: 'Role Training', other: 'Other' };

    // Filter / sort controls state
    let filterDept = '';
    let sortBy = 'start_date';
    const departments = [...new Set(cards.map(c => c.department).filter(Boolean))].sort();

    function renderGrid(filteredCards) {
        const gridEl = document.getElementById('team-grid-cards');
        if (!gridEl) return;
        if (!filteredCards.length) {
            gridEl.innerHTML = '<div class="empty-state"><div class="icon">🔍</div><p>No results match your filter</p></div>';
            return;
        }
        gridEl.innerHTML = filteredCards.map(c => {
            const name = ((c.first_name||'') + ' ' + (c.last_name||'')).trim();
            const ds = daysSince(c.start_date);
            let dayLabel = '';
            if (ds === null) dayLabel = '';
            else if (ds < 0) dayLabel = `<span class="badge badge-warning">${Math.abs(ds)}d until start</span>`;
            else if (ds === 0) dayLabel = '<span class="badge badge-success">Starting today!</span>';
            else dayLabel = `<span class="badge badge-secondary">Day ${ds}</span>`;

            // Traffic light
            let trackBadge = '';
            if (ds > 0) {
                const expectedPct = Math.min(100, Math.round((ds / 90) * 100));
                if (c.progress >= expectedPct - 10) trackBadge = '<span class="badge badge-success" title="On track">🟢 On Track</span>';
                else if (c.progress >= expectedPct - 25) trackBadge = '<span class="badge badge-warning" title="At risk">🟡 At Risk</span>';
                else trackBadge = '<span class="badge badge-danger" title="Behind">🔴 Behind</span>';
            }

            // Phase mini-bars
            const phaseHtml = Object.entries(c.phases || {}).map(([key, v]) => {
                const pp = v.total > 0 ? Math.round(v.completed / v.total * 100) : 0;
                return `<div style="flex:1;min-width:90px">
                    <div style="font-size:10px;color:var(--text-light);margin-bottom:2px">${esc(phaseNames[key] || key)}</div>
                    <div style="height:6px;background:var(--bg);border-radius:3px;overflow:hidden">
                        <div style="height:100%;width:${pp}%;background:${pp===100?'var(--success)':pp>50?'var(--primary)':'var(--warning)'};border-radius:3px;transition:width .3s"></div>
                    </div>
                    <div style="font-size:10px;color:var(--text-light);margin-top:1px">${v.completed}/${v.total}</div>
                </div>`;
            }).join('');

            // Blocked tasks warning
            const blockedHtml = c.blocked_tasks.length > 0
                ? `<div style="margin-top:10px;padding:8px;background:var(--danger-light,#fff5f5);border-radius:var(--radius-sm);font-size:12px;color:var(--danger)">
                    ⚠️ ${c.blocked_tasks.length} blocked: ${c.blocked_tasks.map(b => esc(b.title)).join(', ')}
                  </div>` : '';

            return `<div class="card" style="cursor:pointer;transition:transform .15s,box-shadow .15s;position:relative"
                         onclick="navigate('employee-detail',${c.id})"
                         onmouseenter="this.style.transform='translateY(-2px)';this.style.boxShadow='0 4px 12px rgba(0,0,0,0.08)'"
                         onmouseleave="this.style.transform='';this.style.boxShadow=''">
                ${c.overdue_count > 0 ? `<div style="position:absolute;top:10px;right:10px"><span class="badge badge-danger">⚠️ ${c.overdue_count} overdue</span></div>` : ''}
                <div style="display:flex;align-items:center;gap:12px;margin-bottom:12px">
                    ${avatar(name, 48)}
                    <div style="flex:1">
                        <div style="font-weight:700;font-size:15px">${esc(name)}</div>
                        <div style="font-size:12px;color:var(--text-light)">${esc(c.role_title)} · ${esc(c.department)}</div>
                        <div style="font-size:11px;color:var(--text-light)">${esc(c.location_mode||'')}</div>
                    </div>
                </div>
                <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px">
                    ${trackBadge} ${phaseBadge(currentPhaseFromStart(c.start_date))} ${dayLabel}
                </div>
                <div style="margin-bottom:8px">
                    <div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px">
                        <span style="font-weight:600">${c.completed_tasks}/${c.total_tasks} tasks</span>
                        <span style="font-weight:700;color:var(--primary)">${c.progress}%</span>
                    </div>
                    ${progressBar(c.progress)}
                </div>
                <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:6px">${phaseHtml}</div>
                <div style="display:flex;gap:12px;margin-top:10px;font-size:11px;color:var(--text-light)">
                    <span>📅 ${c.due_this_week} due this week</span>
                    ${c.buddy_name ? `<span>🤝 ${esc(c.buddy_name)}</span>` : ''}
                </div>
                ${blockedHtml}
            </div>`;
        }).join('');
    }

    function applyFilters() {
        let result = [...cards];
        if (filterDept) result = result.filter(c => c.department === filterDept);
        if (sortBy === 'progress') result.sort((a, b) => a.progress - b.progress);
        else if (sortBy === 'overdue') result.sort((a, b) => b.overdue_count - a.overdue_count);
        else if (sortBy === 'name') result.sort((a, b) => (a.first_name + a.last_name).localeCompare(b.first_name + b.last_name));
        else result.sort((a, b) => (b.start_date || '').localeCompare(a.start_date || ''));
        renderGrid(result);
    }

    el.innerHTML = `
        <h1>🗂️ Team Onboarding Grid</h1>
        <div class="stats-row" style="margin-bottom:20px">
            <div class="stat-card"><div class="stat-icon blue">👥</div><div><div class="stat-value">${sum.total_active||0}</div><div class="stat-label">Active</div></div></div>
            <div class="stat-card"><div class="stat-icon green">✅</div><div><div class="stat-value">${sum.on_track||0}</div><div class="stat-label">On Track</div></div></div>
            <div class="stat-card"><div class="stat-icon red">⚠️</div><div><div class="stat-value" style="color:${(sum.total_overdue||0)>0?'var(--danger)':'inherit'}">${sum.total_overdue||0}</div><div class="stat-label">Overdue Tasks</div></div></div>
            <div class="stat-card"><div class="stat-icon orange">📊</div><div><div class="stat-value">${sum.avg_progress||0}%</div><div class="stat-label">Avg Progress</div></div></div>
        </div>
        <details style="margin-bottom:16px;font-size:12px;color:var(--text-light);">
            <summary style="cursor:pointer;font-weight:500;">ℹ️ How to read this grid</summary>
            <div style="margin-top:8px;padding:12px;background:var(--bg-light,#f8f9fa);border-radius:8px;display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px;font-size:11px;">
                <div>🟢 <strong>On Track</strong> — Within 10% of expected progress for day count</div>
                <div>🟡 <strong>At Risk</strong> — 10-25% behind expected progress</div>
                <div>🔴 <strong>Behind</strong> — More than 25% behind expected progress</div>
                <div>📊 <strong>Phase bars</strong> — Completion within each onboarding phase</div>
                <div>⚠️ <strong>Blocked</strong> — Tasks waiting on a prerequisite</div>
                <div>📅 <strong>Due this week</strong> — Tasks due in the next 7 days</div>
            </div>
        </details>
        <div style="display:flex;gap:12px;align-items:center;margin-bottom:16px;flex-wrap:wrap">
            <select id="grid-filter-dept" style="padding:6px 10px;border:1px solid var(--border-light);border-radius:var(--radius-sm);background:var(--card-bg);color:var(--text);font-size:13px">
                <option value="">All Departments</option>
                ${departments.map(d => `<option value="${esc(d)}">${esc(d)}</option>`).join('')}
            </select>
            <select id="grid-sort" style="padding:6px 10px;border:1px solid var(--border-light);border-radius:var(--radius-sm);background:var(--card-bg);color:var(--text);font-size:13px">
                <option value="start_date">Newest First</option>
                <option value="progress">Lowest Progress</option>
                <option value="overdue">Most Overdue</option>
                <option value="name">Name A–Z</option>
            </select>
            <button class="btn btn-sm btn-primary" onclick="showBatchMeetGreetForTeam([${cards.map(c=>c.id).join(',')}])">📅 Batch Schedule Meet &amp; Greets</button>
        </div>
        <div id="team-grid-cards" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:16px"></div>
    `;

    document.getElementById('grid-filter-dept').onchange = function() { filterDept = this.value; applyFilters(); };
    document.getElementById('grid-sort').onchange = function() { sortBy = this.value; applyFilters(); };
    applyFilters();
}

                        </div>

            ${(assigneeData.blockers || []).length > 0 ? `
                <div style="margin-top:12px">
                    <h3 style="font-size:14px;margin:0 0 8px">💬 Recent Blocker Comments</h3>
                    ${assigneeData.blockers.map(b => `
                        <div style="padding:8px 12px;background:var(--warning-light);border-radius:var(--radius-sm);margin-top:6px;font-size:13px">
                            <div style="display:flex;justify-content:space-between;align-items:center">
                                <strong>${esc(b.title)}</strong>
                                <span style="font-size:11px;color:var(--text-light)">${formatDate(b.created_at)}</span>
                            </div>
                            <div style="color:var(--text-light);margin-top:2px">${esc(b.comment)}</div>
                        </div>
                    `).join('')}

            ${(assigneeData.this_week || []).length > 0 ? `
                <div style="margin-top:16px">
                    <h3 style="font-size:14px;margin:0 0 8px">📋 Their Tasks This Week</h3>

                        <thead><tr><th>Task</th><th>Phase</th><th>Due</th><th>Status</th></tr></thead>
                        <tbody>${assigneeData.this_week.map(t => `

                        `).join('')}</tbody>
                    </table></div>
                </div>
            ` : '<div style="margin-top:16px;color:var(--text-light);font-size:13px">✅ No pending tasks this week.</div>'}
        </div>`;
    }

    // ── Buddy task checklists (existing) ──────────────────────
    html += assignments.map(a => {
        const ds = daysSince(a.start_date);
        const empName = a.employee_name || ((a.first_name || '') + ' ' + (a.last_name || '')).trim();
        return `<div class="card">
            <div style="display:flex;align-items:center;gap:16px;margin-bottom:16px">
                ${avatar(empName, 48)}
                <div style="flex:1"><h2 style="margin-bottom:2px">${esc(empName)}</h2>
                    <div style="font-size:12px;color:var(--text-light)">${esc(a.department)} · Started ${ds > 0 ? ds + ' days ago' : 'in ' + Math.abs(ds) + ' days'}</div></div>
            </div>

                <span class="task-meta">${formatDate(t.due_date)}</span>
            </div>`).join('')}

    }).join('');

    content.innerHTML = html;
}

async function completeBuddyTask(taskId, done) {
    const r = await api('/api/me/buddy-tasks/' + taskId + '/complete', { method: 'PUT', body: { completed: done } });
    if (r) showToast(done ? 'Task completed!' : 'Task reopened');
}

/* =============================================================
   EMPLOYEE SELF-SERVICE: MY ONBOARDING (ENHANCED)
   ============================================================= */
async function renderMyOnboarding(el) {
    el.innerHTML = '<div class="loading-center"><div class="spinner lg"></div></div>';
    const [profileData, onbData] = await Promise.all([api('/api/me/profile'), api('/api/me/onboarding')]);
    if (!onbData) { el.innerHTML = '<div class="empty-state"><div class="icon">🏠</div><h3>No onboarding information</h3><p>Your onboarding hasn\'t started yet. Check back soon!</p></div>'; return; }

    const user = profileData || state.user || {};
    const pct = onbData.progress || 0;
    const myPct = onbData.my_progress || 0;
    const myDone = onbData.my_completed || 0;
    const myTotal = onbData.my_total || 0;
    const allDone = onbData.completed_tasks || 0;
    const allTotal = onbData.total_tasks || 0;
    const startDate = user.start_date || onbData.start_date;
    const phase = currentPhaseFromStart(startDate);
    const ds = daysSince(startDate);

    // Find next actionable task for the employee
    const allTasks = onbData.tasks || [];
    const myActionable = allTasks.filter(t =>
        t.status !== 'completed' &&
        (t.is_acknowledgment || t.category === 'employee') &&
        !(t.depends_on_task_id && allTasks.find(d => d.id === t.depends_on_task_id && d.status !== 'completed'))
    ).sort((a, b) => {
        if (a.due_date && b.due_date) return a.due_date.localeCompare(b.due_date);
        if (a.due_date) return -1;
        if (b.due_date) return 1;
        return 0;
    });
    const nextTask = myActionable[0];

    el.innerHTML = `
        <div class="welcome-card">
            <h1>Welcome${(profileData && profileData.employee && profileData.employee.is_rehire) ? ' back' : ''} to Celito, ${esc(user.display_name || user.first_name || 'Team Member')}! ${(profileData && profileData.employee && profileData.employee.is_rehire) ? '🔄🎉' : '🎉'}</h1>
            <p>${(profileData && profileData.employee && profileData.employee.is_rehire) ? `Great to have you back! Some tasks from your previous time have been auto-skipped. You can mark others as "Already Done" for HR review.` : ds > 0 ? `Day ${ds} of your onboarding journey. Keep up the great work!` : ds === 0 ? `Today is your first day — welcome! 🎉` : `${Math.abs(ds)} day${Math.abs(ds)!==1?'s':''} until your start date — here's what's being prepared for your arrival!`}</p>
        </div>

        ${phaseStepperHTML(phase)}

        ${nextTask ? `<div style="background:var(--success-light);border:2px solid var(--success);border-radius:var(--radius);padding:20px;margin-bottom:24px;display:flex;align-items:center;gap:16px;flex-wrap:wrap">
            <div style="font-size:28px">👉</div>
            <div style="flex:1;min-width:200px">
                <div style="font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:0.5px;color:var(--success);margin-bottom:4px">Your Next Task</div>
                <div style="font-size:16px;font-weight:600">${esc(nextTask.title)}</div>
                ${nextTask.due_date ? `<div style="font-size:13px;color:var(--text-light);margin-top:2px">Due ${formatDate(nextTask.due_date)}</div>` : ''}
                ${nextTask.description ? `<div style="font-size:13px;color:var(--text-light);margin-top:4px">${esc(nextTask.description).substring(0, 120)}${nextTask.description.length > 120 ? '...' : ''}</div>` : ''}
            </div>
            <div style="display:flex;gap:8px;align-items:center">
                ${nextTask.resource_url ? `<a href="${esc(nextTask.resource_url)}" target="_blank" class="btn btn-secondary btn-sm" style="text-decoration:none">📎 View Resource</a>` : ''}
                ${(nextTask.is_acknowledgment || nextTask.category === 'employee') ? `<button class="btn btn-success" onclick="completeMyTask(${nextTask.id},true)">✓ Complete</button>` : ''}
            </div>
        </div>` : ''}

        <div style="display:flex;gap:24px;flex-wrap:wrap;margin-bottom:24px">
            <div style="text-align:center">
                ${progressRingSVG(myPct, 130)}
                <div style="margin-top:8px;font-size:14px;font-weight:600;color:var(--secondary)">Your Progress</div>
                <div style="font-size:12px;color:var(--text-light)">${myDone} of ${myTotal} tasks completed</div>
                <div style="margin-top:10px;font-size:12px;color:var(--text-muted);border-top:1px solid var(--border-light);padding-top:8px">
                    Overall onboarding: ${pct}%<br><span style="font-size:11px">${allDone}/${allTotal} tasks across all teams</span>
                </div>
            </div>
            <div style="flex:1;min-width:300px">
                <div class="card"><h2>📅 This Week's Focus</h2><div id="week-focus"></div></div>
            </div>
            <div style="width:240px">
                <div class="card"><h2>👤 Key Contacts</h2><div id="key-contacts"></div></div>
            </div>
        </div>

        <div id="phase-sections"></div>`;

    // This week's focus
    const tasks = onbData.tasks || [];
    const now = new Date();
    const weekStart = new Date(now); weekStart.setDate(now.getDate() - now.getDay() + 1);
    const weekEnd = new Date(weekStart); weekEnd.setDate(weekStart.getDate() + 5);
    const weekTasks = tasks.filter(t => {
        if (!t.due_date) return false;
        const d = new Date(t.due_date);
        return d >= weekStart && d <= weekEnd;
    });
    const overdueTasks = tasks.filter(t => t.status !== 'completed' && t.due_date && new Date(t.due_date) < weekStart);
    const focusEl = document.getElementById('week-focus');
    let focusHtml = '';
    if (overdueTasks.length) {
        focusHtml += `<div style="background:var(--danger-light);border-radius:var(--radius-sm);padding:8px 12px;margin-bottom:8px;font-size:12px;color:var(--danger)">

    }
    if (!weekTasks.length && !overdueTasks.length) { focusHtml = '<div style="font-size:13px;color:var(--text-light);padding:8px 0">No tasks due this week. 🎉</div>'; }
    else {
        (overdueTasks.concat(weekTasks)).slice(0, 10).forEach(t => {
            const isOverdue = t.status !== 'completed' && t.due_date && daysUntil(t.due_date) < 0;
            focusHtml += `<div class="checklist-item" style="padding:6px 0">
                ${(t.is_acknowledgment || t.category === 'employee') && t.status !== 'completed' ? `<button class="btn btn-xs btn-success" onclick="completeMyTask(${t.id},true)">Complete</button>` : `<input type="checkbox" ${t.status==='completed'?'checked':''} disabled>`}

                <span class="task-meta">${formatDate(t.due_date)}</span>
                ${isOverdue ? '<span class="badge badge-danger" style="font-size:10px">overdue</span>' : ''}
            </div>`;
        });
    }
    focusEl.innerHTML = focusHtml;

    // Key contacts
    const contactsEl = document.getElementById('key-contacts');
    const contacts = onbData.contacts || [];
    if (!contacts.length) { contactsEl.innerHTML = '<div style="font-size:13px;color:var(--text-light)">Contacts will appear here.</div>'; }
    else { contactsEl.innerHTML = contacts.map(c => `<div class="contact-item" style="padding:8px 0">
        ${avatar(c.name, 28)}
        <div class="contact-info"><div class="contact-name" style="font-size:12px">${esc(c.name)}</div><div class="contact-role" style="font-size:10px">${esc(c.role)}</div></div>
    </div>`).join(''); }

    // Phase sections — pre-boarding employees see only pre_boarding phase; others see all
    const isPreBoarding = ds < 0;
    const phasesEl = document.getElementById('phase-sections');
    let phtml = '';
    for (const p of PHASE_ORDER) {
        const pTasks = tasks.filter(t => t.phase === p);
        if (!pTasks.length) continue;
        // For pre-boarding employees, collapse future phases and mark them as upcoming
        const isFuturePhase = isPreBoarding && p !== 'pre_boarding';
        const collapsed = isFuturePhase ? ' collapsed' : '';
        const done = pTasks.filter(t => t.status === 'completed').length;
        const ppct = Math.round((done / pTasks.length) * 100);
        phtml += `<div class="card" style="margin-bottom:12px${isFuturePhase ? ';opacity:0.6' : ''}">
            <div class="checklist-group-header${collapsed}" role="button" tabindex="0" aria-expanded="${!isFuturePhase}" onclick="toggleCollapse(this)" onkeydown="handleCollapseKeydown(event,this)">
                <span class="toggle" aria-hidden="true">▼</span> ${esc(PHASE_LABELS[p])} ${isFuturePhase ? '<span class="badge badge-secondary">upcoming</span>' : `<span class="badge badge-secondary">${done}/${pTasks.length}</span>`}
                <div style="flex:1;max-width:200px;margin-left:auto">${progressBar(ppct)}</div>
            </div>
            <div class="collapsible-content${collapsed}">${pTasks.map(t => {
                const blockedBy = t.depends_on_task_id && tasks.find(d => d.id === t.depends_on_task_id && d.status !== 'completed');
                const isPendingReview = t.status === 'pending_review';
                const isSkippedRehire = t.status === 'skipped' && (t.completed_by||'').includes('system-rehire');
                const isRehire = (profileData && profileData.employee && profileData.employee.is_rehire);
                const canMarkAlreadyDone = isRehire && !blockedBy && t.status === 'pending' && !t.is_acknowledgment;
                return `<div class="checklist-item ${t.parent_task_id?'subtask':''} ${blockedBy?'blocked':''} ${isPendingReview?'pending-review':''} ${isSkippedRehire?'skipped-rehire':''}">
                    ${isPendingReview ? '<span class="badge badge-warning" style="font-size:10px;margin-right:4px">⏳ Pending HR Review</span>' : isSkippedRehire ? '<span class="badge badge-secondary" style="font-size:10px;margin-right:4px">⏭️ Auto-skipped (rehire)</span>' : (t.is_acknowledgment || t.category === 'employee') && t.status !== 'completed' && !blockedBy ? `<button class="btn btn-xs btn-success" onclick="completeMyTask(${t.id},true)">✓</button>` : `<input type="checkbox" ${t.status==='completed'?'checked':''} disabled>`}
                    <span class="task-title ${t.status==='completed'||isSkippedRehire?'completed':''}">${blockedBy?'🔒 ':''}${esc(t.title)}</span>
                    ${t.is_security_critical ? '<span class="badge badge-security">🔴</span>' : ''}
                    ${canMarkAlreadyDone ? `<button class="btn btn-xs btn-secondary" onclick="markAlreadyDone(${t.id})" title="I completed this in my previous time at Celito">Already Done</button>` : ''}
                    ${blockedBy ? `<a href="#" onclick="event.preventDefault();scrollToTask('${esc(blockedBy.title).replace(/'/g, "\\'")}');return false" class="badge badge-secondary" style="font-size:11px;cursor:pointer;text-decoration:none">Complete "${esc(blockedBy.title)}" first ↗</a>` : ''}
                    ${t.resource_url ? `<a href="${esc(t.resource_url)}" target="_blank" style="font-size:12px;margin-right:4px" title="View resource">📎</a>` : ''}
                    <span class="task-meta">${esc(t.assigned_to||'')} · ${formatDate(t.due_date)}</span>
                    <button class="task-action-btn" onclick="event.stopPropagation();showTaskCommentModal(${t.id},'${esc(t.title).replace(/'/g,"\\&#39;")}')" title="Comment or flag blocker">💬</button>
                </div>`;
            }).join('')}</div>
        </div>`;
    }
    phasesEl.innerHTML = phtml;

    // Learning path for training tasks
    const trainingTasks = tasks.filter(t => t.category === 'training' || t.phase === 'role_training');
    if (trainingTasks.length) {
        const lpHtml = renderLearningPath(trainingTasks);
        phasesEl.insertAdjacentHTML('afterend', `<div class="card" style="margin-top:16px"><div class="card-header"><h2>🗺️ Learning Path</h2></div>${lpHtml}</div>`);
    }
}

function renderLearningPath(trainingTasks) {
    // Sort by due_date, then by phase order
    const sorted = [...trainingTasks].sort((a, b) => {
        if (a.due_date && b.due_date) return a.due_date.localeCompare(b.due_date);
        return (a.due_offset_days||0) - (b.due_offset_days||0);
    });
    const firstIncomplete = sorted.findIndex(t => t.status !== 'completed');
    return `<div class="learning-path" style="padding:16px">${sorted.map((t, i) => {
        const done = t.status === 'completed';
        const current = i === firstIncomplete;
        const dotClass = done ? 'done' : current ? 'current' : '';
        return `<div class="learning-node">
            <div class="learning-connector">
                <div class="learning-dot ${dotClass}">${done ? '✓' : current ? '▶' : (i+1)}</div>
                <div class="learning-line"></div>
            </div>
            <div class="learning-card ${current ? 'current' : ''}">
                <h4>${done ? '<del>' : ''}${esc(t.title)}${done ? '</del>' : ''} ${done ? '✅' : current ? '🔵' : '⬜'}</h4>
                <div class="learning-meta">
                    ${CATEGORY_ICONS[t.category]||'📋'} ${esc(CATEGORY_LABELS[t.category]||t.category||'')}
                    ${t.due_date ? ' · Due ' + formatDate(t.due_date) : ''}
                    ${t.assigned_to ? ' · ' + esc(t.assigned_to) : ''}
                    ${t.resource_url ? ` · <a href="${esc(t.resource_url)}" target="_blank" style="font-size:11px">📎 Resource</a>` : ''}
                </div>
                ${t.description ? `<div style="font-size:12px;color:var(--text-light);margin-top:4px">${esc(t.description)}</div>` : ''}
            </div>
        </div>`;
    }).join('')}</div>`;
}

async function completeMyTask(taskId, completed) {
    if (!completed) return;
    if (window._completingTask) return;
    window._completingTask = true;
    try {
        const r = await api('/api/me/tasks/' + taskId + '/complete', { method: 'PUT' });
        if (r) {
            showToast('Task completed! 🎉');
            // Preserve scroll position across re-render
            var scrollY = window.scrollY;
            const main = document.getElementById('main-content');
            if (state.currentView === 'my-tasks') await renderMyTasks(main);
            else if (state.currentView === 'this-week') await renderThisWeek(main);
            else await renderMyOnboarding(main);
            setTimeout(function() { window.scrollTo(0, scrollY); }, 50);
            // Check if a phase just completed — triggers celebration confetti
            try {
                const onbData = await api('/api/me/onboarding');
                if (onbData && onbData.tasks) checkPhaseCompletion(onbData.tasks, 'me');
            } catch(e) { /* non-critical */ }
        }
    } finally {
        window._completingTask = false;
    }
}

async function markAlreadyDone(taskId) {
    if (!confirm('Mark this task as already completed from your previous time at Celito?\n\nHR will review and confirm.')) return;
    const r = await api('/api/me/tasks/' + taskId + '/already-completed', { method: 'PUT' });
    if (r) {
        showToast('Marked as already done — HR will review ✓', 'info');
        var scrollY = window.scrollY;
        const main = document.getElementById('main-content');
        if (state.currentView === 'my-tasks') await renderMyTasks(main);
        else await renderMyOnboarding(main);
        setTimeout(function() { window.scrollTo(0, scrollY); }, 50);
    }
}

   THIS WEEK VIEW (EMPLOYEE)
   ============================================================= */
async function renderThisWeek(el) {
    el.innerHTML = '<div class="loading-center"><div class="spinner lg"></div></div>';
    const data = await api('/api/me/this-week');
    if (!data) { el.innerHTML = '<div class="empty-state"><div class="icon">📅</div><h3>No schedule data</h3></div>'; return; }

    const tasks = data.tasks || [];
    const overdue = data.overdue || [];
    const days = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday'];
    const today = new Date().getDay(); // 0=Sun

    // Count tasks per status
    const totalWeek = tasks.length;
    const doneWeek = tasks.filter(t => t.status === 'completed').length;
    const weekPct = totalWeek > 0 ? Math.round(doneWeek / totalWeek * 100) : 100;
    let weekMsg = '';
    if (weekPct === 100 && totalWeek > 0) weekMsg = "🎉 All done this week! You're ahead of the game.";
    else if (weekPct >= 75) weekMsg = "💪 Almost there — just a few more to go!";
    else if (weekPct >= 50) weekMsg = "👍 Halfway through this week's tasks.";
    else weekMsg = "Let's make progress — you've got this!";

    el.innerHTML = `
        <h1>📅 This Week</h1>
        ${data.message ? '<div style="font-size:14px;color:var(--text-light);margin-bottom:8px">' + esc(data.message) + '</div>' : ''}
        <div style="display:flex;align-items:center;gap:16px;margin-bottom:20px;flex-wrap:wrap">
            <div style="flex:1;min-width:200px">${progressBar(weekPct)}</div>
            <span style="font-size:13px;color:var(--text-light)">${weekMsg}</span>
        </div>

        ${overdue.length ? '<div class="card" style="border-left:4px solid var(--danger)">' +
            '<h2 style="color:var(--danger)">⚠️ Catch Up (' + overdue.length + ' overdue)</h2>' +
            overdue.map(function(t) {
                return '<div class="checklist-item">' +
                    ((t.is_acknowledgment || t.category === 'employee') ? '<button class="btn btn-xs btn-success" onclick="completeMyTask(' + t.id + ',true)">✓</button>' : '<input type="checkbox" disabled>') +
                    ' <span class="task-title">' + esc(t.title) + '</span>' +
                    (t.resource_url ? ' <a href="' + esc(t.resource_url) + '" target="_blank" style="font-size:12px">📎</a>' : '') +
                    ' <span class="badge badge-danger">' + formatDate(t.due_date) + '</span></div>';
            }).join('') +
        '</div>' : ''}

        <div class="week-grid">${days.map(function(day, i) {
            var dayNum = i + 1;
            var dayTasks = tasks.filter(function(t) { return new Date(t.due_date).getDay() === dayNum; });
            var isToday = today === dayNum;
            return '<div class="week-day" ' + (isToday ? 'id="today-column"' : '') + '>' +
                '<div class="week-day-header ' + (isToday ? 'today' : '') + '">' + day + (isToday ? ' (Today)' : '') + '</div>' +
                '<div class="week-day-body">' + (dayTasks.length ? dayTasks.map(function(t) {
                    return '<div class="week-task ' + (t.status==='completed' ? 'done' : '') + ' ' + (t.is_acknowledgment ? 'ack' : '') + '">' +
                        (CATEGORY_ICONS[t.category]||'📋') + ' ' + esc(t.title) +
                        (t.resource_url ? ' <a href="' + esc(t.resource_url) + '" target="_blank" style="font-size:11px">📎</a>' : '') +
                        ((t.is_acknowledgment || t.category === 'employee') && t.status !== 'completed' ? ' <button class="btn btn-xs btn-success" style="float:right" onclick="event.stopPropagation();completeMyTask(' + t.id + ',true)">✓</button>' : '') +
                    '</div>';
                }).join('') : '<div style="font-size:12px;color:var(--text-muted);padding:8px">No tasks</div>') + '</div></div>';
        }).join('')}</div>`;

    // Auto-scroll to today on mobile
    var todayCol = document.getElementById('today-column');
    if (todayCol && window.innerWidth <= 768) {
        todayCol.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }
}

async function renderMyBuddy(container) {

        var data = await api('/api/me/buddy');
        if (!data) { container.innerHTML = '<div class="empty-state"><div class="icon">🧑‍🤝‍🧑</div><h3>Unable to load buddy info</h3></div>'; return; }

        var buddy = data.buddy;
        var buddyTasks = data.tasks || [];

        if (!buddy) {
            container.innerHTML = '<div class="card" style="padding:40px;text-align:center">' +
                '<div style="font-size:48px;margin-bottom:16px">🧑‍🤝‍🧑</div>' +
                '<h2 style="margin:0 0 8px">No Buddy Assigned Yet</h2>' +
                '<p style="color:var(--text-secondary);max-width:400px;margin:0 auto">A buddy will be assigned to help you settle in. Check back soon or ask your manager.</p>' +

            <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
            <button class="btn btn-primary" onclick="doBatchMeetGreetSchedule(${empId})">📅 Schedule All</button>
        </div>
    `);
}

async function doBatchMeetGreetSchedule(empId) {
    const mode = document.querySelector('input[name="mg-batch-mode"]:checked')?.value || 'single';
    let body;

    if (mode === 'single') {
        const d = document.getElementById('mg-batch-date')?.value;
        if (!d) { showToast('Pick a date', 'warning'); return; }
        // Get IDs of all unscheduled meet-and-greets for this employee
        const data = await api('/api/employees/' + empId + '/meet-greets');
        const ids = (data?.meet_greets || data || [])
            .filter(m => !m.completed && !m.scheduled_date)
            .map(m => m.id);
        body = { meet_greet_ids: ids, scheduled_date: d };
    } else {
        const s = document.getElementById('mg-range-start')?.value;
        const e = document.getElementById('mg-range-end')?.value;
        const slots = parseInt(document.getElementById('mg-slots-per-day')?.value || '4');
        if (!s || !e) { showToast('Pick start and end dates', 'warning'); return; }
        if (s > e) { showToast('End date must be after start date', 'warning'); return; }
        body = { employee_ids: [empId], date_range_start: s, date_range_end: e, slots_per_day: slots };
    }

    const r = await api('/api/meet-greets/batch-schedule', { method: 'POST', body });
    if (r && r.ok) {
        showToast(`✅ ${r.scheduled} meet & greet${r.scheduled !== 1 ? 's' : ''} scheduled`, 'success');
        closeModal();
        render();
    }
}

            <div style="font-size:14px;margin-bottom:8px">Met <strong>${met}</strong> of <strong>${mgs.length}</strong> people</div>

                    const statusBadge = m.completed
                        ? '<span class="badge badge-success">✅ Met</span>'

                            : '<span class="badge badge-warning">⏳ Pending</span>';
                    return `<div class="meet-card ${m.completed?'met':''}" style="position:relative">

                        <h4 style="margin:0 0 2px">${esc(m.contact_name)}</h4>

async function submitSurvey(surveyId) {
    // Validate that overall rating is provided
    var overallVal = parseInt(document.querySelector('[data-name="overall_' + surveyId + '"]')?.dataset.value || '0');
    if (!overallVal || overallVal < 1) {
        showToast('Please provide at least an overall rating before submitting.', 'warning');
        return;
    }
    const responses = [
        { question: "How's your onboarding going?", rating: parseInt(document.querySelector(`[data-name="overall_${surveyId}"]`)?.dataset.value || '0') },
        { question: "What's been most helpful?", answer: document.getElementById('sv-helpful-' + surveyId)?.value || '' },
        { question: "What's been missing or confusing?", answer: document.getElementById('sv-missing-' + surveyId)?.value || '' },
        { question: "Manager support", rating: parseInt(document.querySelector(`[data-name="manager_${surveyId}"]`)?.dataset.value || '0') },
        { question: "Buddy support", rating: parseInt(document.querySelector(`[data-name="buddy_${surveyId}"]`)?.dataset.value || '0') },
        { question: "Other feedback", answer: document.getElementById('sv-other-' + surveyId)?.value || '' },
    ];
    const r = await api('/api/me/surveys/' + surveyId + '/respond', { method: 'POST', body: { responses } });
    if (r) { showToast('Survey submitted! Thank you 🎉'); renderMySurveys(document.getElementById('main-content')); }
}

            '<td>' + formatDate(t.due_date) + (isOverdue ? ' <span class="badge badge-danger">late</span>' : '') + '</td>' +

        if (window._myTasksShowOnlyMine) {
            tasks = tasks.filter(function(t) {
                return t.is_acknowledgment || t.category === 'employee' ||
                    (t.assigned_email && t.assigned_email.toLowerCase() === userEmail) ||
                    (t.assigned_to && userName && t.assigned_to.toLowerCase().includes(userName));
            });
        }
        if (window._myTasksHideCompleted) {
            tasks = tasks.filter(function(t) { return t.status !== 'completed'; });
        }
        if (window._myTasksSearch) {
            var q = window._myTasksSearch.toLowerCase();
            tasks = tasks.filter(function(t) { return (t.title||'').toLowerCase().includes(q) || (t.category||'').toLowerCase().includes(q); });
        }

        var grouping = window._myTasksGrouping || 'urgency';
        var tableHeader = '<thead><tr><th>Task</th><th>Phase</th><th>Category</th><th>Due</th><th>Status</th></tr></thead>';
        var bodyHtml = '';

        if (grouping === 'urgency') {
            var today = new Date().toISOString().slice(0,10);
            var weekEnd = new Date(Date.now() + 7*86400000).toISOString().slice(0,10);
            var nextWeekEnd = new Date(Date.now() + 14*86400000).toISOString().slice(0,10);
            var groupDefs = [
                { key: 'overdue', label: '⚠️ Overdue', style: 'background:var(--danger-light);border-left:3px solid var(--danger);' },
                { key: 'today', label: '📌 Due Today', style: 'background:var(--warning-light);border-left:3px solid var(--warning);' },
                { key: 'thisWeek', label: '📅 Due This Week', style: '' },
                { key: 'nextWeek', label: '📋 Next Week', style: '' },
                { key: 'later', label: '📆 Later', style: '' },
                { key: 'noDue', label: '📝 No Due Date', style: '' }
            ];
            var buckets = {};
            groupDefs.forEach(function(g) { buckets[g.key] = []; });
            tasks.forEach(function(t) {
                if (t.status === 'completed') { buckets.later.push(t); return; }
                if (!t.due_date) { buckets.noDue.push(t); return; }
                if (t.due_date < today) buckets.overdue.push(t);
                else if (t.due_date === today) buckets.today.push(t);
                else if (t.due_date <= weekEnd) buckets.thisWeek.push(t);
                else if (t.due_date <= nextWeekEnd) buckets.nextWeek.push(t);
                else buckets.later.push(t);
            });
            groupDefs.forEach(function(g) {
                var items = buckets[g.key];
                if (!items.length) return;
                bodyHtml += '<div style="margin-bottom:16px">';
                bodyHtml += '<div style="font-weight:600;font-size:13px;padding:8px 12px;border-radius:4px;margin-bottom:4px;display:flex;align-items:center;justify-content:space-between;' + g.style + '">';
                bodyHtml += g.label + ' <span style="font-size:12px;font-weight:400;color:var(--text-secondary)">' + items.length + ' task' + (items.length !== 1 ? 's' : '') + '</span></div>';
                bodyHtml += '<div class="table-wrap"><table>' + tableHeader + '<tbody>';
                items.forEach(function(t) { bodyHtml += renderTaskRow(t); });
                bodyHtml += '</tbody></table></div></div>';
            });
        } else if (grouping === 'category') {
            var catGroups = {};
            tasks.forEach(function(t) {
                var cat = t.category || 'other';
                if (!catGroups[cat]) catGroups[cat] = [];
                catGroups[cat].push(t);
            });
            Object.keys(catGroups).sort().forEach(function(cat) {
                var items = catGroups[cat];
                var icon = (typeof CATEGORY_ICONS !== 'undefined' && CATEGORY_ICONS[cat]) || '📋';
                var label = (typeof CATEGORY_LABELS !== 'undefined' && CATEGORY_LABELS[cat]) || cat;
                bodyHtml += '<div style="margin-bottom:16px">';
                bodyHtml += '<div style="font-weight:600;font-size:13px;padding:8px 12px;border-radius:4px;margin-bottom:4px;display:flex;align-items:center;justify-content:space-between">';
                bodyHtml += icon + ' ' + esc(label) + ' <span style="font-size:12px;font-weight:400;color:var(--text-secondary)">' + items.length + ' task' + (items.length !== 1 ? 's' : '') + '</span></div>';
                bodyHtml += '<div class="table-wrap"><table>' + tableHeader + '<tbody>';
                items.forEach(function(t) { bodyHtml += renderTaskRow(t); });
                bodyHtml += '</tbody></table></div></div>';
            });
        } else if (grouping === 'phase') {
            var phaseOrder = ['pre_boarding','company_onboarding','role_specific','integration','ongoing'];
            var phaseGroups = {};
            tasks.forEach(function(t) {
                var p = t.phase || 'other';
                if (!phaseGroups[p]) phaseGroups[p] = [];
                phaseGroups[p].push(t);
            });
            var orderedPhases = phaseOrder.filter(function(p) { return phaseGroups[p]; });
            Object.keys(phaseGroups).forEach(function(p) { if (orderedPhases.indexOf(p) === -1) orderedPhases.push(p); });
            orderedPhases.forEach(function(phase) {
                var items = phaseGroups[phase];
                if (!items) return;
                bodyHtml += '<div style="margin-bottom:16px">';
                bodyHtml += '<div style="font-weight:600;font-size:13px;padding:8px 12px;border-radius:4px;margin-bottom:4px;display:flex;align-items:center;justify-content:space-between">';
                bodyHtml += (typeof phaseBadge === 'function' ? phaseBadge(phase) : esc(phase)) + ' <span style="font-size:12px;font-weight:400;color:var(--text-secondary)">' + items.length + ' task' + (items.length !== 1 ? 's' : '') + '</span></div>';
                bodyHtml += '<div class="table-wrap"><table>' + tableHeader + '<tbody>';
                items.forEach(function(t) { bodyHtml += renderTaskRow(t); });
                bodyHtml += '</tbody></table></div></div>';
            });
        } else {
            /* flat — sort by due date asc, nulls last */
            tasks.sort(function(a, b) {
                if (!a.due_date && !b.due_date) return 0;
                if (!a.due_date) return 1;
                if (!b.due_date) return -1;
                return a.due_date < b.due_date ? -1 : a.due_date > b.due_date ? 1 : 0;
            });
            var rows = tasks.map(function(t) { return renderTaskRow(t); }).join('');
            if (!rows) rows = '<tr><td colspan="5" style="text-align:center;padding:24px;color:var(--text-light)">No matching tasks</td></tr>';
            bodyHtml = '<div class="table-wrap"><table>' + tableHeader + '<tbody>' + rows + '</tbody></table></div>';
        }

        if (!bodyHtml) bodyHtml = '<div style="text-align:center;padding:24px;color:var(--text-light)">No matching tasks</div>';

        var selUrgency = grouping === 'urgency' ? ' selected' : '';
        var selFlat = grouping === 'flat' ? ' selected' : '';
        var selCat = grouping === 'category' ? ' selected' : '';
        var selPhase = grouping === 'phase' ? ' selected' : '';

        wrap.innerHTML = '<div style="display:flex;gap:12px;margin-bottom:16px;flex-wrap:wrap;align-items:center">' +
            '<div style="flex:1;min-width:200px">' +
                '<input class="form-control" placeholder="🔍 Search tasks..." value="' + esc(window._myTasksSearch) + '" oninput="window._myTasksSearch=this.value;document.getElementById(\'my-tasks-content\')._renderTable()">' +
            '</div>' +
            '<label style="display:flex;align-items:center;gap:6px;font-size:13px;cursor:pointer;white-space:nowrap">' +
                '<input type="checkbox" ' + (window._myTasksShowOnlyMine ? 'checked' : '') + ' onchange="window._myTasksShowOnlyMine=this.checked;document.getElementById(\'my-tasks-content\')._renderTable()" style="width:20px;height:20px;accent-color:var(--primary)"> Only my tasks</label>' +
            '<label style="display:flex;align-items:center;gap:6px;font-size:13px;cursor:pointer;white-space:nowrap">' +
                '<input type="checkbox" ' + (window._myTasksHideCompleted ? 'checked' : '') + ' onchange="window._myTasksHideCompleted=this.checked;document.getElementById(\'my-tasks-content\')._renderTable()" style="width:20px;height:20px;accent-color:var(--primary)"> Hide completed</label>' +
            '<select onchange="window._myTasksGrouping=this.value;document.getElementById(\'my-tasks-content\')._renderTable()" style="padding:4px 8px;border:1px solid var(--border);border-radius:4px;font-size:12px;background:var(--card-bg);color:var(--text)">' +
                '<option value="urgency"' + selUrgency + '>Group: By Urgency</option>' +
                '<option value="flat"' + selFlat + '>Sort: By Due Date</option>' +
                '<option value="category"' + selCat + '>Group: By Category</option>' +
                '<option value="phase"' + selPhase + '>Group: By Phase</option>' +
            '</select>' +
            '<span style="font-size:12px;color:var(--text-light)">' + tasks.length + ' of ' + allTasks.length + ' tasks</span>' +
        '</div>' + bodyHtml;
    }

    wrap._renderTable = renderTaskTable;
    renderTaskTable();
}

/* =============================================================
   TREND CHARTS (Canvas)
   ============================================================= */
function drawLineChart(canvasId, config) {
    const canvas = document.getElementById(canvasId);
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    const dpr = window.devicePixelRatio || 1;
    const rect = canvas.parentElement.getBoundingClientRect();
    const w = rect.width - 4;
    const h = parseInt(canvas.getAttribute('height')) || 220;
    canvas.width = w * dpr;
    canvas.height = h * dpr;
    canvas.style.width = w + 'px';
    canvas.style.height = h + 'px';
    ctx.scale(dpr, dpr);

    const labels = config.labels || [];
    const datasets = config.datasets || [];
    if (!labels.length || !datasets.length) return;

    // Theme-aware colors
    const cs = getComputedStyle(document.documentElement);
    const textColor = cs.getPropertyValue('--text-light').trim() || '#888';
    const gridColor = cs.getPropertyValue('--border-light').trim() || '#e0e0e0';

    const pad = {top: 24, right: 20, bottom: 36, left: 48};
    const plotW = w - pad.left - pad.right;
    const plotH = h - pad.top - pad.bottom;

    // Compute y range
    let allVals = datasets.flatMap(d => d.data);
    let yMin = Math.min(0, ...allVals);
    let yMax = Math.max(1, ...allVals);
    const yRange = yMax - yMin || 1;
    // Nice tick steps
    const rawStep = yRange / 4;
    const mag = Math.pow(10, Math.floor(Math.log10(rawStep)));
    const niceSteps = [1, 2, 5, 10];
    let step = niceSteps.find(s => s * mag >= rawStep) * mag || rawStep;
    yMin = Math.floor(yMin / step) * step;
    yMax = Math.ceil(yMax / step) * step;
    const finalRange = yMax - yMin || 1;

    function xPos(i) { return pad.left + (plotW / (labels.length - 1 || 1)) * i; }
    function yPos(v) { return pad.top + plotH - ((v - yMin) / finalRange) * plotH; }

    // Clear
    ctx.clearRect(0, 0, w, h);

    // Grid lines and Y labels
    ctx.strokeStyle = gridColor;
    ctx.lineWidth = 0.5;
    ctx.fillStyle = textColor;
    ctx.font = '11px Inter, system-ui, sans-serif';
    ctx.textAlign = 'right';
    for (let v = yMin; v <= yMax; v += step) {
        const y = yPos(v);
        ctx.beginPath();
        ctx.moveTo(pad.left, y);
        ctx.lineTo(w - pad.right, y);
        ctx.stroke();
        ctx.fillText(Math.round(v * 10) / 10, pad.left - 6, y + 4);
    }

    // X labels
    ctx.textAlign = 'center';
    labels.forEach((lbl, i) => {
        ctx.fillText(lbl, xPos(i), h - pad.bottom + 18);
    });

    // Y axis label
    if (config.yLabel) {
        ctx.save();
        ctx.translate(12, pad.top + plotH / 2);
        ctx.rotate(-Math.PI / 2);
        ctx.textAlign = 'center';
        ctx.fillStyle = textColor;
        ctx.font = '10px Inter, system-ui, sans-serif';
        ctx.fillText(config.yLabel, 0, 0);
        ctx.restore();
    }

    // Draw lines
    datasets.forEach(ds => {
        if (!ds.data.length) return;
        ctx.beginPath();
        ctx.strokeStyle = ds.color;
        ctx.lineWidth = 2.5;
        ctx.lineJoin = 'round';
        ds.data.forEach((v, i) => {
            const x = xPos(i), y = yPos(v);
            if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
        });
        ctx.stroke();

        // Data points
        ds.data.forEach((v, i) => {
            const x = xPos(i), y = yPos(v);
            ctx.beginPath();
            ctx.arc(x, y, 4, 0, Math.PI * 2);
            ctx.fillStyle = ds.color;
            ctx.fill();
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 1.5;
            ctx.stroke();
        });
    });

    // Legend
    const legY = 8;
    let legX = pad.left;
    ctx.font = '11px Inter, system-ui, sans-serif';
    datasets.forEach(ds => {
        ctx.fillStyle = ds.color;
        ctx.fillRect(legX, legY, 14, 3);
        ctx.fillStyle = textColor;
        ctx.textAlign = 'left';
        ctx.fillText(ds.label, legX + 18, legY + 5);
        legX += ctx.measureText(ds.label).width + 36;
    });

    // Tooltip on hover
    canvas._trendConfig = config;
    canvas._trendDims = {pad, plotW, plotH, yMin, finalRange, w, h, xPos, yPos, labels};
    if (!canvas._hasTooltip) {
        canvas._hasTooltip = true;
        canvas.style.cursor = 'crosshair';
        canvas.addEventListener('mousemove', function(e) {
            const rect2 = canvas.getBoundingClientRect();
            const mx = e.clientX - rect2.left;
            const cfg = canvas._trendConfig;
            const dims = canvas._trendDims;
            if (!cfg || !dims) return;
            // Find closest data point index
            let closest = -1, minDist = 30;
            dims.labels.forEach((_, i) => {
                const dist = Math.abs(mx - dims.xPos(i));
                if (dist < minDist) { minDist = dist; closest = i; }
            });
            // Remove old tooltip
            let tip = canvas.parentElement.querySelector('.chart-tooltip');
            if (closest < 0) { if (tip) tip.remove(); return; }
            const lines = cfg.datasets.map(ds =>
                `<span style="color:${ds.color}">●</span> ${ds.label}: <b>${ds.data[closest] != null ? Math.round(ds.data[closest]*10)/10 : '—'}</b>`
            ).join('<br>');
            const tipHtml = `<div style="font-size:11px;line-height:1.6"><b>${dims.labels[closest]}</b><br>${lines}</div>`;
            if (!tip) {
                tip = document.createElement('div');
                tip.className = 'chart-tooltip';
                tip.style.cssText = 'position:absolute;background:var(--bg,#fff);border:1px solid var(--border-light,#ddd);border-radius:6px;padding:6px 10px;pointer-events:none;box-shadow:0 2px 8px rgba(0,0,0,.12);z-index:10;white-space:nowrap;font-family:Inter,system-ui,sans-serif';
                canvas.parentElement.style.position = 'relative';
                canvas.parentElement.appendChild(tip);
            }
            tip.innerHTML = tipHtml;
            const tipX = dims.xPos(closest);
            tip.style.left = Math.min(tipX + 8, dims.w - 140) + 'px';
            tip.style.top = '30px';
        });
        canvas.addEventListener('mouseleave', function() {
            const tip = canvas.parentElement.querySelector('.chart-tooltip');
            if (tip) tip.remove();
        });
    }
}

/* =============================================================
   CSV EXPORT
   ============================================================= */
function exportToCSV(data, headers, filename) {
    const headerRow = headers.map(h => '"' + h.label + '"').join(',');
    const rows = data.map(row =>
        headers.map(h => {
            let val = row[h.key] ?? '';
            return '"' + String(val).replace(/"/g, '""') + '"';
        }).join(',')
    );
    const csv = '﻿' + headerRow + '\n' + rows.join('\n');  // BOM for Excel
    const blob = new Blob([csv], {type: 'text/csv;charset=utf-8;'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename + '_' + new Date().toISOString().slice(0,10) + '.csv';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    showToast('CSV exported: ' + filename, 'success');
}

            <div class="cmd-palette-results" id="cmd-palette-results">${renderItems(items)}</div>

                <span><kbd>↵</kbd> open</span>
                <span><kbd>esc</kbd> close</span>
            </div>
        </div>`;

    document.body.appendChild(overlay);

    const input = document.getElementById('cmd-palette-input');
    const results = document.getElementById('cmd-palette-results');
    let activeIdx = 0;

    // Click handler on results (delegated)
    results.addEventListener('click', function(e) {
        const item = e.target.closest('.cmd-palette-item');
        if (item) { navigate(item.dataset.route); closeCommandPalette(); }
    });

    input.addEventListener('input', function() {
        const q = this.value.toLowerCase();
        const filtered = items.filter(it => it.label.toLowerCase().includes(q) || it.section.toLowerCase().includes(q));
        activeIdx = 0;
        results.innerHTML = renderItems(filtered);
    });

    input.addEventListener('keydown', function(e) {
        const els = results.querySelectorAll('.cmd-palette-item');
        if (!els.length) return;
        if (e.key === 'ArrowDown') { e.preventDefault(); activeIdx = Math.min(activeIdx + 1, els.length - 1); }
        if (e.key === 'ArrowUp') { e.preventDefault(); activeIdx = Math.max(activeIdx - 1, 0); }
        els.forEach((el, i) => el.classList.toggle('active', i === activeIdx));
        if (els[activeIdx]) els[activeIdx].scrollIntoView({ block: 'nearest' });
        if (e.key === 'Enter' && els[activeIdx]) {
            navigate(els[activeIdx].dataset.route);
            closeCommandPalette();
        }
    });

    // Focus the input after appending
    requestAnimationFrame(() => input.focus());
}

function closeCommandPalette() {
    const overlay = document.querySelector('.cmd-palette-overlay');
    if (overlay) overlay.remove();
}

            <div class="icon">⚠️</div><h3>Unable to connect</h3>
            <p>The server may be starting up. Please refresh in a few seconds.</p>
            <button class="btn btn-primary" onclick="window.location.reload()">Refresh</button></div>`;
    }

    // ── Session timeout warning ─────────────────────────────────────
    (function() {
        const SESSION_HOURS = 12;
        const WARN_MINUTES = 5;
        let sessionStart = parseInt(localStorage.getItem('celito_session_start') || '0');
        if (!sessionStart || Date.now() - sessionStart > SESSION_HOURS * 3600000) {
            sessionStart = Date.now();
            localStorage.setItem('celito_session_start', String(sessionStart));
        }
        function checkSession() {
            const elapsed = Date.now() - sessionStart;
            const remaining = (SESSION_HOURS * 3600000) - elapsed;
            const banner = document.getElementById('session-warning');
            if (remaining <= WARN_MINUTES * 60000 && remaining > 0) {
                const mins = Math.ceil(remaining / 60000);
                if (!banner) {
                    const b = document.createElement('div');
                    b.id = 'session-warning';
                    b.style.cssText = 'background:var(--warning);color:#333;text-align:center;padding:8px 16px;font-size:13px;font-weight:600;position:sticky;top:0;z-index:999;display:flex;align-items:center;justify-content:center;gap:12px;';
                    b.innerHTML = `<span>⏳ Your session expires in <span id="session-mins">${mins}</span> minute${mins!==1?'s':''}. Save your work.</span><button onclick="window.location.reload()" class="btn btn-sm btn-primary">Extend Session</button>`;
                    document.querySelector('.app-container')?.prepend(b);
                } else {
                    const el = document.getElementById('session-mins');
                    if (el) el.textContent = mins;
                }
            }
        }
        setInterval(checkSession, 30000);
    })();
});

/* =============================================================
   NOTIFICATIONS
   ============================================================= */
function getDismissedNotifs() {
    try {
        var raw = localStorage.getItem('celito_dismissed_notifs');
        if (!raw) return {};
        var parsed = JSON.parse(raw);
        // Clean entries older than 7 days
        var now = Date.now();
        var cleaned = {};
        for (var k in parsed) {
            if (now - parsed[k] < 604800000) cleaned[k] = parsed[k];
        }
        return cleaned;
    } catch(e) { return {}; }
}

function dismissNotif(key, el) {
    event.stopPropagation();
    try {
        var dismissed = getDismissedNotifs();
        dismissed[key] = Date.now();
        localStorage.setItem('celito_dismissed_notifs', JSON.stringify(dismissed));
    } catch(e) {}
    if (el) {
        var row = el.closest('[data-notif]');
        if (row) row.style.display = 'none';
    }
    // Update badge count
    var remaining = document.querySelectorAll('#notif-list [data-notif]:not([style*="display: none"])');
    var count = 0;
    remaining.forEach(function(r) { if (r.style.display !== 'none') count++; });
    var badge = document.getElementById('notif-badge');
    var countEl = document.getElementById('notif-count');
    if (count === 0) {
        badge.style.display = 'none';
        countEl.textContent = '0 items';
        document.getElementById('notif-list').innerHTML = '<div style="padding:24px;text-align:center;color:var(--text-light);font-size:13px">🎉 All caught up! No notifications.</div>';
    } else {
        badge.textContent = count;
        countEl.textContent = count + ' items';
    }
}

function dismissAllNotifs() {
    var items = document.querySelectorAll('#notif-list [data-notif]');
    items.forEach(function(el) {
        var key = el.getAttribute('data-notif');
        if (key) {
            try {
                var dismissed = getDismissedNotifs();
                dismissed[key] = Date.now();
                localStorage.setItem('celito_dismissed_notifs', JSON.stringify(dismissed));
            } catch(e) {}
        }
        el.style.display = 'none';
    });
    document.getElementById('notif-badge').style.display = 'none';
    document.getElementById('notif-count').textContent = '0 items';
    document.getElementById('notif-list').innerHTML = '<div style="padding:24px;text-align:center;color:var(--text-light);font-size:13px">🎉 All caught up! No notifications.</div>';
}

async function loadNotifications() {
    try {
        const data = await api('/api/me/notifications');
        if (!data) return;

        const badge = document.getElementById('notif-badge');
        const countEl = document.getElementById('notif-count');
        const listEl = document.getElementById('notif-list');

        // Filter out dismissed notifications
        var dismissed = getDismissedNotifs();
        var filtered = (data.notifications || []).filter(function(n) {
            var key = (n.type || '') + '-' + (n.task_id || n.title || '').toString();
            return !dismissed[key];
        });

        var highCount = filtered.filter(function(n) { return n.priority === 'high'; }).length;

        if (filtered.length > 0) {
            badge.style.display = 'block';
            badge.textContent = highCount > 0 ? highCount : filtered.length;
            if (highCount > 0) badge.style.background = 'var(--danger)';
            else badge.style.background = 'var(--primary)';
        } else {
            badge.style.display = 'none';
        }

        countEl.textContent = filtered.length + ' items';

        if (!filtered.length) {
            listEl.innerHTML = '<div style="padding:24px;text-align:center;color:var(--text-light);font-size:13px">🎉 All caught up! No notifications.</div>';
            return;
        }

        var priorityColors = { high: 'var(--danger-light)', medium: 'transparent', low: 'transparent' };
        var priorityBorders = { high: 'border-left:3px solid var(--danger)', medium: 'border-left:3px solid var(--warning)', low: 'border-left:3px solid var(--border)' };

        listEl.innerHTML = filtered.slice(0, 20).map(function(n) {
            var notifKey = (n.type || '') + '-' + (n.task_id || n.title || '').toString();
            var bg = priorityColors[n.priority] || 'transparent';
            var border = priorityBorders[n.priority] || '';
            var clickAction = '';
            if (n.employee_id) {
                clickAction = 'onclick="navigate(\'employee-detail\',' + n.employee_id + ');toggleNotifications()" style="cursor:pointer"';
            } else if (n.type === 'survey') {
                clickAction = 'onclick="navigate(\'my-surveys\');toggleNotifications()" style="cursor:pointer"';
            }
            return '<div data-notif="' + esc(notifKey) + '" ' + clickAction + ' style="padding:10px 14px;border-bottom:1px solid var(--border-light);background:' + bg + ';' + border + '">' +
                '<div style="display:flex;gap:8px;align-items:start">' +
                    '<span style="font-size:16px;flex-shrink:0">' + (n.icon || '📋') + '</span>' +
                    '<div style="flex:1;min-width:0">' +
                        '<div style="font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">' + esc(n.title) + '</div>' +
                        '<div style="font-size:12px;color:var(--text-light);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">' + esc(n.subtitle || '') + '</div>' +
                    '</div>' +
                    '<button onclick="dismissNotif(\'' + esc(notifKey).replace(/'/g, "\\'") + '\', this)" title="Dismiss" style="background:none;border:none;color:var(--text-light);cursor:pointer;font-size:14px;padding:2px 4px;flex-shrink:0;line-height:1;opacity:0.5" onmouseenter="this.style.opacity=\'1\'" onmouseleave="this.style.opacity=\'0.5\'">&times;</button>' +
                '</div>' +
            '</div>';
        }).join('');
    } catch (e) {
        console.error('Failed to load notifications:', e);
    }
}

function toggleNotifications() {
    var dd = document.getElementById('notif-dropdown');
    var isOpen = dd.style.display !== 'none';
    dd.style.display = isOpen ? 'none' : 'block';
    document.getElementById('notification-bell').setAttribute('aria-expanded', String(!isOpen));
    if (!isOpen) loadNotifications();
}

// Close notification dropdown when clicking elsewhere
document.addEventListener('click', function(e) {
    if (!e.target.closest('#notification-bell')) {
        var dd = document.getElementById('notif-dropdown');
        if (dd) dd.style.display = 'none';
    }
});

setTimeout(loadNotifications, 1500);
setInterval(loadNotifications, 300000);

            <div class="tutorial-progress">${dotsHtml}</div>
            <div class="tutorial-nav">
                ${_tutorialPage > 0 ? '<button class="btn btn-light" onclick="tutorialPrev()">Back</button>' : '<button class="btn btn-light" onclick="closeTutorial()">Skip</button>'}
                ${_tutorialPage < totalPages - 1
                    ? '<button class="btn btn-primary" onclick="tutorialNext()">Next</button>'
                    : '<button class="btn btn-primary" onclick="closeTutorial(true)">Got it!</button>'}
            </div>
        </div>
    `;
    // Close on backdrop click
    overlay.addEventListener('click', function(e) {
        if (e.target === overlay) closeTutorial();
    });
    document.body.appendChild(overlay);
}

function tutorialNext() {
    if (_tutorialPage < MANAGER_TUTORIAL_STEPS.length - 1) {
        _tutorialPage++;
        renderTutorialPage();
    }
}

function tutorialPrev() {
    if (_tutorialPage > 0) {
        _tutorialPage--;
        renderTutorialPage();
    }
}

function closeTutorial(markComplete) {
    document.getElementById('tutorial-overlay')?.remove();
    if (markComplete) {
        try { localStorage.setItem('celito_mgr_tutorial_done', '1'); } catch(e) {}
    }
}

// Auto-show tutorial for managers on first visit
function checkManagerTutorial() {
    if (!isRole('manager')) return;
    try {
        if (localStorage.getItem('celito_mgr_tutorial_done')) return;
    } catch(e) { return; }
    // Small delay so the dashboard renders first
    setTimeout(showManagerTutorial, 800);
}

/* =============================================================
   CONTEXTUAL HELP: JARGON TOOLTIP APPLICATION
   ============================================================= */
function applyJargonTooltips(container) {
    if (!container) container = document.getElementById('main-content');
    if (!container) return;

    // Walk text nodes and wrap jargon terms with tooltip spans
    const terms = Object.keys(JARGON_TOOLTIPS).sort((a, b) => b.length - a.length); // longest first
    if (!terms.length) return;

    // Build a case-insensitive regex matching any jargon term
    const escaped = terms.map(t => t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'));
    const regex = new RegExp('\\b(' + escaped.join('|') + ')\\b', 'gi');

    const walker = document.createTreeWalker(container, NodeFilter.SHOW_TEXT, {
        acceptNode: function(node) {
            // Skip if already inside a tooltip, script, style, input, or select
            const parent = node.parentElement;
            if (!parent) return NodeFilter.FILTER_REJECT;
            const tag = parent.tagName;
            if (tag === 'SCRIPT' || tag === 'STYLE' || tag === 'INPUT' || tag === 'SELECT' || tag === 'TEXTAREA') return NodeFilter.FILTER_REJECT;
            if (parent.hasAttribute('data-tooltip')) return NodeFilter.FILTER_REJECT;
            if (parent.closest('[data-tooltip]')) return NodeFilter.FILTER_REJECT;
            if (regex.test(node.textContent)) {
                regex.lastIndex = 0;
                return NodeFilter.FILTER_ACCEPT;
            }
            return NodeFilter.FILTER_REJECT;
        }
    });

    const textNodes = [];
    while (walker.nextNode()) textNodes.push(walker.currentNode);

    for (const textNode of textNodes) {
        const text = textNode.textContent;
        regex.lastIndex = 0;
        const parts = [];
        let lastIdx = 0;
        let match;
        const seen = new Set(); // Only tooltip the first occurrence per term per node

        while ((match = regex.exec(text)) !== null) {
            const termLower = match[1].toLowerCase();
            if (seen.has(termLower)) continue;
            seen.add(termLower);

            if (match.index > lastIdx) {
                parts.push(document.createTextNode(text.slice(lastIdx, match.index)));
            }
            const span = document.createElement('span');
            span.setAttribute('data-tooltip', JARGON_TOOLTIPS[termLower] || '');
            span.textContent = match[1];
            parts.push(span);
            lastIdx = match.index + match[0].length;
        }

        if (parts.length > 0) {
            if (lastIdx < text.length) {
                parts.push(document.createTextNode(text.slice(lastIdx)));
            }
            const frag = document.createDocumentFragment();
            parts.forEach(p => frag.appendChild(p));
            textNode.parentNode.replaceChild(frag, textNode);
        }
    }
}

/* =============================================================
   CONTEXTUAL HELP: STATUS LEGEND FOR GRID VIEW
   ============================================================= */
function statusLegendHTML() {
    return '<div class="status-legend" style="margin-bottom:12px">' +
        '<span class="status-legend-item">🟢 On Track</span>' +
        '<span class="status-legend-item">🟡 At Risk</span>' +
        '<span class="status-legend-item">🔴 Behind</span>' +
        '</div>';
}

/* Hook into render cycle to apply jargon tooltips and auto-show tutorial */
const _origRender = typeof render === 'function' ? render : null;
if (_origRender) {
    // We need to apply tooltips after each render, with a debounce
    let _tooltipTimer = null;
    const _origRenderRef = render;
    render = function() {
        _origRenderRef.apply(this, arguments);
        clearTimeout(_tooltipTimer);
        _tooltipTimer = setTimeout(function() {
            applyJargonTooltips();
        }, 300);
    };
}

// Also check tutorial on initial load
document.addEventListener('DOMContentLoaded', function() {
    setTimeout(checkManagerTutorial, 1200);
});
// Fallback if DOMContentLoaded already fired
if (document.readyState !== 'loading') {
    setTimeout(checkManagerTutorial, 1200);
}
</script>
