        </div>

        ${phaseStepperHTML(phase)}

        ${isRole('admin','hr') ? `<div class="btn-group" style="margin-bottom:20px">
            ${['pending','active'].includes(emp.status) ? `<button class="btn btn-primary" onclick="startOnboarding(${id})">🟢 Start Onboarding</button>` : ''}
            ${['active','onboarding'].includes(emp.status) ? `<button class="btn btn-warning" onclick="showOffboardModal(${id})">🔴 Start Offboarding</button>` : ''}
            <button class="btn btn-secondary" onclick="generateWelcomeLetter(${id})">📄 Welcome Letter</button>
            <button class="btn btn-secondary" onclick="syncSalesforce(${id})">☁️ Sync SF</button>
            <button class="btn btn-secondary" onclick="notifySlack(${id})">💬 Slack</button>
            <button class="btn btn-secondary" onclick="sendEmployeeUpdates(${id})" title="Send this employee their progress via DM">📋 DM Progress</button>
            ${emp.manager_email ? `<button class="btn btn-secondary" onclick="sendManagerSynopsis('${esc(emp.manager_email)}')" title="Send their manager an onboarding synopsis via DM">📊 DM Manager</button>` : ''}
            <button class="btn btn-secondary" onclick="generateChecklist(${id})">🤖 AI Checklist</button>
        </div>` : ''}

        <div class="tabs" id="emp-tabs" role="tablist">
            <div class="tab ${state.empTab==='overview'?'active':''}" ${tabAttrs(state.empTab==='overview')} onclick="switchEmpTab('overview',${id})">Overview</div>
            <div class="tab ${state.empTab==='checklist'?'active':''}" ${tabAttrs(state.empTab==='checklist')} onclick="switchEmpTab('checklist',${id})">Checklist</div>
            <div class="tab ${state.empTab==='equipment'?'active':''}" ${tabAttrs(state.empTab==='equipment')} onclick="switchEmpTab('equipment',${id})">Equipment</div>
            <div class="tab ${state.empTab==='milestones'?'active':''}" ${tabAttrs(state.empTab==='milestones')} onclick="switchEmpTab('milestones',${id})">30/60/90</div>
            <div class="tab ${state.empTab==='meet-greets'?'active':''}" ${tabAttrs(state.empTab==='meet-greets')} onclick="switchEmpTab('meet-greets',${id})">Meet & Greet</div>
            <div class="tab ${state.empTab==='surveys'?'active':''}" ${tabAttrs(state.empTab==='surveys')} onclick="switchEmpTab('surveys',${id})">Surveys</div>
            <div class="tab ${state.empTab==='activity'?'active':''}" onclick="switchEmpTab('activity',${id})">Activity</div>
        </div>
        <div id="emp-tab-content"></div>`;
    switchEmpTab(state.empTab || 'overview', id);
}

async function switchEmpTab(tab, empId) {
    state.empTab = tab;
    document.querySelectorAll('#emp-tabs .tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('#emp-tabs .tab').forEach((t, i) => {
        const tabs = ['overview','checklist','equipment','milestones','meet-greets','surveys','activity'];
        if (tabs[i] === tab) t.classList.add('active');
    });
    const content = document.getElementById('emp-tab-content');
    if (!content) return;
    content.innerHTML = '<div class="loading-center"><div class="spinner"></div></div>';

    if (tab === 'overview') {
        const emp = await api('/api/employees/' + empId);
        if (!emp) return;
        const name = (emp.first_name||'') + ' ' + (emp.last_name||'');
        content.innerHTML = `<div class="grid-2">
            <div class="card"><h2>Details</h2>
                <div style="display:grid;grid-template-columns:auto 1fr;gap:8px 16px;font-size:13px">
                    <strong>Email:</strong><span>${esc(emp.email)}</span>
                    <strong>Phone:</strong><span>${esc(emp.phone||'—')}</span>
                    <strong>Department:</strong><span>${esc(emp.department)}</span>
                    <strong>Role:</strong><span>${esc(emp.role_title)}</span>
                    <strong>Manager:</strong><span>${esc(emp.manager_email||'—')}</span>
                    <strong>Location:</strong><span>${esc(emp.location||'—')} (${esc(emp.location_mode||'in-office')})</span>
                    <strong>Start Date:</strong><span>${formatDate(emp.start_date)}${emp.start_date ? (() => { var ds = Math.floor((new Date() - new Date(emp.start_date)) / 86400000); return ds >= 0 ? ' <span class="badge badge-primary" style="font-size:10px;margin-left:4px">Day ' + ds + '</span>' : ' <span class="badge badge-warning" style="font-size:10px;margin-left:4px">Starts in ' + Math.abs(ds) + 'd</span>'; })() : ''}</span>
                    <strong>Hire Type:</strong><span>${esc(emp.hire_type||'—')}${emp.hire_type && emp.hire_type !== 'full-time' ? ' <span class="badge badge-' + (emp.hire_type==='contractor'?'warning':emp.hire_type==='intern'?'info':'secondary') + '" style="font-size:10px;margin-left:6px">' + esc(emp.hire_type).toUpperCase() + '</span>' : ''}</span>
                    <strong>Buddy:</strong><span>${esc(emp.buddy_email||'Not assigned')}</span>
                    <strong>HR Owner:</strong><span>${esc(emp.hr_owner_email||'Not assigned')}</span>
                    <strong>Cohort:</strong><span>${esc(emp.cohort_name||'None')}</span>
                </div>
            </div>
            <div class="card"><h2>Phase Progress</h2>
                ${PHASE_ORDER.map(p => {
                    const pp = emp.phase_progress?.[p] || 0;
                    return `<div style="margin-bottom:12px"><div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px"><span>${esc(PHASE_LABELS[p])}</span><span>${pp}%</span></div><div class="phase-description">${esc(PHASE_DESCRIPTIONS[p]||'')}</div>${progressBar(pp)}</div>`;
                }).join('')}
            </div>
        </div>`;
    } else if (tab === 'checklist') {
        const data = await api('/api/employees/' + empId + '/checklist');
        if (!data || !(data.tasks||[]).length) {
            content.innerHTML = '<div class="empty-state"><div class="icon">📋</div><h3>No checklist yet</h3><p>Start onboarding or use AI to generate one.</p></div>';
            return;
        }
        const tasks = data.tasks || [];
        // Group by phase, then category
        let html = '';
        if (isRole('admin','hr','manager')) {
            html += `<div style="display:flex;justify-content:flex-end;margin-bottom:12px">
                <button class="btn btn-sm btn-outline-primary" onclick="showAddTaskModal(${empId})">➕ Add Task</button></div>`;
        }
        for (const phase of PHASE_ORDER) {
            const phaseTasks = tasks.filter(t => t.phase === phase);
            if (!phaseTasks.length) continue;
            const done = phaseTasks.filter(t => t.status === 'completed').length;
            const pct = Math.round((done / phaseTasks.length) * 100);
            html += `<div class="card" style="margin-bottom:12px">
                <div class="checklist-group-header" role="button" tabindex="0" aria-expanded="true" onclick="toggleCollapse(this)" onkeydown="handleCollapseKeydown(event,this)">
                    <span class="toggle" aria-hidden="true">▼</span> ${esc(PHASE_LABELS[phase])} <span class="badge badge-secondary">${done}/${phaseTasks.length}</span>
                    <div style="flex:1;max-width:200px;margin-left:auto">${progressBar(pct)}</div>
                </div>
                ${PHASE_DESCRIPTIONS[phase] ? `<div class="phase-description" style="padding:0 12px 8px">${esc(PHASE_DESCRIPTIONS[phase])}</div>` : ''}
                <div class="collapsible-content">`;
            // Group by category within phase
            const byCat = {};
            phaseTasks.forEach(t => { if (!t.parent_task_id) (byCat[t.category] = byCat[t.category] || []).push(t); });
            for (const cat of Object.keys(byCat)) {
                html += `<div class="checklist-group"><div style="padding:4px 12px;font-size:12px;font-weight:600;color:var(--text-light)">${CATEGORY_ICONS[cat]||'📋'} ${esc(CATEGORY_LABELS[cat]||cat)}</div>`;
                for (const t of byCat[cat]) {
                    html += renderChecklistItem(t, tasks);
                    // Subtasks
                    const subs = tasks.filter(s => s.parent_task_id === t.id);
                    for (const s of subs) { html += renderChecklistItem(s, tasks, true); }
                }
                html += '</div>';
            }
            html += '</div></div>';
        }
        // Tasks without phase
        const noPhase = tasks.filter(t => !t.phase && !t.parent_task_id);
        if (noPhase.length) {
            html += '<div class="card"><h2>Other Tasks</h2>';
            noPhase.forEach(t => { html += renderChecklistItem(t, tasks); });
            html += '</div>';
        }
        content.innerHTML = html;
    } else if (tab === 'equipment') {
        const data = await api('/api/employees/' + empId + '/equipment');
        const items = data?.equipment || data || [];
        let html = `<div class="card"><div class="card-header"><h2>Equipment</h2>
            ${isRole('admin','hr') ? `<button class="btn btn-sm btn-primary" onclick="showAddEquipModal(${empId})">+ Add</button>` : ''}</div>`;
        if (!items.length) { html += '<div class="empty-state"><p>No equipment tracked</p></div>'; }
        else {
            html += `<div class="table-wrap"><table><thead><tr><th>Item</th><th>Model</th><th>Serial #</th><th>Tracking</th><th>Status</th><th>Notes</th></tr></thead><tbody>${
                items.map(i => {
                    const canEdit = isRole('admin','hr','manager');
                    const statusCell = canEdit
                        ? '<select onchange="updateEquipStatus(' + i.id + ',this.value)" style="padding:4px 8px;border:1px solid var(--border);border-radius:4px;font-size:12px;background:var(--card-bg);color:var(--text)">'
                          + '<option value="issued"' + (i.status==='issued'?' selected':'') + '>Issued</option>'
                          + '<option value="returned"' + (i.status==='returned'?' selected':'') + '>Returned</option>'
                          + '<option value="lost"' + (i.status==='lost'?' selected':'') + '>Lost</option>'
                          + '</select>'
                        : '<span class="equip-status ' + (i.status||'') + '">' + esc(i.status) + '</span>';
                    return `<tr><td><strong>${esc(i.item_type)}</strong></td><td>${esc(i.model||'—')}</td><td>${esc(i.serial_number||'—')}</td>
                    <td>${esc(i.tracking_number||'—')}</td><td>${statusCell}</td>
                    <td>${esc(i.notes||'')}</td></tr>`;
                }).join('')
            }</tbody></table></div>`;
        }
        html += '</div>';
        content.innerHTML = html;
    } else if (tab === 'milestones') {
        const data = await api('/api/employees/' + empId + '/milestones');
        const ms = data?.milestones || data || [];
        if (!ms.length) {
            content.innerHTML = `<div class="empty-state"><div class="icon">🎯</div><h3>No 30/60/90 plan yet</h3>
                ${isRole('admin','hr','manager') ? `<div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap">
                    <button class="btn btn-primary" onclick="generateMilestones(${empId})">📋 Generate Department Plan</button>
                    <button class="btn btn-secondary" onclick="showAIMilestoneModal(${empId})">✨ Generate with AI</button>
                </div>` : ''}</div>`;
            return;
        }
        const aiBtn = isRole('admin','hr','manager') ? `<div style="display:flex;gap:8px;margin-bottom:16px;justify-content:flex-end">
            <button class="btn btn-sm btn-secondary" onclick="showAIMilestoneModal(${empId})" style="font-size:12px;padding:4px 12px">✨ Regenerate with AI</button>
        </div>` : '';
        content.innerHTML = aiBtn + `<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px">${ms.map(m => {
            const cls = m.status === 'achieved' ? 'achieved' : (m.status === 'in_progress' ? 'current' : '');
            return `<div class="milestone-card ${cls}">
                <div class="milestone-day">Day ${m.day_marker}</div>
                <div class="milestone-title">${esc(m.title)}</div>
                ${statusBadge(m.status)}
                <div class="milestone-expectations">${esc(m.expectations||'')}</div>
                ${m.notes ? `<div style="font-size:12px;color:var(--text-light);margin-top:8px">📝 ${esc(m.notes)}</div>` : ''}
                ${isRole('admin','hr','manager') ? `<div style="margin-top:12px">
                    <select class="form-control" style="font-size:12px;padding:4px" onchange="updateMilestone(${m.id},this.value)">
                        <option value="pending" ${m.status==='pending'?'selected':''}>Pending</option>
                        <option value="in_progress" ${m.status==='in_progress'?'selected':''}>In Progress</option>
                        <option value="achieved" ${m.status==='achieved'?'selected':''}>Achieved</option>
                        <option value="missed" ${m.status==='missed'?'selected':''}>Missed</option>
                    </select></div>` : ''}
            </div>`;
        }).join('')}</div>`;
    } else if (tab === 'meet-greets') {
        const data = await api('/api/employees/' + empId + '/meet-greets');
        const mgs = data?.meet_greets || data || [];
        if (!mgs.length) { content.innerHTML = '<div class="empty-state"><div class="icon">🤝</div><h3>No meet & greet circuit set up</h3></div>'; return; }
        const met = mgs.filter(m => m.completed).length;
        const pending = mgs.filter(m => !m.completed && !m.scheduled_date);
        const canManage = isRole('admin','hr','manager');
        content.innerHTML = `<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
            <div style="font-size:14px">Met <strong>${met}</strong> of <strong>${mgs.length}</strong> people ${progressBar(Math.round(met/mgs.length*100))}</div>
            ${canManage && pending.length > 0 ? `<button class="btn btn-sm btn-primary" onclick="showBatchMeetGreetModal(${empId})">📅 Batch Schedule (${pending.length} pending)</button>` : ''}
        </div>
        <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px">${
            mgs.map(m => {
                const hasEmail = m.contact_email && m.contact_email.trim();
                const statusBadge = m.completed
                    ? '<span class="badge badge-success">✅ Met</span>'
                    : m.scheduled_date

                        : '<span class="badge badge-warning">⏳ Pending</span>';

                    <div class="meet-reason">"${esc(m.reason||'')}"</div>
                    <div style="margin-top:6px">${statusBadge}</div>
                </div>

            }).join('')
        }</div>`;
    } else if (tab === 'surveys') {
        const data = await api('/api/employees/' + empId + '/surveys');
        const surveys = data?.surveys || data || [];
        if (!surveys.length) { content.innerHTML = '<div class="empty-state"><div class="icon">📝</div><h3>No surveys</h3></div>'; return; }
        content.innerHTML = `<div class="card">${surveys.map(s => `<div style="padding:12px;border-bottom:1px solid var(--border-light);display:flex;align-items:center;gap:12px">
            <span style="font-size:20px">📝</span>
            <div style="flex:1"><strong>${esc(formatSurveyType(s.survey_type))}</strong>
                <div style="font-size:12px;color:var(--text-light)">${s.completed_at ? 'Completed ' + formatDate(s.completed_at) : 'Pending'}</div></div>
            ${statusBadge(s.status)}
            ${s.status === 'pending' && isRole('admin','hr') ? `<button class="btn btn-sm btn-primary" onclick="sendSurvey(${empId},'${esc(s.survey_type)}')">Send</button>` : ''}
        </div>`).join('')}</div>`;
    } else if (tab === 'activity') {
        const data = await api('/api/admin/audit-log?target_id=' + empId + '&target_type=employee');
        const logs = data?.entries || data || [];
        if (!logs.length) { content.innerHTML = '<div class="empty-state"><p>No activity recorded yet</p></div>'; return; }
        content.innerHTML = `<div class="card">${logs.map(l => `<div class="audit-entry">
            <span class="audit-time">${relativeTime(l.created_at)}</span>
            <span class="audit-user">${esc(l.user_email)}</span> ${esc(l.action)}
            ${l.details ? `<div style="font-size:12px;color:var(--text-light);margin-top:2px">${esc(typeof l.details==='string'?l.details:JSON.stringify(l.details))}</div>` : ''}
        </div>`).join('')}</div>`;
    }
}

function renderChecklistItem(t, allTasks, isSub) {
    const blocked = t.depends_on_task_id && allTasks.find(d => d.id === t.depends_on_task_id && d.status !== 'completed');
    const depName = blocked ? allTasks.find(d => d.id === t.depends_on_task_id)?.title : '';
    const canManage = isRole('admin','hr','manager');
    const showActions = canManage && t.status !== 'completed';
    const isPendingReview = t.status === 'pending_review';
    const isSkippedRehire = t.status === 'skipped' && (t.completed_by||'').includes('system-rehire');
    return `<div class="checklist-item ${isSub ? 'subtask' : ''} ${blocked ? 'blocked' : ''} ${isPendingReview ? 'pending-review' : ''}">
        ${isPendingReview ? '' : `<input type="checkbox" ${t.status==='completed'?'checked':''} ${blocked?'disabled':''} onchange="toggleTask(${t.id},this.checked)">`}
        ${isPendingReview ? `<span class="badge badge-warning" style="font-size:10px">⏳ Employee says "Already Done"</span> <button class="btn btn-xs btn-success" onclick="approveAlreadyDone(${t.id})">✓ Approve</button> <button class="btn btn-xs btn-secondary" onclick="rejectAlreadyDone(${t.id})">✗ Reject</button>` : ''}
        ${isSkippedRehire ? '<span class="badge badge-secondary" style="font-size:10px">⏭️ Rehire skip</span>' : ''}
        <span class="task-title ${t.status==='completed'||isSkippedRehire?'completed':''}">${blocked ? '🔒 ' : ''}${esc(t.title)}</span>
        ${t.is_security_critical ? '<span class="badge badge-security">🔴 SECURITY</span>' : ''}
        ${t.compliance_required ? '<span class="badge badge-compliance">📋 COMPLIANCE</span>' : ''}
        ${t.is_acknowledgment ? '<span class="badge badge-success" style="font-size:10px">ACK</span>' : ''}
        <span class="task-meta">${esc(t.assigned_to||'')} · ${formatDate(t.due_date)}</span>
        ${t.status !== 'completed' && t.status !== 'pending_review' && t.due_date && daysUntil(t.due_date) < 0 ? `<span class="badge badge-danger">${Math.abs(daysUntil(t.due_date))}d late</span>` : ''}
        ${blocked ? `<span style="font-size:10px;color:var(--text-muted)" title="Blocked by: ${esc(depName)}">(blocked)</span>` : ''}
        ${canManage ? `<span class="task-actions">
            <button class="task-action-btn" title="Reassign task" onclick="event.stopPropagation();showReassignModal(${t.id},'${esc(t.assigned_to||'').replace(/'/g,"\\&#39;")}','${esc(t.assigned_email||'').replace(/'/g,"\\&#39;")}')">↪️</button>
            <button class="task-action-btn duplicate" title="Duplicate task" onclick="event.stopPropagation();duplicateTask(${t.id})">📋</button>
            ${showActions ? `<button class="task-action-btn delete" title="Delete task" onclick="event.stopPropagation();deleteTask(${t.id},'${esc(t.title).replace(/'/g,"\\&#39;")}')">&times;</button>` : ''}
        </span>` : ''}
    </div>`;
}

var _previewExcluded = new Set();

async function startOnboarding(id) {
    _previewExcluded = new Set();
    showToast('Loading task preview...', 'info');
    const preview = await api('/api/employees/' + id + '/onboard/preview');
    if (!preview) return;

    const phaseLabels = {
        pre_boarding: '🚀 Pre-Boarding',
        company_onboarding: '🏢 Company Onboarding',
        department_onboarding: '💼 Department Onboarding',
        role_specific: '💼 Role-specific',
        role_training: '🎓 Role Training',
        integration: '🤝 Integration',
        ongoing: '📈 Ongoing'
    };
    const phaseOrder = ['pre_boarding', 'company_onboarding', 'department_onboarding', 'role_specific', 'role_training', 'integration', 'ongoing'];
    const catColors = {hr: '#4dabf7', it: '#51cf66', admin: '#ffd43b', team: '#ff922b', manager: '#cc5de8', employee: '#20c997'};
    const catLabels = {hr: 'Human Resources', it: 'IT / Service Desk', admin: 'Admin', team: 'Team', manager: 'Manager', employee: 'Employee'};

    var html = '<div style="margin-bottom:12px;font-size:13px;color:var(--text-light)">';
    html += 'Review the <strong>' + preview.total_tasks + '</strong> tasks that will be generated for ';
    html += '<strong>' + esc(preview.employee.name) + '</strong> (' + esc(preview.employee.department || 'No dept') + '). ';
    html += 'Uncheck any tasks to exclude them. Source: ' + esc(preview.source) + '.';
    html += '</div>';

    // Category stats with colored dots
    var cats = preview.tasks_by_category || {};
    html += '<div style="display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px">';
    for (var cat in cats) {
        var color = catColors[cat] || '#868e96';
        html += '<span style="display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600">';
        html += '<span style="width:8px;height:8px;border-radius:50%;background:' + color + ';display:inline-block"></span>';
        html += esc(catLabels[cat] || cat) + ': ' + cats[cat] + '</span>';
    }
    html += '</div>';

    // Location mode filter — flag tasks that don't match employee's location
    var empLocation = (preview.employee.location_mode || 'office').toLowerCase();
    var locationLabels = {office: '🏢 Office', remote: '🏠 Remote', hybrid: '🔀 Hybrid', all: '🌐 All'};
    var mismatchCount = (preview.tasks || []).filter(function(t) {
        var lm = (t.location_mode || 'all').toLowerCase();
        return lm !== 'all' && lm !== empLocation;
    }).length;
    if (mismatchCount > 0) {
        html += '<div style="background:var(--warning-light);border:1px solid var(--warning);border-radius:var(--radius-sm);padding:10px 14px;margin-bottom:12px;font-size:13px;">';
        html += '⚠️ <strong>' + mismatchCount + ' task' + (mismatchCount !== 1 ? 's' : '') + '</strong> ' + (mismatchCount !== 1 ? 'are' : 'is') + ' designed for a different work location than this employee\'s (' + esc(locationLabels[empLocation] || empLocation) + '). ';
        html += '<a href="#" onclick="autoExcludeLocationMismatch(\'' + esc(empLocation) + '\');return false" style="font-weight:600">Remove tasks that don\'t match this location</a>';
        html += '</div>';
    }
    html += '<div style="font-size:12px;color:var(--text-light);margin-bottom:8px;">Employee location: <strong>' + esc(locationLabels[empLocation] || empLocation) + '</strong></div>';

    // Task list grouped by phase (collapsible) with checkboxes
    var taskIdx = 0;
    var allPhases = phaseOrder.slice();
    for (var p in (preview.tasks_by_phase || {})) {
        if (!allPhases.includes(p)) allPhases.push(p);
    }
    for (var pi = 0; pi < allPhases.length; pi++) {
        var phase = allPhases[pi];
        var tasks = (preview.tasks_by_phase && preview.tasks_by_phase[phase]) || [];
        if (tasks.length === 0) continue;
        html += '<details style="margin-bottom:10px" open>';
        html += '<summary style="cursor:pointer;font-weight:600;font-size:14px;padding:6px 0;border-bottom:1px solid var(--border-color)">';
        html += esc(phaseLabels[phase] || phase) + ' (' + tasks.length + ')';
        html += '</summary>';
        if (PHASE_DESCRIPTIONS[phase]) html += '<div class="phase-description" style="padding:4px 0 6px">' + esc(PHASE_DESCRIPTIONS[phase]) + '</div>';
        html += '<div style="max-height:240px;overflow-y:auto;padding:4px 0">';
        for (var ti = 0; ti < tasks.length; ti++) {
            var t = tasks[ti];
            var indent = t.is_subtask ? 'padding-left:24px;' : '';
            var secBadge = t.is_security_critical ? ' <span style="color:#e74c3c;font-size:10px">🔒</span>' : '';
            var ackBadge = t.is_acknowledgment ? ' <span style="font-size:10px;background:var(--info-light, #e7f5ff);color:var(--info, #1971c2);padding:1px 6px;border-radius:3px">ack</span>' : '';
            var locMode = (t.location_mode || 'all').toLowerCase();
            var locMismatch = locMode !== 'all' && locMode !== empLocation;
            var locBadge = locMode !== 'all' ? ' <span style="font-size:10px;padding:1px 6px;border-radius:3px;background:' + (locMismatch ? 'var(--danger-light);color:var(--danger)' : 'var(--border-light);color:var(--text-light)') + '">' + esc(locationLabels[locMode] || locMode) + '</span>' : '';
            var tid = 'ptask-' + taskIdx;
            var mismatchStyle = locMismatch ? 'background:var(--danger-light);' : '';
            html += '<div id="' + tid + '" data-location="' + esc(locMode) + '" style="' + indent + mismatchStyle + 'display:flex;align-items:start;gap:8px;padding:5px 4px;font-size:13px;border-bottom:1px solid var(--border-color-light, #eee)">';
            html += '<input type="checkbox" checked onchange="togglePreviewTask(\'' + tid + '\',' + JSON.stringify(t.title) + ',this.checked)" style="margin-top:2px;width:16px;height:16px;flex-shrink:0">';
            html += '<div style="flex:1;min-width:0">';
            html += '<div style="font-weight:500">' + esc(t.title) + secBadge + ackBadge + locBadge + '</div>';
            html += '<div style="font-size:11px;color:var(--text-light)">' + esc(t.category || '') + ' · ' + esc(t.assigned_to || 'Unassigned') + (t.due_date ? ' · Due ' + t.due_date : '') + '</div>';
            html += '</div></div>';
            taskIdx++;
        }
        html += '</div></details>';
    }

    showModal('📋 Onboarding Task Preview', html, {
        wide: true,
        footer: '<button class="btn btn-secondary" onclick="closeModal()">Cancel</button>' +
                ' <button class="btn btn-primary" id="confirm-start-onboard-btn" style="font-weight:600">✅ Confirm &amp; Start Onboarding</button>'
    });

    document.getElementById('confirm-start-onboard-btn').onclick = async function() {
        var btn = document.getElementById('confirm-start-onboard-btn');
        btn.disabled = true;
        btn.textContent = 'Starting...';
        var body = {};
        if (_previewExcluded.size > 0) body.exclude_titles = Array.from(_previewExcluded);
        var result = await api('/api/employees/' + id + '/onboard', { method: 'POST', body: body });
        if (result) {
            showToast('Onboarding started!', 'success');
            closeModal();
            render();
        } else {
            btn.disabled = false;
            btn.textContent = '✅ Confirm & Start Onboarding';
        }
    };
}

function togglePreviewTask(tid, title, checked) {
    var el = document.getElementById(tid);
    if (el) el.style.opacity = checked ? '1' : '0.4';
    if (!checked) _previewExcluded.add(title);
    else _previewExcluded.delete(title);
    var btn = document.getElementById('confirm-start-onboard-btn');
    if (btn) {
        if (_previewExcluded.size > 0) {
            btn.textContent = '✅ Confirm & Start (' + _previewExcluded.size + ' excluded)';
        } else {
            btn.textContent = '✅ Confirm & Start Onboarding';
        }
    }
}

function autoExcludeLocationMismatch(empLoc) {
    var items = document.querySelectorAll('#modal-body [data-location]');
    var excluded = 0;
    items.forEach(function(el) {
        var loc = el.getAttribute('data-location');
        if (loc !== 'all' && loc !== empLoc) {
            var cb = el.querySelector('input[type="checkbox"]');
            if (cb && cb.checked) {
                cb.checked = false;
                cb.dispatchEvent(new Event('change'));
                excluded++;
            }
        }
    });
    showToast(excluded + ' location-mismatched task' + (excluded !== 1 ? 's' : '') + ' excluded', 'success');
}

async function loadOnboardingList(filter) {
    const data = await api('/api/employees?status=onboarding');
    let emps = data?.employees || data || [];
    if (filter !== 'all') {
        emps = emps.filter(e => currentPhaseFromStart(e.start_date) === filter);
    }
    const wrap = document.getElementById('onboarding-list');
    if (!emps.length) { wrap.innerHTML = '<div class="empty-state"><div class="icon">🟢</div><h3>No onboardings in this phase</h3></div>'; return; }
    wrap.innerHTML = emps.map(e => {
        const name = (e.first_name||'') + ' ' + (e.last_name||'');
        const phase = currentPhaseFromStart(e.start_date);
        const d = daysUntil(e.start_date);
        return `<div class="card" style="padding:16px;cursor:pointer;display:flex;align-items:center;gap:16px" onclick="navigate('employee-detail',${e.id})">
            ${avatar(name, 40)}
            <div style="flex:1"><div style="font-weight:600">${esc(name)}</div>
                <div style="font-size:12px;color:var(--text-light)">${esc(e.department)} · ${esc(e.role_title)} · Start: ${formatDate(e.start_date)}</div></div>
            ${phaseBadge(phase)}
            <div style="font-size:12px;color:var(--text-light)">${d !== null && d > 0 ? d + 'd until start' : d === 0 ? 'Starts today!' : Math.abs(d) + 'd since start'}</div>
            <div style="width:120px">${progressBar(e.progress||0)}</div>
            <button class="btn btn-xs btn-secondary" onclick="event.stopPropagation();showAddTaskModal(${e.id})" title="Add task">➕</button>
            <button class="btn btn-xs btn-secondary" onclick="event.stopPropagation();notifySlack(${e.id})">Remind</button>
        </div>`;
    }).join('');
}

        urgentHtml = `<div style="background:var(--danger-light, #fff5f5);border:2px solid var(--danger);border-radius:var(--radius);padding:16px;margin-bottom:16px">
            <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">
                <span style="font-size:20px">🚨</span>
                <strong style="color:var(--danger);font-size:15px">Immediate Actions Required</strong>
                <span class="badge badge-danger" style="margin-left:auto">${involuntaryEmps.length} involuntary</span>
            </div>
            <p style="font-size:13px;color:var(--text-light);margin:0 0 10px 0">
                Involuntary terminations require <strong>immediate security action</strong>. System access, passwords, VPN, and building access
                must be revoked the same day. Click each employee below to view and prioritize their security-critical tasks.
            </p>
            ${involuntaryEmps.map(e => {
                const name = (e.first_name||'') + ' ' + (e.last_name||'');
                return `<div style="display:flex;align-items:center;gap:8px;padding:6px 0;border-top:1px solid var(--danger, #e03131);opacity:0.3;border-top:1px solid currentColor" onclick="navigate('employee-detail',${e.id})" style="cursor:pointer">
                    <span style="font-size:12px">🔴</span>
                    <strong style="font-size:13px;cursor:pointer;text-decoration:underline" onclick="navigate('employee-detail',${e.id})">${esc(name)}</strong>
                    <span style="font-size:12px;color:var(--text-light)">${esc(e.department)} · Last day: ${formatDate(e.end_date)}</span>
                </div>`;
            }).join('')}
        </div>`;
    }

    wrap.innerHTML = urgentHtml + emps.map(e => {
        const name = (e.first_name||'') + ' ' + (e.last_name||'');
        const d = daysUntil(e.end_date);
        const isInvol = e.offboard_type === 'involuntary';
        return `<div class="card" style="padding:16px;cursor:pointer;display:flex;align-items:center;gap:16px;${isInvol?'border-left:4px solid var(--danger)':''}" onclick="navigate('employee-detail',${e.id})">
            ${avatar(name, 40, isInvol?'background:var(--danger)':'')}
            <div style="flex:1"><div style="font-weight:600">${esc(name)}</div>
                <div style="font-size:12px;color:var(--text-light)">${esc(e.department)} · Last day: ${formatDate(e.end_date)}</div></div>
            <span class="badge ${isInvol?'badge-danger':'badge-info'}">${isInvol?'⚠️ Involuntary':'Voluntary'}</span>
            <div style="font-size:12px;color:var(--text-light)">${d !== null ? (d > 0 ? d + 'd remaining' : 'Past last day') : ''}</div>
            <div style="width:120px">${progressBar(e.progress||0)}</div>
            <button class="btn btn-xs btn-secondary" onclick="event.stopPropagation();showAddTaskModal(${e.id})" title="Add task">➕</button>
        </div>`;
    }).join('');
}

            <strong style="color:var(--danger)">⚠️ Involuntary Termination</strong>

function toggleInvoluntaryWarning() {
    var warn = document.getElementById('bo-invol-warning');
    if (warn) warn.style.display = document.getElementById('bo-type')?.value === 'involuntary' ? 'block' : 'none';
}

let _boSearchTimer = null;
function boSearchEmployees(query) {
    clearTimeout(_boSearchTimer);
    const box = document.getElementById('bo-results');
    if (!query || query.length < 2) { box.style.display = 'none'; return; }
    _boSearchTimer = setTimeout(async () => {
        const data = await api('/api/employees?search=' + encodeURIComponent(query));
        const emps = data?.employees || data || [];
        if (!emps.length) { box.innerHTML = '<div style="padding:8px 12px;color:var(--text-light);font-size:13px">No employees found</div>'; box.style.display = 'block'; return; }
        box.innerHTML = emps.map(e => `<div style="padding:8px 12px;cursor:pointer;font-size:13px;border-bottom:1px solid var(--border)"
            onmouseover="this.style.background='var(--primary-light)'" onmouseout="this.style.background=''"
            onclick="boSelectEmployee(${e.id}, '${esc(e.name||e.employee_name||'')}', '${esc(e.email)}')">
            <strong>${esc(e.name||e.employee_name||'')}</strong> <span style="color:var(--text-light)">${esc(e.email)}</span>
            ${e.department ? '<span style="color:var(--text-light);margin-left:8px">· '+esc(e.department)+'</span>' : ''}
        </div>`).join('');
        box.style.display = 'block';
    }, 300);
}

function boSelectEmployee(id, name, email) {
    document.getElementById('bo-emp-id').value = id;
    document.getElementById('bo-search').value = name + ' (' + email + ')';
    document.getElementById('bo-results').style.display = 'none';
}

async function bulkStartOffboard() {
    const empId = document.getElementById('bo-emp-id')?.value;
    const lastDay = document.getElementById('bo-lastday')?.value;
    const termType = document.getElementById('bo-type')?.value || 'voluntary';
    const reason = document.getElementById('bo-reason')?.value || '';
    if (!empId || !lastDay) { showToast('Select an employee and fill required fields', 'warning'); return; }

    // Show preview instead of immediately starting
    showToast('Loading offboarding preview...', 'info');
    closeModal();
    const preview = await api('/api/employees/' + empId + '/offboard/preview', {
        method: 'POST', body: { last_day: lastDay, type: termType }
    });
    if (!preview) return;

    const isInvol = preview.term_type === 'involuntary';
    const catColors = {hr: '#4dabf7', it: '#51cf66', manager: '#cc5de8', facilities: '#ff922b'};
    const catLabels = {hr: 'Human Resources', it: 'IT / System Admin', manager: 'Manager', facilities: 'Facilities'};

    var html = '<div style="margin-bottom:12px;font-size:13px;color:var(--text-light)">';
    html += 'Review the <strong>' + preview.total_tasks + '</strong> offboarding tasks for ';
    html += '<strong>' + esc(preview.employee.name) + '</strong> (' + esc(preview.employee.department || 'No dept') + '). ';
    html += 'Type: <strong>' + (isInvol ? '⚠️ Involuntary' : 'Voluntary') + '</strong> · Last day: <strong>' + preview.last_day + '</strong>';
    html += '</div>';

    // Security critical summary
    if (preview.security_critical_count > 0) {
        html += '<div style="background:' + (isInvol ? 'var(--danger-light, #fff5f5)' : 'var(--warning-light, #fff9db)') + ';border:2px solid ' + (isInvol ? 'var(--danger)' : 'var(--warning)') + ';border-radius:var(--radius);padding:14px;margin-bottom:12px">';
        html += '<div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">';
        html += '<span style="font-size:18px">' + (isInvol ? '🚨' : '🔒') + '</span>';
        html += '<strong style="font-size:14px;color:' + (isInvol ? 'var(--danger)' : 'var(--warning-dark, #e67700)') + '">';
        html += preview.security_critical_count + ' Security-Critical Task' + (preview.security_critical_count !== 1 ? 's' : '');
        html += '</strong>';
        if (preview.immediate_count > 0) {
            html += ' <span class="badge badge-danger">' + preview.immediate_count + ' IMMEDIATE</span>';
        }
        html += '</div>';
        if (isInvol) {
            html += '<p style="font-size:13px;margin:0;color:var(--text)"><strong>Involuntary termination protocol:</strong> All security-critical tasks below are marked <strong>IMMEDIATE</strong> and must be completed <em>today</em>. This includes disabling Active Directory, revoking VPN access, changing shared passwords, and deactivating all system accounts.</p>';
        } else {
            html += '<p style="font-size:13px;margin:0;color:var(--text-light)">Security-critical tasks (🔴) should be completed by the employee\'s last day to prevent unauthorized access.</p>';
        }
        html += '</div>';
    }

    // Equipment callout
    if (preview.equipment_count > 0) {
        html += '<div style="background:var(--info-light, #e7f5ff);border:1px solid var(--info, #1971c2);border-radius:var(--radius);padding:10px 14px;margin-bottom:12px;font-size:13px">';
        html += '💻 <strong>' + preview.equipment_count + '</strong> equipment item' + (preview.equipment_count !== 1 ? 's' : '') + ' assigned — return tasks will be generated automatically.';
        html += '</div>';
    }

    // Category stats
    var cats = preview.tasks_by_category || {};
    html += '<div style="display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px">';
    for (var cat in cats) {
        var color = catColors[cat] || '#868e96';
        html += '<span style="display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600">';
        html += '<span style="width:8px;height:8px;border-radius:50%;background:' + color + ';display:inline-block"></span>';
        html += esc(catLabels[cat] || cat) + ': ' + cats[cat] + '</span>';
    }
    html += '</div>';

    // Immediate tasks section (for involuntary)
    if (isInvol && preview.immediate_tasks && preview.immediate_tasks.length > 0) {
        html += '<details style="margin-bottom:10px" open>';
        html += '<summary style="cursor:pointer;font-weight:600;font-size:14px;padding:6px 0;border-bottom:2px solid var(--danger);color:var(--danger)">';
        html += '🚨 Immediate Actions (' + preview.immediate_tasks.length + ') — Complete Today';
        html += '</summary>';
        html += '<div style="max-height:200px;overflow-y:auto;padding:4px 0">';
        for (var ii = 0; ii < preview.immediate_tasks.length; ii++) {
            var it = preview.immediate_tasks[ii];
            html += '<div style="display:flex;align-items:start;gap:8px;padding:5px 4px;font-size:13px;border-bottom:1px solid var(--border-color-light, #eee);background:var(--danger-light, #fff5f5)">';
            html += '<span style="color:var(--danger);font-size:14px;flex-shrink:0">🔴</span>';
            html += '<div style="flex:1;min-width:0">';
            html += '<div style="font-weight:500">' + esc(it.title) + '</div>';
            html += '<div style="font-size:11px;color:var(--text-light)">' + esc(it.category || '') + ' · ' + esc(it.assigned_to || 'Unassigned') + ' · Due: TODAY</div>';
            html += '</div></div>';
        }
        html += '</div></details>';
    }

    // All tasks section grouped by category
    var catOrder = ['it', 'hr', 'facilities', 'manager'];
    var tasksByCat = {};
    (preview.tasks || []).forEach(function(t) {
        var c = t.category || 'other';
        if (!tasksByCat[c]) tasksByCat[c] = [];
        tasksByCat[c].push(t);
    });
    for (var ci = 0; ci < catOrder.length; ci++) {
        var catKey = catOrder[ci];
        var catTasks = tasksByCat[catKey];
        if (!catTasks || catTasks.length === 0) continue;
        html += '<details style="margin-bottom:10px" ' + (ci === 0 ? 'open' : '') + '>';
        html += '<summary style="cursor:pointer;font-weight:600;font-size:14px;padding:6px 0;border-bottom:1px solid var(--border-color)">';
        html += esc(catLabels[catKey] || catKey) + ' (' + catTasks.length + ')';
        html += '</summary>';
        html += '<div style="max-height:240px;overflow-y:auto;padding:4px 0">';
        for (var ti = 0; ti < catTasks.length; ti++) {
            var t = catTasks[ti];
            var secBadge = t.is_security_critical ? ' <span style="color:#e74c3c;font-size:10px">🔴 Security</span>' : '';
            var urgBadge = t.urgency === 'immediate' ? ' <span style="font-size:10px;background:var(--danger-light);color:var(--danger);padding:1px 6px;border-radius:3px;font-weight:600">IMMEDIATE</span>' : '';
            var indent = t.is_subtask ? 'padding-left:24px;' : '';
            html += '<div style="' + indent + 'display:flex;align-items:start;gap:8px;padding:5px 4px;font-size:13px;border-bottom:1px solid var(--border-color-light, #eee)">';
            html += '<span style="font-size:12px;flex-shrink:0">' + (t.is_security_critical ? '🔴' : '📋') + '</span>';
            html += '<div style="flex:1;min-width:0">';
            html += '<div style="font-weight:500">' + esc(t.title) + secBadge + urgBadge + '</div>';
            html += '<div style="font-size:11px;color:var(--text-light)">' + esc(t.assigned_to || 'Unassigned') + (t.due_date ? ' · Due ' + t.due_date : '') + '</div>';
            if (t.description) html += '<div style="font-size:11px;color:var(--text-light);margin-top:2px">' + esc(t.description).substring(0, 100) + '</div>';
            html += '</div></div>';
        }
        html += '</div></details>';
    }
    // Any remaining categories
    for (var rc in tasksByCat) {
        if (catOrder.includes(rc)) continue;
        var rcTasks = tasksByCat[rc];
        if (!rcTasks || rcTasks.length === 0) continue;
        html += '<details style="margin-bottom:10px"><summary style="cursor:pointer;font-weight:600;font-size:14px;padding:6px 0;border-bottom:1px solid var(--border-color)">';
        html += esc(catLabels[rc] || rc) + ' (' + rcTasks.length + ')</summary>';
        html += '<div style="max-height:240px;overflow-y:auto;padding:4px 0">';
        rcTasks.forEach(function(t) {
            html += '<div style="display:flex;align-items:start;gap:8px;padding:5px 4px;font-size:13px;border-bottom:1px solid var(--border-color-light, #eee)">';
            html += '<span style="font-size:12px">📋</span><div style="flex:1"><div style="font-weight:500">' + esc(t.title) + '</div>';
            html += '<div style="font-size:11px;color:var(--text-light)">' + esc(t.assigned_to || '') + (t.due_date ? ' · Due ' + t.due_date : '') + '</div></div></div>';
        });
        html += '</div></details>';
    }

    showModal((isInvol ? '⚠️' : '📋') + ' Offboarding Preview', html, {
        wide: true,
        footer: '<button class="btn btn-secondary" onclick="closeModal()">Cancel</button>' +
                ' <button class="btn ' + (isInvol ? 'btn-danger' : 'btn-warning') + '" id="confirm-offboard-btn" style="font-weight:600">' +
                (isInvol ? '⚠️ Confirm Involuntary Offboarding' : '✅ Confirm & Start Offboarding') + '</button>'
    });

    document.getElementById('confirm-offboard-btn').onclick = async function() {
        var btn = document.getElementById('confirm-offboard-btn');
        btn.disabled = true;
        btn.textContent = 'Starting...';
        var r = await api('/api/employees/' + empId + '/offboard', { method: 'POST', body: {
            last_day: lastDay, type: termType, reason: reason }});
        if (r) {
            showToast('Offboarding started' + (isInvol ? ' — complete immediate security tasks NOW' : ''), isInvol ? 'warning' : 'success');
            closeModal();
            renderOffboarding(document.getElementById('main-content'));
        } else {
            btn.disabled = false;
            btn.textContent = isInvol ? '⚠️ Confirm Involuntary Offboarding' : '✅ Confirm & Start Offboarding';
        }
    };
}

/* =============================================================
   TASKS VIEW
   ============================================================= */
async function renderTasks(el) {
    state.taskCategoryFilter = state.taskCategoryFilter || '';
    state.taskSearch = state.taskSearch || '';
    const groupByEmp = isRole('manager') && state.taskGroupByEmployee;
    el.innerHTML = `<h1>Tasks</h1>
        <div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:12px">
        <div class="tabs" id="task-tabs" role="tablist" style="margin-bottom:0">
            <div class="tab ${state.taskFilter==='all'?'active':''}" ${tabAttrs(state.taskFilter==='all')} onclick="state.taskFilter='all';renderTasks(document.getElementById('main-content'))">All</div>
            <div class="tab ${state.taskFilter==='mine'?'active':''}" ${tabAttrs(state.taskFilter==='mine')} onclick="state.taskFilter='mine';renderTasks(document.getElementById('main-content'))">My Tasks</div>
            <div class="tab ${state.taskFilter==='overdue'?'active':''}" ${tabAttrs(state.taskFilter==='overdue')} onclick="state.taskFilter='overdue';renderTasks(document.getElementById('main-content'))">Overdue</div>
            <div class="tab ${state.taskFilter==='completed'?'active':''}" ${tabAttrs(state.taskFilter==='completed')} onclick="state.taskFilter='completed';renderTasks(document.getElementById('main-content'))">Completed</div>
        </div>
        <input type="search" id="taskSearchInput" class="form-control" placeholder="🔍 Search tasks..." value="${esc(state.taskSearch)}"
            oninput="state.taskSearch=this.value;clearTimeout(window._taskSearchTimer);window._taskSearchTimer=setTimeout(()=>renderTasks(document.getElementById('main-content')),300)"
            style="width:200px;padding:6px 10px;font-size:13px">
        <select id="taskCategoryFilter" onchange="state.taskCategoryFilter=this.value;renderTasks(document.getElementById('main-content'))"
                style="padding:6px 10px;border:1px solid var(--border);border-radius:var(--radius);background:var(--card-bg);color:var(--text);font-size:13px">
            <option value="">All Categories</option>
            <option value="it" ${state.taskCategoryFilter==='it'?'selected':''}>🖥️ IT</option>
            <option value="hr" ${state.taskCategoryFilter==='hr'?'selected':''}>👤 HR</option>
            <option value="manager" ${state.taskCategoryFilter==='manager'?'selected':''}>👔 Manager</option>
            <option value="facilities" ${state.taskCategoryFilter==='facilities'?'selected':''}>🏢 Facilities</option>
            <option value="employee" ${state.taskCategoryFilter==='employee'?'selected':''}>🙋 Employee</option>
            <option value="training" ${state.taskCategoryFilter==='training'?'selected':''}>📚 Training</option>
            <option value="voice" ${state.taskCategoryFilter==='voice'?'selected':''}>📞 Voice</option>
            <option value="sales" ${state.taskCategoryFilter==='sales'?'selected':''}>💰 Sales</option>
        </select>
        ${isRole('manager')?`<label style="display:flex;align-items:center;gap:4px;font-size:12px;cursor:pointer" title="When checked, tasks are grouped under each employee instead of shown in a flat list"><input type="checkbox" ${groupByEmp?'checked':''} onchange="state.taskGroupByEmployee=this.checked;renderTasks(document.getElementById('main-content'))"> Group by employee</label>`:''}
        ${isRole('admin','hr')?`<button class="btn btn-sm" onclick="showBulkImportModal()" style="font-size:12px;padding:4px 12px">📥 Import Employees</button>`:''}
        ${isRole('admin','hr')?'<button class="btn btn-sm" onclick="sendBulkReminders()" style="background:var(--warning);color:#fff;font-size:12px;padding:4px 12px;margin-left:auto">📢 Send Reminders</button>':''}
        <button class="btn btn-sm btn-secondary" onclick="exportTasksCSV()" style="font-size:12px;padding:4px 12px">📥 Export CSV</button>
        </div>
        <div class="card" id="tasks-content"><div class="loading-center"><div class="spinner lg"></div></div></div>`;

    const params = new URLSearchParams();
    if (state.taskFilter === 'mine') params.set('assigned_to', 'me');
    if (state.taskFilter === 'overdue') params.set('overdue', 'true');
    if (state.taskFilter === 'completed') params.set('status', 'completed');
    if (state.taskCategoryFilter) params.set('category', state.taskCategoryFilter);
    const data = await api('/api/tasks?' + params);
    let tasks = data?.tasks || data || [];
    state._lastTasksData = tasks;  // Store for CSV export
    const content = document.getElementById('tasks-content');
    if (!content) return;

    // Client-side search filter
    if (state.taskSearch) {
        const q = state.taskSearch.toLowerCase();
        tasks = tasks.filter(t => (t.title||'').toLowerCase().includes(q) || (t.employee_name||'').toLowerCase().includes(q) || (t.assigned_to||'').toLowerCase().includes(q));
    }
    if (!tasks.length) { content.innerHTML = `<div class="empty-state"><div class="icon">✅</div><h3>No tasks found</h3>${state.taskSearch?'<p>Try a different search term.</p>':''}</div>`; return; }

    // Group by employee for managers
    if (groupByEmp) {
        const groups = {};
        tasks.forEach(t => { const name = t.employee_name || 'Unassigned'; (groups[name] = groups[name]||[]).push(t); });
        content.innerHTML = `<div id="bulk-actions-bar" style="display:none;padding:10px 16px;background:var(--primary-light);border:1px solid var(--primary);border-radius:var(--radius);margin-bottom:12px;align-items:center;gap:12px;flex-wrap:wrap">
            <span id="bulk-count" style="font-weight:600;font-size:13px">0 selected</span>
            <button onclick="bulkCompleteTasks()" class="btn btn-success btn-xs">✅ Complete Selected</button>
            <button onclick="bulkSkipTasks()" class="btn btn-light btn-xs">⏭️ Skip Selected</button>
            <button onclick="showBulkReassign()" class="btn btn-light btn-xs">👤 Reassign Selected</button>
            <button onclick="clearTaskSelection()" class="btn btn-light btn-xs" style="margin-left:auto">✕ Clear</button>
        </div>` + Object.entries(groups).map(([name, gTasks]) => {
            const done = gTasks.filter(t=>t.status==='completed').length;
            const pct = Math.round(done/gTasks.length*100);
            return `<div style="margin-bottom:16px">
                <div class="checklist-group-header" role="button" tabindex="0" aria-expanded="true" onclick="toggleCollapse(this)" onkeydown="handleCollapseKeydown(event,this)">
                    <span class="toggle" aria-hidden="true">▼</span> <strong>${esc(name)}</strong>
                    <span class="badge badge-secondary">${done}/${gTasks.length}</span>
                    <div style="flex:1;max-width:150px;margin-left:auto">${progressBar(pct)}</div>
                </div>
                <div class="collapsible-content"><div class="table-wrap"><table><thead><tr><th style="width:32px"><input type="checkbox" onchange="toggleAllTasks(this.checked)" title="Select all"></th><th>Task</th><th>Phase</th><th>Category</th><th>Due</th><th>Status</th></tr></thead><tbody>${
                    gTasks.map(t => {
                        const overdue = t.status !== 'completed' && t.due_date && daysUntil(t.due_date) < 0;
                        return `<tr style="${overdue?'background:var(--danger-light)':''}">
                            <td><input type="checkbox" class="task-select-cb" value="${t.id}" onchange="updateBulkBar()"></td>
                            <td><strong>${esc(t.title)}</strong></td>
                            <td>${t.phase ? phaseBadge(t.phase) : '—'}</td>
                            <td><span class="badge badge-secondary">${CATEGORY_ICONS[t.category]||'📋'} ${esc(CATEGORY_LABELS[t.category]||t.category||'')}</span></td>
                            <td>${formatDate(t.due_date)}${overdue?` <span class="badge badge-danger">${Math.abs(daysUntil(t.due_date))}d</span>`:''}</td>
                            <td><select class="form-control" style="width:auto;display:inline;padding:4px;font-size:12px" onchange="updateTaskStatus(${t.id},this.value)">

                            </select></td></tr>`;
                    }).join('')
                }</tbody></table></div></div></div>`;
        }).join('');
        return;
    }

        tasks.map(t => {

            return `<tr style="${overdue?'background:var(--danger-light)':''}">
                <td><input type="checkbox" class="task-select-cb" value="${t.id}" onchange="updateBulkBar()"></td>
                <td><strong>${esc(t.title)}</strong>
                    ${t.is_security_critical ? ' <span class="badge badge-security">🔴</span>' : ''}
                    ${t.compliance_required ? ' <span class="badge badge-compliance">📋</span>' : ''}</td>

                <td>${t.phase ? phaseBadge(t.phase) : '—'}</td>
                <td><span class="badge badge-secondary">${CATEGORY_ICONS[t.category]||'📋'} ${esc(CATEGORY_LABELS[t.category]||t.category||'')}</span></td>
                <td>${esc(t.assigned_to||'')} ${isRole('admin','hr','manager') ? `<button style="background:none;border:none;cursor:pointer;padding:0 2px;font-size:13px" title="Reassign" onclick="showReassignModal(${t.id},'${esc(t.assigned_to||'').replace(/'/g,"\\&#39;")}','${esc(t.assigned_email||'').replace(/'/g,"\\&#39;")}')">↪️</button>` : ''}</td>
                <td>${formatDate(t.due_date)}${overdue?` <span class="badge badge-danger">${Math.abs(daysUntil(t.due_date))}d</span>`:''}</td>
                <td><select class="form-control" style="width:auto;display:inline;padding:4px;font-size:12px" onchange="updateTaskStatus(${t.id},this.value)">
                    <option value="pending" ${t.status==='pending'?'selected':''}>Pending</option>
                    <option value="in_progress" ${t.status==='in_progress'?'selected':''}>In Progress</option>
                    <option value="completed" ${t.status==='completed'?'selected':''}>Completed</option>
                    <option value="skipped" ${t.status==='skipped'?'selected':''}>Skipped</option>
                </select></td></tr>`;
        }).join('')
    }</tbody></table></div>`;
}

/* --- Bulk Task Operations --- */
function toggleAllTasks(checked) {
    document.querySelectorAll('.task-select-cb').forEach(function(cb) { cb.checked = checked; });
    updateBulkBar();
}
function updateBulkBar() {
    var selected = document.querySelectorAll('.task-select-cb:checked');
    var bar = document.getElementById('bulk-actions-bar');
    if (!bar) return;
    if (selected.length > 0) {
        bar.style.display = 'flex';
        document.getElementById('bulk-count').textContent = selected.length + ' selected';
    } else {
        bar.style.display = 'none';
    }
}
function getSelectedTaskIds() {
    var ids = [];
    document.querySelectorAll('.task-select-cb:checked').forEach(function(cb) { ids.push(parseInt(cb.value)); });
    return ids;
}
function clearTaskSelection() {
    document.querySelectorAll('.task-select-cb').forEach(function(cb) { cb.checked = false; });
    var selectAll = document.querySelectorAll('th input[type="checkbox"]');
    selectAll.forEach(function(cb) { cb.checked = false; });
    updateBulkBar();
}
async function bulkCompleteTasks() {
    var ids = getSelectedTaskIds();
    if (ids.length === 0) return;
    if (!confirm('Complete ' + ids.length + ' task(s)?')) return;
    var res = await api('/api/tasks/bulk', { method: 'POST', body: { task_ids: ids, action: 'complete' } });
    if (res && res.ok) {
        showToast(res.updated + ' task(s) completed', 'success');
    } else {
        showToast('Bulk complete failed', 'error');
    }
    clearTaskSelection();
    render();
}
async function bulkSkipTasks() {
    var ids = getSelectedTaskIds();
    if (ids.length === 0) return;
    if (!confirm('Skip ' + ids.length + ' task(s)?')) return;
    var res = await api('/api/tasks/bulk', { method: 'POST', body: { task_ids: ids, action: 'skip' } });
    if (res && res.ok) {
        showToast(res.updated + ' task(s) skipped', 'success');
    } else {
        showToast('Bulk skip failed', 'error');
    }
    clearTaskSelection();
    render();
}
function showBulkReassign() {
    var ids = getSelectedTaskIds();
    if (ids.length === 0) return;
    showModal('Reassign ' + ids.length + ' Task(s)', `
        <div class="form-group">
            <label>Reassign to <span class="required">*</span></label>
            <input type="email" id="bulk-reassign-email" class="form-control" placeholder="Enter email address" />
        </div>
        <p style="font-size:12px;color:var(--text-light)">The new assignee will receive a Slack notification.</p>
    `, {
        footer: `<button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
                 <button class="btn btn-primary" onclick="doBulkReassign()">Reassign</button>`
    });
}
async function doBulkReassign() {
    var email = (document.getElementById('bulk-reassign-email')?.value || '').trim();
    if (!email) { showToast('Please enter an email address', 'warning'); return; }
    var ids = getSelectedTaskIds();
    closeModal();
    var res = await api('/api/tasks/bulk', { method: 'POST', body: { task_ids: ids, action: 'reassign', assigned_email: email } });
    if (res && res.ok) {
        showToast(res.updated + ' task(s) reassigned to ' + esc(email), 'success');
    } else {
        showToast('Bulk reassign failed', 'error');
    }
    clearTaskSelection();
    render();
}
// Legacy wrapper kept for any external callers
async function bulkReassignTasks(ids, email) { doBulkReassign(); }

                <input class="form-control" type="number" placeholder="Days" title="Due offset (days from start)" value="${t.due_offset_days||0}" onchange="window._tplTasks[${i}].due_offset_days=parseInt(this.value)||0" style="width:65px;font-size:11px">
            </div>

function updateTaskCount() {
    const label = document.querySelector('#tpl-tasks-list')?.closest('.form-group')?.querySelector('label span');
    if (label) label.textContent = '(' + window._tplTasks.length + ')';
}

function addTemplateTaskRow() {
    window._tplTasks.push({ title: '', description: '', category: 'hr', assigned_to: '', due_offset_days: 0, phase: 'company_onboarding' });
    renderTemplateTaskRows();
    updateTaskCount();
    const container = document.getElementById('tpl-tasks-list');
    if (container) container.scrollTop = container.scrollHeight;
}

async function saveTemplate() {
    const name = document.getElementById('tpl-name')?.value.trim();
    if (!name) { showToast('Name required', 'warning'); return; }
    const tasks = (window._tplTasks || []).filter(t => t.title.trim());
    if (!tasks.length) { showToast('Add at least one task', 'warning'); return; }

    const body = {
        name,
        department: document.getElementById('tpl-dept')?.value,
        checklist_type: document.getElementById('tpl-type')?.value,
        phase: document.getElementById('tpl-phase')?.value || null,
        tasks_json: JSON.stringify(tasks),
    };

    let r;
    if (window._tplEditId) {
        r = await api('/api/admin/templates/' + window._tplEditId, { method: 'PUT', body });
    } else {
        r = await api('/api/admin/templates', { method: 'POST', body });
    }
    if (r) { showToast(window._tplEditId ? 'Template updated' : 'Template created'); closeModal(); renderTemplates(document.getElementById('main-content')); }
}

async function duplicateTemplate(id) {
    const r = await api('/api/admin/templates/' + id + '/duplicate', { method: 'POST' });
    if (r) { showToast('Template cloned'); renderTemplates(document.getElementById('main-content')); }
}
async function deactivateTemplate(id) { confirmDialog('Deactivate this template?', async () => { const r = await api('/api/admin/templates/' + id, { method: 'DELETE' }); if (r) { showToast('Template deactivated'); renderTemplates(document.getElementById('main-content')); } }); }

function exportTemplate(id) {
    // Direct download — the backend streams the .xlsx file
    const url = BASE_PATH + '/api/admin/templates/' + id + '/export';
    const a = document.createElement('a');
    a.href = url;
    a.style.display = 'none';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    showToast('Exporting template…', 'info');
}

function importTemplateFromExcel() {
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = '.xlsx';
    input.style.display = 'none';
    input.addEventListener('change', async function() {
        const file = this.files[0];
        if (!file) return;
        if (!file.name.toLowerCase().endsWith('.xlsx')) {
            showToast('Please select an Excel (.xlsx) file', 'error');
            return;
        }
        showToast('Importing template…', 'info');
        const formData = new FormData();
        formData.append('file', file);
        try {
            const res = await fetch(BASE_PATH + '/api/admin/templates/import', {
                method: 'POST',
                headers: { 'X-Requested-With': 'XMLHttpRequest' },
                body: formData,
            });
            const data = await res.json();
            if (!res.ok) {
                showToast(data.error || 'Import failed', 'error');
                return;
            }
            showToast('Template "' + (data.name || 'Imported') + '" imported with ' + (JSON.parse(data.tasks_json || '[]').length) + ' tasks', 'success');
            renderTemplates(document.getElementById('main-content'));
        } catch (e) {
            showToast('Import failed: ' + e.message, 'error');
        }
    });
    document.body.appendChild(input);
    input.click();
    document.body.removeChild(input);
}

function showBulkImportModal() {
    showModal('📥 Bulk Import Employees', `

        </p>

                <div class="tab active" id="import-tab-csv" role="tab" aria-selected="true" tabindex="0" onkeydown="handleTabKeydown(event)" onclick="switchImportTab('csv')">CSV</div>
                <div class="tab" id="import-tab-json" role="tab" aria-selected="false" tabindex="-1" onkeydown="handleTabKeydown(event)" onclick="switchImportTab('json')">JSON</div>
            </div>
            <textarea class="form-control" id="import-data" rows="10" placeholder="first_name,last_name,email,department,title,start_date&#10;Jane,Doe,jane@celito.net,Engineering,Developer,2026-09-15"></textarea>
        </div>
        <div id="import-preview"></div>
    `, { footer: `<button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
                   <button class="btn btn-secondary" onclick="previewBulkImport()">Preview</button>
                   <button class="btn btn-primary" onclick="executeBulkImport()">Import</button>`, width: '700px' });
    window._importFormat = 'csv';
}

function switchImportTab(fmt) {
    window._importFormat = fmt;
    document.getElementById('import-tab-csv')?.classList.toggle('active', fmt==='csv');
    document.getElementById('import-tab-json')?.classList.toggle('active', fmt==='json');
    const ta = document.getElementById('import-data');
    if (ta) ta.placeholder = fmt === 'json'
        ? '[{"first_name":"Jane","last_name":"Doe","email":"jane@celito.net","department":"Engineering"}]'
        : 'first_name,last_name,email,department,title,start_date\nJane,Doe,jane@celito.net,Engineering,Developer,2026-09-15';
}

function parseBulkData() {
    const raw = document.getElementById('import-data')?.value.trim();
    if (!raw) return [];
    if (window._importFormat === 'json') {
        try { return JSON.parse(raw); } catch(e) { showToast('Invalid JSON: ' + e.message, 'error'); return []; }
    }
    // CSV parsing
    const lines = raw.split('\n').map(l => l.trim()).filter(Boolean);
    if (lines.length < 2) { showToast('CSV needs a header row + at least one data row', 'warning'); return []; }
    const headers = lines[0].split(',').map(h => h.trim().toLowerCase().replace(/\s+/g,'_'));
    return lines.slice(1).map(line => {
        const vals = line.split(',').map(v => v.trim());
        const obj = {};
        headers.forEach((h, i) => { obj[h] = vals[i] || ''; });
        return obj;
    });
}

function previewBulkImport() {
    const employees = parseBulkData();
    if (!employees.length) return;
    const preview = document.getElementById('import-preview');
    const required = ['first_name','last_name','email'];
    preview.innerHTML = `<div class="import-preview"><table><thead><tr>
        <th>#</th><th>First</th><th>Last</th><th>Email</th><th>Dept</th><th>Start</th><th>Status</th>
    </tr></thead><tbody>${employees.map((e, i) => {
        const missing = required.filter(f => !e[f]);
        const ok = missing.length === 0;
        return `<tr class="${ok?'':'import-row-error'}">
            <td>${i+1}</td><td>${esc(e.first_name||'')}</td><td>${esc(e.last_name||'')}</td>
            <td>${esc(e.email||'')}</td><td>${esc(e.department||'—')}</td><td>${esc(e.start_date||'—')}</td>
            <td>${ok?'<span class="badge badge-success">OK</span>':`<span class="badge badge-danger">Missing: ${missing.join(', ')}</span>`}</td></tr>`;
    }).join('')}</tbody></table></div>
    <div style="font-size:12px;margin-top:8px;color:var(--text-light)">${employees.length} employee${employees.length!==1?'s':''} found</div>`;
}

async function executeBulkImport() {
    const employees = parseBulkData();
    if (!employees.length) { showToast('No data to import', 'warning'); return; }
    const missing = employees.filter(e => !e.first_name || !e.last_name || !e.email);
    if (missing.length) { showToast(`${missing.length} row(s) missing required fields. Fix and try again.`, 'error'); return; }
    const r = await api('/api/employees/bulk', { method: 'POST', body: { employees } });
    if (r) {
        const created = r.created || r.count || employees.length;
        showToast(`✅ ${created} employee${created!==1?'s':''} imported`);
        closeModal();
        renderTasks(document.getElementById('main-content'));
    }
}

async function loadAuditLog(page) {
    const q = (document.getElementById('audit-q')?.value || '').trim();
    const user = (document.getElementById('audit-user')?.value || '').trim();
    const action = document.getElementById('audit-action')?.value || '';
    const from = document.getElementById('audit-from')?.value || '';
    const to = document.getElementById('audit-to')?.value || '';
    const params = new URLSearchParams({per_page: '50', page: String(page)});
    if (q) params.set('q', q);
    if (user) params.set('user_email', user);
    if (action) params.set('action', action);
    if (from) params.set('from', from);
    if (to) params.set('to', to);
    const container = document.getElementById('audit-results');
    if (!container) return;
    container.innerHTML = '<div class="loading-center"><div class="spinner"></div></div>';
    const data = await api('/api/admin/audit-log?' + params.toString());
    const entries = data?.entries || data || [];
    const total = data?.total || entries.length;
    const pages = data?.pages || 1;
    if (!entries.length) { container.innerHTML = '<div class="empty-state"><p>No audit log entries match your filters</p></div>'; return; }
    const start = (page - 1) * 50 + 1;
    const end = Math.min(page * 50, total);
    container.innerHTML = `<div class="card">${entries.map(l => `<div class="audit-entry">
        <span class="audit-time">${formatDate(l.created_at)} ${new Date(l.created_at).toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit'})}</span> —
        <span class="audit-user">${esc(l.user_email)}</span> ${esc(l.action)}
        ${l.details ? ` — <span style="color:var(--text-light)">${esc(typeof l.details==='string'?l.details:JSON.stringify(l.details))}</span>` : ''}
    </div>`).join('')}</div>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-size:13px;color:var(--text-light)">
        <span>Showing ${start}–${end} of ${total}</span>
        <div style="display:flex;gap:6px">
            ${page > 1 ? `<button class="btn btn-sm btn-secondary" onclick="loadAuditLog(${page-1})">← Previous</button>` : ''}
            ${page < pages ? `<button class="btn btn-sm btn-secondary" onclick="loadAuditLog(${page+1})">Next →</button>` : ''}
        </div>
    </div>`;
}
function clearAuditFilters() {
    ['audit-q','audit-user','audit-from','audit-to'].forEach(id => { const el = document.getElementById(id); if (el) el.value = ''; });
    const sel = document.getElementById('audit-action'); if (sel) sel.value = '';
    loadAuditLog(1);
}

    if (res?.ok) {

function filterEntraUsers() {
    const q = (document.getElementById('au-search')?.value || '').toLowerCase();
    const list = document.getElementById('au-entra-list');
    if (!q || q.length < 2) { list.style.display = 'none'; return; }

    const matches = (window._entraUsers || []).filter(u =>
        u.display_name.toLowerCase().includes(q) || u.email.toLowerCase().includes(q)
    ).slice(0, 15);

    if (matches.length === 0) {
        list.innerHTML = '<div style="padding:8px 12px;color:var(--text-muted);font-size:13px">No matching users found</div>';
    } else {
        list.innerHTML = matches.map(u => `
            <div style="padding:8px 12px;cursor:pointer;border-bottom:1px solid var(--border-light);font-size:13px;display:flex;justify-content:space-between;align-items:center"
                 onmouseover="this.style.background='var(--hover)'" onmouseout="this.style.background=''"
                 onclick="selectEntraUser('${esc(u.email)}','${esc(u.display_name)}','${esc(u.department)}')">
                <div><strong>${esc(u.display_name)}</strong><br><span style="color:var(--text-muted)">${esc(u.email)}</span></div>
                <span style="color:var(--text-muted);font-size:11px">${esc(u.department)}</span>
            </div>
        `).join('');
    }
    list.style.display = 'block';
}

function selectEntraUser(email, name, department) {
    document.getElementById('au-email').value = email;
    document.getElementById('au-name').value = name;
    document.getElementById('au-search').value = name;
    document.getElementById('au-entra-list').style.display = 'none';
    document.getElementById('au-selected').style.display = 'block';
    document.getElementById('au-selected').innerHTML = '✅ <strong>' + esc(name) + '</strong> — ' + esc(email);
    // Auto-select department if it matches
    if (department) {
        const deptSelect = document.getElementById('au-dept');
        for (let i = 0; i < deptSelect.options.length; i++) {
            if (deptSelect.options[i].value.toLowerCase() === department.toLowerCase()) {
                deptSelect.selectedIndex = i;
                break;
            }
        }
    }
}

async function saveNewUser() {
    let email = document.getElementById('au-email')?.value.trim();
    let name = document.getElementById('au-name')?.value.trim();
    // Fallback: if no user was selected from Entra, treat the search box as a manual email
    if (!email) {
        const searchVal = document.getElementById('au-search')?.value.trim() || '';
        if (searchVal.includes('@')) { email = searchVal; name = name || searchVal.split('@')[0]; }
    }
    if (!email || !name) { showToast('Select a user from the directory or type an email', 'warning'); return; }
    const r = await api('/api/admin/users', { method: 'POST', body: { email, display_name: name, role: document.getElementById('au-role')?.value, department: document.getElementById('au-dept')?.value }});
    if (r) { showToast('User added'); closeModal(); switchAdminTab('users'); }
}

async function updateUserRole(id, role, name) {
    if (role === 'disabled') {
        if (!confirm('Are you sure you want to disable ' + (name||'this user') + '? They will no longer be able to log in.')) {
            switchAdminTab('users'); return;
        }
    }
    const r = await api('/api/admin/users/' + id, { method: 'PUT', body: { role } });

}
