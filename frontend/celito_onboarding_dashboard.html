<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Celito Onboarding & Offboarding</title>
<link rel="manifest" id="manifest-link" href="/onboard/manifest.json">
<link rel="icon" type="image/svg+xml" id="icon-link" href="/onboard/assets/icon.svg">
<meta name="theme-color" content="#00447c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Celito Onboarding">
<style>
/* ============================================================
   CSS RESET & VARIABLES
   ============================================================ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
    --primary: #00447c;
    --primary-light: #e8f0f8;
    --primary-dark: #002f56;
    --secondary: #e8871e;
    --secondary-light: #fdf0e2;
    --success: #28a745;
    --success-light: #e6f4ea;
    --warning: #ffc107;
    --warning-light: #fff8e1;
    --danger: #dc3545;
    --danger-light: #fdecea;
    --purple: #6f42c1;
    --purple-light: #f0e6ff;
    --bg: #f4f6f9;
    --card-bg: #ffffff;
    --text: #333333;
    --text-light: #6c757d;
    --text-muted: #555d68;
    --border: #dee2e6;
    --border-light: #e9ecef;
    --radius: 8px;
    --radius-sm: 4px;
    --shadow: 0 2px 8px rgba(0,0,0,0.08);
    --shadow-lg: 0 4px 16px rgba(0,0,0,0.12);
    --sidebar-w: 240px;
    --navbar-h: 56px;
    --font: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --transition: 0.2s ease;
}

@media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
        --primary: #5b9bd5;
        --primary-light: #1a2d42;
        --primary-dark: #7bb3e8;
        --secondary: #f0a050;
        --secondary-light: #3a2a14;
        --success: #4caf7a;
        --success-light: #1a2e20;
        --warning: #f0c050;
        --warning-light: #3a3014;
        --danger: #e06060;
        --danger-light: #3a1a1a;
        --purple: #9b7ed8;
        --purple-light: #2a1f3a;
        --bg: #121418;
        --card-bg: #1a1d24;
        --text: #e0e2e8;
        --text-light: #9098a8;
        --text-muted: #8090a0;
        --border: #2a2e38;
        --border-light: #222630;
        --shadow: 0 2px 8px rgba(0,0,0,0.3);
        --shadow-lg: 0 4px 16px rgba(0,0,0,0.4);
    }
}

:root[data-theme="dark"] {
    --primary: #5b9bd5;
    --primary-light: #1a2d42;
    --primary-dark: #7bb3e8;
    --secondary: #f0a050;
    --secondary-light: #3a2a14;
    --success: #4caf7a;
    --success-light: #1a2e20;
    --warning: #f0c050;
    --warning-light: #3a3014;
    --danger: #e06060;
    --danger-light: #3a1a1a;
    --purple: #9b7ed8;
    --purple-light: #2a1f3a;
    --bg: #121418;
    --card-bg: #1a1d24;
    --text: #e0e2e8;
    --text-light: #9098a8;
    --text-muted: #8090a0;
    --border: #2a2e38;
    --border-light: #222630;
    --shadow: 0 2px 8px rgba(0,0,0,0.3);
    --shadow-lg: 0 4px 16px rgba(0,0,0,0.4);
}

html, body { height: 100%; font-family: var(--font); font-size: max(15px, 1rem); color: var(--text); background: var(--bg); line-height: 1.5; }
a { color: var(--primary); text-decoration: none; }
a:hover { text-decoration: underline; }
button, input, select, textarea { font-family: inherit; font-size: inherit; color: inherit; }

/* ============================================================
   LAYOUT
   ============================================================ */
.app-container { display: flex; flex-direction: column; height: 100vh; }

.impersonation-banner { background: var(--danger); color: #fff; text-align: center; padding: 6px 16px; font-size: 13px; display: none; }
.impersonation-banner a { color: #fff; font-weight: 600; text-decoration: underline; margin-left: 12px; }

.navbar { height: var(--navbar-h); background: var(--card-bg); border-bottom: 1px solid var(--border); display: flex; align-items: center; padding: 0 20px; gap: 16px; flex-shrink: 0; z-index: 100; }
.navbar-brand { display: flex; align-items: center; gap: 10px; font-size: 15px; font-weight: 600; color: var(--text); white-space: nowrap; }
.navbar-brand .logo { font-size: 18px; font-weight: 800; letter-spacing: 2px; color: var(--primary); }
.navbar-brand .separator { width: 1px; height: 24px; background: var(--border); }
.navbar-spacer { flex: 1; }
.hamburger { display: none; background: none; border: none; font-size: 22px; cursor: pointer; padding: 4px 8px; color: var(--text); }
.user-menu { position: relative; display: flex; align-items: center; gap: 8px; cursor: pointer; padding: 4px 8px; border-radius: var(--radius-sm); }
.user-menu:hover { background: var(--bg); }
.user-avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--primary); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600; }
.user-info { text-align: right; }
.user-info .name { font-size: 13px; font-weight: 600; }
.user-info .role { font-size: 11px; color: var(--text-light); text-transform: capitalize; }
.user-dropdown { position: absolute; top: 100%; right: 0; background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow-lg); min-width: 160px; display: none; z-index: 200; overflow: hidden; }
.user-dropdown.open { display: block; }
.user-dropdown a { display: block; padding: 10px 16px; color: var(--text); font-size: 13px; }
.user-dropdown a:hover { background: var(--bg); text-decoration: none; }
.user-dropdown .divider { border-top: 1px solid var(--border-light); }

.app-body { display: flex; flex: 1; overflow: hidden; }

.sidebar { width: var(--sidebar-w); background: var(--card-bg); border-right: 1px solid var(--border); overflow-y: auto; flex-shrink: 0; padding: 12px 0; transition: transform var(--transition); display: flex; flex-direction: column; }
.sidebar-section { padding: 8px 16px 4px; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.8px; color: var(--text-muted); }
.nav-item { display: flex; align-items: center; gap: 10px; padding: 10px 20px; color: var(--text-light); font-size: 13px; font-weight: 500; cursor: pointer; transition: all var(--transition); border-left: 3px solid transparent; }
.nav-item:hover { color: var(--primary); background: var(--primary-light); text-decoration: none; }
.nav-item.active { color: var(--primary); background: var(--primary-light); border-left-color: var(--primary); font-weight: 600; }
.nav-item .icon { font-size: 16px; width: 22px; text-align: center; }
.nav-item .badge { margin-left: auto; background: var(--danger); color: #fff; font-size: 10px; font-weight: 700; padding: 1px 6px; border-radius: 10px; min-width: 18px; text-align: center; }
.nav-item .badge-count { margin-left: auto; background: var(--primary); color: #fff; font-size: 10px; font-weight: 700; padding: 1px 6px; border-radius: 10px; min-width: 18px; text-align: center; }

.main-content { flex: 1; overflow-y: auto; padding: 24px; }
.main-content > :last-child { margin-bottom: 0; }
.main-content h1 { font-size: 22px; font-weight: 700; color: var(--text); margin-bottom: 20px; }
.main-content h2 { font-size: 17px; font-weight: 600; color: var(--text); margin-bottom: 14px; }

/* ============================================================
   COMPONENTS
   ============================================================ */
.card { background: var(--card-bg); border-radius: var(--radius); box-shadow: var(--shadow); padding: 20px; margin-bottom: 16px; }
.card-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
.card-header h2 { margin-bottom: 0; }

.stats-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 24px; }
.stat-card { background: var(--card-bg); border-radius: var(--radius); box-shadow: var(--shadow); padding: 20px; display: flex; align-items: center; gap: 16px; }
.stat-icon { width: 48px; height: 48px; border-radius: var(--radius); display: flex; align-items: center; justify-content: center; font-size: 22px; flex-shrink: 0; }
.stat-icon.blue { background: var(--primary-light); }
.stat-icon.orange { background: var(--secondary-light); }
.stat-icon.green { background: var(--success-light); }
.stat-icon.red { background: var(--danger-light); }
.stat-icon.purple { background: var(--purple-light); }
.stat-value { font-size: 28px; font-weight: 700; color: var(--text); line-height: 1; }
.stat-label { font-size: 13px; color: var(--text-muted); margin-top: 2px; }

.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 24px; }
.grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; margin-bottom: 24px; }

.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
th { text-align: left; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-light); padding: 10px 12px; border-bottom: 2px solid var(--border); white-space: nowrap; }
td { padding: 10px 12px; border-bottom: 1px solid var(--border-light); font-size: 13px; vertical-align: middle; }
tr:hover td { background: var(--bg); }

.badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: 600; white-space: nowrap; }
.badge-primary { background: var(--primary-light); color: var(--primary); }
.badge-success { background: var(--success-light); color: var(--success); }
.badge-warning { background: var(--warning-light); color: var(--secondary); }
.badge-danger { background: var(--danger-light); color: var(--danger); }
.badge-secondary { background: var(--border-light); color: var(--text-light); }
.badge-info { background: var(--primary-light); color: var(--primary); }
.badge-purple { background: var(--purple-light); color: var(--purple); }
.badge-security { background: var(--danger); color: #fff; font-size: 10px; }
.badge-compliance { background: var(--purple); color: #fff; font-size: 10px; }
.checklist-item.pending-review { background: var(--warning-light); border-left: 3px solid var(--secondary); }
.checklist-item.skipped-rehire { opacity: 0.6; }

.progress-bar { width: 100%; height: 8px; background: var(--border-light); border-radius: 4px; overflow: hidden; }
.progress-bar .fill { height: 100%; border-radius: 4px; transition: width 0.5s ease; }
.progress-bar .fill.green { background: var(--success); }
.progress-bar .fill.blue { background: var(--primary); }
.progress-bar .fill.orange { background: var(--secondary); }
.progress-bar .fill.red { background: var(--danger); }
.progress-label { font-size: 11px; color: var(--text-light); margin-top: 2px; }

.btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 16px; border: none; border-radius: var(--radius-sm); font-size: 13px; font-weight: 600; cursor: pointer; transition: all var(--transition); white-space: nowrap; }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.btn-primary { background: var(--primary); color: #fff; }
.btn-primary:hover:not(:disabled) { background: var(--primary-dark); }
.btn-secondary { background: var(--bg); color: var(--text); border: 1px solid var(--border); }
.btn-secondary:hover:not(:disabled) { background: var(--border-light); }
.btn-success { background: var(--success); color: #fff; }
.btn-success:hover:not(:disabled) { background: var(--success); filter: brightness(0.85); }
.btn-danger { background: var(--danger); color: #fff; }
.btn-danger:hover:not(:disabled) { background: var(--danger); filter: brightness(0.85); }
.btn-warning { background: var(--secondary); color: #fff; }
.btn-warning:hover:not(:disabled) { background: var(--secondary); filter: brightness(0.85); }
.btn-sm { padding: 5px 10px; font-size: 12px; }
.btn-xs { padding: 6px 12px; font-size: 12px; }
.btn-group { display: flex; gap: 8px; flex-wrap: wrap; }

.form-group { margin-bottom: 16px; }
.form-group label { display: block; font-size: 12px; font-weight: 600; color: var(--text); margin-bottom: 4px; }
.form-group label .required { color: var(--danger); }
.form-control { width: 100%; padding: 8px 12px; border: 1px solid var(--border); border-radius: var(--radius-sm); font-size: 13px; transition: border-color var(--transition); background: var(--card-bg); }
.form-control:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px color-mix(in srgb, var(--primary) 15%, transparent); }
.form-control.error { border-color: var(--danger); }
.form-error { font-size: 11px; color: var(--danger); margin-top: 2px; display: none; }
.form-error.show { display: block; }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
select.form-control { appearance: auto; }
textarea.form-control { resize: vertical; min-height: 80px; }

.search-bar { display: flex; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
.search-bar .search-input { flex: 1; min-width: 200px; position: relative; }
.search-bar .search-input input { padding-left: 36px; }
.search-bar .search-input::before { content: '🔍'; position: absolute; left: 10px; top: 50%; transform: translateY(-50%); font-size: 14px; z-index: 1; }
.search-bar select { min-width: 140px; }

.tabs { display: flex; gap: 0; border-bottom: 2px solid var(--border); margin-bottom: 20px; overflow-x: auto; }
.tab { padding: 10px 20px; font-size: 13px; font-weight: 600; color: var(--text-light); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -2px; transition: all var(--transition); white-space: nowrap; }
.tab:hover { color: var(--primary); }
.tab.active { color: var(--primary); border-bottom-color: var(--primary); }
.tab .count { background: var(--border-light); padding: 1px 6px; border-radius: 8px; font-size: 11px; margin-left: 6px; }
.tab.active .count { background: var(--primary-light); }

.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 1000; display: none; align-items: center; justify-content: center; padding: 20px; }
.modal-overlay.open { display: flex; }
.modal { background: var(--card-bg); border-radius: var(--radius); box-shadow: var(--shadow-lg); width: 100%; max-width: 560px; max-height: 90vh; display: flex; flex-direction: column; }
.modal-header { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px; border-bottom: 1px solid var(--border-light); }
.modal-header h3 { font-size: 16px; font-weight: 700; }
.modal-close { background: none; border: none; font-size: 20px; cursor: pointer; color: var(--text-light); padding: 0 4px; line-height: 1; }
.modal-close:hover { color: var(--text); }
.modal-body { padding: 20px; overflow-y: auto; flex: 1; }
.modal-footer { display: flex; justify-content: flex-end; gap: 8px; padding: 12px 20px; border-top: 1px solid var(--border-light); flex-shrink: 0; }

.toast-container { position: fixed; top: 16px; right: 16px; z-index: 2000; display: flex; flex-direction: column; gap: 8px; }
.toast { padding: 12px 16px; border-radius: var(--radius-sm); font-size: 13px; font-weight: 500; color: #fff; display: flex; align-items: center; gap: 10px; box-shadow: var(--shadow-lg); animation: slideIn 0.3s ease; min-width: 280px; max-width: 420px; }
.toast.success { background: var(--success); }
.toast.error { background: var(--danger); }
.toast.warning { background: var(--secondary); }
.toast.info { background: var(--primary); }
.toast .toast-close { margin-left: auto; background: none; border: none; color: #fff; font-size: 16px; cursor: pointer; opacity: 0.8; padding: 0 2px; }
.toast .toast-close:hover { opacity: 1; }
@keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
@keyframes slideOut { from { transform: translateX(0); opacity: 1; } to { transform: translateX(100%); opacity: 0; } }

.spinner { display: inline-block; width: 20px; height: 20px; border: 3px solid var(--border); border-top-color: var(--primary); border-radius: 50%; animation: spin 0.7s linear infinite; }
.spinner.lg { width: 36px; height: 36px; border-width: 4px; }
@keyframes spin { to { transform: rotate(360deg); } }

.loading-center { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 60px 20px; color: var(--text-light); gap: 12px; font-size: 13px; }

.empty-state { text-align: center; padding: 48px 20px; color: var(--text-light); }
.empty-state .icon { font-size: 40px; margin-bottom: 12px; }
.empty-state h3 { font-size: 16px; color: var(--text); margin-bottom: 6px; }
.empty-state p { font-size: 13px; margin-bottom: 16px; }

.pagination { display: flex; align-items: center; justify-content: center; gap: 4px; margin-top: 16px; }
.pagination button { padding: 6px 12px; border: 1px solid var(--border); background: var(--card-bg); border-radius: var(--radius-sm); font-size: 12px; cursor: pointer; }
.pagination button:hover:not(:disabled) { background: var(--bg); }
.pagination button.active { background: var(--primary); color: #fff; border-color: var(--primary); }
.pagination button:disabled { opacity: 0.4; cursor: default; }

/* Phase Stepper */
.phase-stepper { display: flex; align-items: center; gap: 0; margin-bottom: 24px; flex-wrap: wrap; }
.phase-step { display: flex; align-items: center; gap: 8px; transition: transform 0.3s ease; }
.phase-circle { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; border: 2px solid var(--border); color: var(--text-light); background: var(--card-bg); flex-shrink: 0; transition: all 0.4s ease; }
.phase-circle.active { border-color: var(--primary); background: var(--primary); color: #fff; animation: phase-pulse 2.5s ease-in-out infinite; }
.phase-circle.completed { border-color: var(--success); background: var(--success); color: #fff; }
.phase-step.just-completed { animation: phase-pop 0.6s ease; }
.phase-step.just-completed .phase-circle { animation: phase-pop 0.6s ease; }
@keyframes phase-pulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(61, 90, 153, 0.35); } 50% { box-shadow: 0 0 0 8px rgba(61, 90, 153, 0); } }
@keyframes phase-pop { 0% { transform: scale(1); } 30% { transform: scale(1.2); } 60% { transform: scale(0.95); } 100% { transform: scale(1); } }
.phase-label { font-size: 12px; font-weight: 600; color: var(--text-light); white-space: nowrap; }
.phase-label.active { color: var(--primary); }
.phase-label.completed { color: var(--success); }
.phase-connector { width: 32px; height: 2px; background: var(--border); margin: 0 4px; flex-shrink: 0; transition: background 0.6s ease; }
.phase-connector.completed { background: var(--success); }

/* Checklist items */
.checklist-group { margin-bottom: 20px; }
.checklist-group-header { display: flex; align-items: center; gap: 8px; padding: 8px 0; font-weight: 600; font-size: 14px; border-bottom: 1px solid var(--border-light); margin-bottom: 8px; cursor: pointer; }
.checklist-group-header:hover { color: var(--primary); }
.checklist-group-header .toggle { transition: transform 0.2s; }
.checklist-group-header.collapsed .toggle { transform: rotate(-90deg); }
.checklist-item { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-radius: var(--radius-sm); transition: background var(--transition); }
.checklist-item:hover { background: var(--bg); }
.checklist-item.subtask { padding-left: 36px; }
.checklist-item.blocked { opacity: 0.5; }
.highlight-flash { animation: highlightPulse 2s ease; }
@keyframes highlightPulse { 0%,100%{background:transparent} 20%,60%{background:var(--warning-light, #fff8e1)} }
.checklist-item input[type="checkbox"] { width: 20px; height: 20px; accent-color: var(--primary); cursor: pointer; flex-shrink: 0; }
.checklist-item .task-title { flex: 1; font-size: 13px; }
.checklist-item .task-title.completed { text-decoration: line-through; color: var(--text-light); }
.checklist-item .task-meta { font-size: 13px; color: var(--text-light); white-space: nowrap; }

/* Progress ring */
.progress-ring-wrap { position: relative; display: inline-flex; align-items: center; justify-content: center; }
.progress-ring-text { position: absolute; font-size: 18px; font-weight: 700; color: var(--text); }

/* Employee detail header */
.emp-header { display: flex; gap: 20px; align-items: flex-start; }
.emp-header .emp-avatar { width: 64px; height: 64px; border-radius: 50%; background: var(--primary); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: 700; flex-shrink: 0; }
.emp-header .emp-info { flex: 1; }
.emp-header .emp-info h1 { font-size: 20px; margin-bottom: 4px; }
.emp-header .emp-meta { display: flex; gap: 16px; flex-wrap: wrap; font-size: 13px; color: var(--text-light); margin-top: 4px; }
.emp-header .emp-meta span { display: flex; align-items: center; gap: 4px; }

.cat-icon { font-size: 14px; }
.confirm-dialog { text-align: center; padding: 12px 0; }
.confirm-dialog p { margin-bottom: 20px; font-size: 14px; }

.action-bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; flex-wrap: wrap; gap: 12px; }

/* Welcome card */
.welcome-card { background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%); color: #fff; border-radius: var(--radius); padding: 32px; margin-bottom: 24px; }
.welcome-card h1 { color: #fff; font-size: 24px; margin-bottom: 6px; }
.welcome-card p { opacity: 0.9; font-size: 14px; }

/* Contact items */
.contact-item { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--border-light); }
.contact-item:last-child { border-bottom: none; }
.contact-item .contact-avatar { width: 36px; height: 36px; border-radius: 50%; background: var(--primary-light); color: var(--primary); display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600; flex-shrink: 0; }
.contact-item .contact-info { flex: 1; }
.contact-item .contact-info .contact-name { font-weight: 600; font-size: 13px; }
.contact-item .contact-info .contact-role { font-size: 11px; color: var(--text-light); }

/* Bar charts */
.bar-chart { display: flex; align-items: flex-end; gap: 12px; height: 160px; padding: 0 8px; border-bottom: 1px solid var(--border); margin-bottom: 8px; }
.bar-chart .bar-group { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; height: 100%; justify-content: flex-end; }
.bar-chart .bar { width: 28px; border-radius: 3px 3px 0 0; min-height: 2px; transition: height 0.5s ease; }
.bar-chart .bar.hires { background: var(--primary); }
.bar-chart .bar.departures { background: var(--secondary); }
.bar-chart .bar-label { font-size: 10px; color: var(--text-light); margin-top: 6px; }
.bar-chart .bar-value { font-size: 10px; font-weight: 600; }
.bar-chart .bar-pair { display: flex; gap: 4px; align-items: flex-end; }
.chart-legend { display: flex; gap: 20px; justify-content: center; font-size: 12px; color: var(--text-light); margin-top: 8px; }
.chart-legend span::before { content: ''; display: inline-block; width: 12px; height: 12px; border-radius: 2px; margin-right: 4px; vertical-align: middle; }
.chart-legend .leg-hires::before { background: var(--primary); }
.chart-legend .leg-departures::before { background: var(--secondary); }

/* Horizontal bar chart */
.h-bar-chart { margin: 12px 0; }
.h-bar-row { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
.h-bar-label { width: 120px; font-size: 12px; text-align: right; flex-shrink: 0; }
.h-bar-track { flex: 1; height: 20px; background: var(--border-light); border-radius: 3px; overflow: hidden; }
.h-bar-fill { height: 100%; border-radius: 3px; transition: width 0.5s ease; display: flex; align-items: center; justify-content: flex-end; padding-right: 6px; font-size: 10px; font-weight: 700; color: #fff; }

/* Integration cards */
.integration-card { display: flex; align-items: center; gap: 16px; padding: 16px; border: 1px solid var(--border-light); border-radius: var(--radius); margin-bottom: 12px; }
.integration-card .int-icon { font-size: 28px; }
.integration-card .int-info { flex: 1; }
.integration-card .int-info h4 { font-size: 14px; margin-bottom: 2px; }
.integration-card .int-info .int-status { font-size: 12px; }
.int-status.connected { color: var(--success); }
.int-status.disconnected { color: var(--danger); }

/* Star rating */
.star-rating { display: inline-flex; gap: 4px; cursor: pointer; }
.star-rating .star { font-size: 28px; padding: 4px; color: var(--border); transition: color 0.15s; cursor: pointer; user-select: none; }
.star-rating .star.filled { color: var(--secondary); }
.star-rating .star:hover { color: var(--secondary); }

/* Meet & greet card */
.meet-card { background: var(--card-bg); border: 1px solid var(--border-light); border-radius: var(--radius); padding: 16px; display: flex; gap: 12px; align-items: flex-start; }
.meet-card.met { opacity: 0.7; }
.meet-card .meet-avatar { width: 40px; height: 40px; border-radius: 50%; background: var(--primary-light); color: var(--primary); display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 14px; flex-shrink: 0; }
.meet-card .meet-info { flex: 1; }
.meet-card .meet-info h4 { font-size: 14px; margin-bottom: 2px; }
.meet-card .meet-info .meet-role { font-size: 12px; color: var(--text-light); }
.meet-card .meet-info .meet-reason { font-size: 12px; color: var(--text); margin-top: 6px; font-style: italic; }

/* Milestone cards */
.milestone-card { background: var(--card-bg); border: 2px solid var(--border-light); border-radius: var(--radius); padding: 24px; text-align: center; }
.milestone-card.current { border-color: var(--primary); box-shadow: 0 0 0 4px rgba(0,68,124,0.1); }
.milestone-card.achieved { border-color: var(--success); background: var(--success-light); }
.milestone-day { font-size: 36px; font-weight: 800; color: var(--primary); }
.milestone-card.achieved .milestone-day { color: var(--success); }
.milestone-title { font-size: 15px; font-weight: 600; margin: 8px 0; }
.milestone-expectations { font-size: 13px; color: var(--text-light); text-align: left; margin: 12px 0; }
.milestone-expectations li { margin-bottom: 4px; }

/* Readiness dot */
.dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; }
.dot.green { background: var(--success); }
.dot.red { background: var(--danger); }
.dot.yellow { background: var(--warning); }

/* Week view */
.week-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; margin-bottom: 24px; }
.week-day { background: var(--card-bg); border: 1px solid var(--border-light); border-radius: var(--radius); min-height: 120px; }
.week-day-header { padding: 8px 12px; font-size: 12px; font-weight: 700; text-transform: uppercase; color: var(--text-light); border-bottom: 1px solid var(--border-light); background: var(--bg); border-radius: var(--radius) var(--radius) 0 0; }
.week-day-header.today { background: var(--primary-light); color: var(--primary); }
.week-day-body { padding: 8px; }
.week-task { padding: 6px 8px; margin-bottom: 4px; border-radius: var(--radius-sm); font-size: 12px; background: var(--bg); border-left: 3px solid var(--border); }
.week-task.ack { border-left-color: var(--success); }
.week-task.overdue { border-left-color: var(--danger); background: var(--danger-light); }
.week-task.done { opacity: 0.5; text-decoration: line-through; }

/* Task action buttons */
.task-actions { display: inline-flex; gap: 2px; margin-left: 4px; opacity: 0.6; transition: opacity 0.15s; }
.checklist-item:hover .task-actions { opacity: 1; }
@media (max-width: 768px) { .task-actions { opacity: 1; } }
.task-action-btn { background: none; border: none; cursor: pointer; font-size: 13px; padding: 6px 8px; border-radius: 3px; line-height: 1; }
.task-action-btn:hover { background: var(--bg); }
.task-action-btn.delete { color: var(--danger); }
.task-action-btn.delete:hover { background: var(--danger-light); }
.task-action-btn.duplicate { color: var(--text-light); }
.task-action-btn.duplicate:hover { background: var(--border-light); }
.btn-outline-primary { background: transparent; color: var(--primary); border: 1px solid var(--primary); }
.btn-outline-primary:hover:not(:disabled) { background: var(--primary-light); }

/* Audit entry */
.audit-entry { padding: 10px 0; border-bottom: 1px solid var(--border-light); font-size: 13px; }
.audit-entry .audit-time { font-size: 11px; color: var(--text-light); }
.audit-entry .audit-user { font-weight: 600; }

/* Collapsible */
.collapsible-content { overflow: hidden; transition: max-height 0.3s ease; }
.collapsible-content.collapsed { max-height: 0 !important; }

/* Equipment status */
.equip-status { font-size: 11px; padding: 2px 6px; border-radius: 3px; }
.equip-status.pending { background: var(--warning-light); color: #856404; }
.equip-status.ordered { background: var(--primary-light); color: var(--primary); }
.equip-status.shipped { background: #e0f2fe; color: #0369a1; }
.equip-status.delivered { background: var(--success-light); color: var(--success); }
.equip-status.issued { background: var(--success); color: #fff; }
.equip-status.returned { background: var(--border-light); color: var(--text-light); }

/* Checkbox group for equipment */
.checkbox-group { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.checkbox-item { display: flex; align-items: center; gap: 8px; font-size: 13px; padding: 4px 0; }
.checkbox-item input[type="checkbox"] { width: 20px; height: 20px; accent-color: var(--primary); }

/* Radio group */
.radio-group { display: flex; gap: 16px; }
.radio-item { display: flex; align-items: center; gap: 6px; font-size: 13px; }
.radio-item input[type="radio"] { accent-color: var(--primary); }

/* Metrics strip */
.metrics-strip { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-top: 24px; }
.metric-item { text-align: center; padding: 16px; background: var(--bg); border-radius: var(--radius); }
.metric-value { font-size: 24px; font-weight: 700; color: var(--primary); }
.metric-label { font-size: 11px; color: var(--text-light); margin-top: 2px; }

/* SVG NPS dots */
.nps-chart { width: 100%; height: 120px; }

/* Keyboard focus styles */
*:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; border-radius: 2px; }
button:focus-visible, .btn:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; box-shadow: 0 0 0 4px rgba(0,68,124,0.15); }
input:focus-visible, select:focus-visible, textarea:focus-visible { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(0,68,124,0.12); }
.tab:focus-visible { outline: 2px solid var(--primary); outline-offset: -2px; }
.nav-item:focus-visible { outline: 2px solid #fff; outline-offset: -2px; }

/* Task comment thread */
.comment-thread { margin-top: 8px; padding: 8px 12px; background: var(--bg); border-radius: var(--radius-sm); border-left: 3px solid var(--primary-light); }
.comment-bubble { padding: 6px 0; border-bottom: 1px solid var(--border-light); font-size: 12px; }
.comment-bubble:last-child { border-bottom: none; }
.comment-bubble .comment-author { font-weight: 600; color: var(--primary); }
.comment-bubble .comment-time { font-size: 10px; color: var(--text-muted); margin-left: 8px; }
.comment-bubble.blocker { border-left: 3px solid var(--danger); padding-left: 8px; background: var(--danger-light); border-radius: var(--radius-sm); margin: 4px 0; }

/* Learning path */
.learning-path { display: flex; flex-direction: column; gap: 0; }
.learning-node { display: flex; align-items: flex-start; gap: 16px; }
.learning-connector { width: 32px; display: flex; flex-direction: column; align-items: center; flex-shrink: 0; }
.learning-dot { width: 20px; height: 20px; border-radius: 50%; border: 3px solid var(--border); background: var(--card-bg); display: flex; align-items: center; justify-content: center; font-size: 10px; z-index: 1; }
.learning-dot.done { background: var(--success); border-color: var(--success); color: #fff; }
.learning-dot.current { background: var(--primary); border-color: var(--primary); color: #fff; animation: pulse-dot 2s infinite; }
.learning-line { width: 2px; flex: 1; background: var(--border); min-height: 24px; }
.learning-node:last-child .learning-line { display: none; }
.learning-card { flex: 1; background: var(--card-bg); border: 1px solid var(--border-light); border-radius: var(--radius); padding: 12px 16px; margin-bottom: 8px; }
.learning-card.current { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(0,68,124,0.08); }
.learning-card h4 { font-size: 13px; margin-bottom: 4px; }
.learning-card .learning-meta { font-size: 11px; color: var(--text-light); }
@keyframes pulse-dot { 0%,100% { box-shadow: 0 0 0 0 rgba(0,68,124,0.3); } 50% { box-shadow: 0 0 0 6px rgba(0,68,124,0); } }

/* Bulk import */
.import-preview { max-height: 300px; overflow: auto; font-size: 12px; }
.import-preview table { width: 100%; }
.import-preview th { background: var(--bg); position: sticky; top: 0; }
.import-row-error { background: var(--danger-light); }

/* Screen-reader-only utility */
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }

/* Phase completion celebration */
.confetti-container { position: fixed; inset: 0; pointer-events: none; z-index: 9999; overflow: hidden; }
.confetti-piece { position: absolute; width: 8px; height: 8px; top: -10px; opacity: 0; animation: confetti-fall 3s ease-in forwards; }
@keyframes confetti-fall {
    0% { transform: translateY(0) rotate(0deg) scale(1); opacity: 1; }
    80% { opacity: 0.8; }
    100% { transform: translateY(100vh) rotate(720deg) scale(0.4); opacity: 0; }
}
.phase-completion-banner { animation: banner-in 0.5s ease both; }
@keyframes banner-in { 0% { transform: translateY(-20px); opacity: 0; } 100% { transform: translateY(0); opacity: 1; } }

/* Reduced motion */
@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;

}

[data-tooltip] {

[data-tooltip]::after {
    content: attr(data-tooltip);
    position: absolute;
    bottom: calc(100% + 6px);
    left: 50%;
    transform: translateX(-50%);

    color: var(--card-bg);

<script>
/* =============================================================
   SUBPATH PREFIX — works behind IIS reverse proxy at /onboard
   and also at bare / in local dev.
   ============================================================= */
const BASE_PATH = (() => {
    // In production the browser URL is /onboard; in dev it's /
    const p = window.location.pathname.replace(/\/+$/, '');
    return p || '';
})();
// Fix static HTML links that can't use JS variables
document.getElementById('manifest-link')?.setAttribute('href', BASE_PATH + '/manifest.json');
document.getElementById('icon-link')?.setAttribute('href', BASE_PATH + '/assets/icon.svg');
document.getElementById('logout-link')?.setAttribute('href', BASE_PATH + '/logout');

/* =============================================================
   STATE & CONFIG
   ============================================================= */
const state = {
    user: null,
    currentView: 'dashboard',
    selectedEmployee: null,
    employees: [],
    tasks: [],
    dashboardData: null,
    pagination: { page: 1, perPage: 20, total: 0 },
    taskFilter: 'all',
    impersonating: null,
    empTab: 'overview',
    adminTab: 'users',
    onboardCounts: { onboarding: 0, offboarding: 0 },
};

const DEPARTMENTS = ['Engineering', 'Sales', 'Marketing', 'HR', 'Finance', 'Operations', 'Product', 'Legal', 'IT', 'Customer Success', 'Consulting', 'Accounting'];
const CATEGORY_ICONS = { it: '💻', hr: '📋', manager: '👔', facilities: '🏢', employee: '👤', training: '📚', voice: '📞', sales: '💼' };
const CATEGORY_LABELS = { it: 'IT', hr: 'HR', manager: 'Manager', facilities: 'Facilities', employee: 'Employee', training: 'Training', voice: 'Voice', sales: 'Sales' };
const PHASE_LABELS = { pre_boarding: 'Pre-Boarding', company_onboarding: 'Company', department_onboarding: 'Department', role_training: 'Role Training' };
const PHASE_ORDER = ['pre_boarding', 'company_onboarding', 'department_onboarding', 'role_training'];
const STATUS_BADGES = {
    pending: 'badge-warning', active: 'badge-success', onboarding: 'badge-primary',
    offboarding: 'badge-info', departed: 'badge-secondary', completed: 'badge-success',
    in_progress: 'badge-primary', skipped: 'badge-secondary', blocked: 'badge-secondary',
    achieved: 'badge-success', missed: 'badge-danger',
};
const EQUIP_TYPES = ['laptop','desktop','mac','phone','monitors','headphones','camera','desk','chair','stationery'];

/* Phase descriptions for contextual help */
const PHASE_DESCRIPTIONS = {
    pre_boarding: 'Before Day 1 — paperwork, IT setup, welcome kit, and access provisioning.',
    company_onboarding: 'Days 1–5 — company orientation, policies, culture, and initial introductions.',
    department_onboarding: 'Days 6–28 — team-specific processes, tools, and project onboarding.',
    role_training: 'Days 29–90 — role-specific skills, goals, and performance ramp-up.',
    completed: 'Fully ramped — onboarding complete, employee is at full productivity.'
};

/* Jargon terms and their plain-language definitions */
const JARGON_TOOLTIPS = {
    'pulse survey': 'A short, periodic check-in survey measuring employee sentiment and engagement.',
    'cohort': 'A group of employees who started onboarding at the same time.',
    'milestone': 'A key checkpoint at Day 30, 60, or 90 measuring expected progress.',
    'buddy program': 'A peer-pairing system where an experienced employee guides a new hire.',
    'buddy': 'An experienced teammate assigned to help a new hire settle in.',
    'meet & greet': 'Scheduled introductory meetings with key colleagues and stakeholders.',
    '30/60/90': 'A structured plan with goals at the 30-day, 60-day, and 90-day marks.',
    'ramp-up': 'The period during which a new hire builds toward full productivity.',
    'hire type': 'Whether the employee is new, a rehire, a transfer, or a contractor.'
};

/* =============================================================
   UTILITIES
   ============================================================= */
function esc(str) {
    if (str == null) return '';
    return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function formatSurveyType(t) {
    if (!t) return 'Survey';
    return t.replace(/_/g, ' ').replace(/\bday\s*(\d+)/i, 'Day $1').replace(/\b\w/g, function(c) { return c.toUpperCase(); });
}

function scrollToTask(title) {
    var items = document.querySelectorAll('.checklist-item .task-title, .task-title');
    for (var i = 0; i < items.length; i++) {
        if (items[i].textContent.trim().replace(/^🔒\s*/, '') === title) {
            items[i].closest('.checklist-item, tr, div')?.scrollIntoView({behavior:'smooth', block:'center'});
            items[i].closest('.checklist-item, tr, div')?.classList.add('highlight-flash');
            setTimeout(function() { items[i].closest('.checklist-item, tr, div')?.classList.remove('highlight-flash'); }, 2000);
            return;
        }
    }
}

function formatDate(d) {
    if (!d) return '—';
    const dt = new Date(d);
    if (isNaN(dt)) return esc(d);
    return dt.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
}

function relativeTime(d) {
    if (!d) return 'Never';
    const now = new Date(), dt = new Date(d);
    const diff = Math.floor((now - dt) / 1000);
    if (diff < 60) return 'just now';
    if (diff < 3600) return Math.floor(diff/60) + 'm ago';
    if (diff < 86400) return Math.floor(diff/3600) + 'h ago';
    if (diff < 604800) return Math.floor(diff/86400) + 'd ago';
    return formatDate(d);
}

function initials(name) {
    if (!name) return '?';
    return name.split(' ').map(w => w[0]).join('').toUpperCase().slice(0,2);
}

// ── Avatar helpers ───────────────────────────────────────────────
const _AVATAR_COLORS = [
    '#e74c3c','#d35400','#e67e22','#f39c12','#27ae60',
    '#16a085','#2980b9','#8e44ad','#c0392b','#2c3e50',
    '#1abc9c','#3498db','#9b59b6','#e84393','#00b894',
    '#6c5ce7','#d63031','#e17055','#0984e3','#a29bfe',
];
function avatarColor(name) {
    var hash = 0;
    for (var i = 0; i < (name||'').length; i++) hash = name.charCodeAt(i) + ((hash << 5) - hash);
    return _AVATAR_COLORS[Math.abs(hash) % _AVATAR_COLORS.length];
}
function avatar(name, size, extraStyle) {
    var sz = size || 32;
    var fs = Math.max(11, Math.round(sz * 0.38));
    var bg = avatarColor(name);
    return '<div style="width:'+sz+'px;height:'+sz+'px;border-radius:50%;background:'+bg+';color:#fff;display:flex;align-items:center;justify-content:center;font-size:'+fs+'px;font-weight:600;flex-shrink:0;'+(extraStyle||'')+'">'+esc(initials(name))+'</div>';
}

function statusBadge(status) {
    const cls = STATUS_BADGES[status] || 'badge-secondary';
    return `<span class="badge ${cls}">${esc(status)}</span>`;
}

function progressBar(pct, color) {
    const c = color || (pct >= 80 ? 'green' : pct >= 40 ? 'blue' : 'orange');
    return `<div class="progress-bar" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"><div class="fill ${c}" style="width:${pct}%"></div></div><div class="progress-label">${pct}% complete</div>`;
}

function progressRingSVG(pct, size) {
    size = size || 90;
    const r = (size-10)/2, c = 2*Math.PI*r, off = c - (pct/100)*c;
    const col = pct >= 80 ? 'var(--success)' : pct >= 40 ? 'var(--primary)' : 'var(--secondary)';
    return `<div class="progress-ring-wrap">
        <svg width="${size}" height="${size}" role="img" aria-label="${pct}% complete"><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--border-light)" stroke-width="8"/>
        <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${col}" stroke-width="8"
            stroke-dasharray="${c}" stroke-dashoffset="${off}" stroke-linecap="round"
            transform="rotate(-90 ${size/2} ${size/2})" style="transition:stroke-dashoffset 0.8s ease"/></svg>
        <span class="progress-ring-text">${pct}%</span></div>`;
}

function daysUntil(d) {
    if (!d) return null;
    const now = new Date(), dt = new Date(d);
    now.setHours(0,0,0,0); dt.setHours(0,0,0,0);
    return Math.ceil((dt - now) / 86400000);
}

function daysSince(d) {
    if (!d) return null;
    return -daysUntil(d);
}

function isRole(...roles) {
    return state.user && roles.includes(state.user.role);
}

function currentPhaseFromStart(startDate) {
    const days = daysSince(startDate);
    if (days === null) return 'pre_boarding';
    if (days < 0) return 'pre_boarding';
    if (days <= 5) return 'company_onboarding';
    if (days <= 28) return 'department_onboarding';
    if (days <= 90) return 'role_training';
    return 'completed';
}

function phaseBadge(phase) {
    const colors = { pre_boarding: 'badge-warning', company_onboarding: 'badge-primary', department_onboarding: 'badge-info', role_training: 'badge-purple', completed: 'badge-success' };
    return `<span class="badge ${colors[phase]||'badge-secondary'}">${esc(PHASE_LABELS[phase]||phase)}</span>`;
}

function phaseStepperHTML(currentPhase) {
    const phases = [
        { key: 'pre_boarding', label: 'Pre-Board', icon: '📋' },
        { key: 'company_onboarding', label: 'Company', icon: '🏢' },
        { key: 'department_onboarding', label: 'Department', icon: '👥' },
        { key: 'role_training', label: 'Role Training', icon: '🎯' },
        { key: 'completed', label: 'Ramped', icon: '✓' },
    ];
    const idx = phases.findIndex(p => p.key === currentPhase);
    let html = '<div class="phase-stepper" role="list" aria-label="Onboarding phases">';
    phases.forEach((p, i) => {
        const cls = i < idx ? 'completed' : i === idx ? 'active' : '';
        const circleContent = i < idx ? '✓' : (i+1);
        const stepStatus = i < idx ? 'completed' : i === idx ? 'current' : 'upcoming';
        const desc = PHASE_DESCRIPTIONS[p.key] || '';
        html += `<div class="phase-step" role="listitem" ${i === idx ? 'aria-current="step"' : ''} ${desc ? 'data-tooltip="' + esc(desc) + '"' : ''}>
            <div class="phase-circle ${cls}" aria-hidden="true">${circleContent}</div>
            <span class="phase-label ${cls}">${esc(p.label)}</span>
            <span class="sr-only">(${stepStatus})</span>
        </div>`;
        if (i < phases.length - 1) {
            html += `<div class="phase-connector ${i < idx ? 'completed' : ''}" aria-hidden="true"></div>`;
        }
    });
    html += '</div>';
    return html;
}

function starRatingHTML(name, value, readonly) {
    const v = value || 0;
    let html = `<div class="star-rating" data-name="${esc(name)}" data-value="${v}" role="radiogroup" aria-label="${esc(name)} rating">`;
    for (let i = 1; i <= 5; i++) {
        const checked = i <= v;
        const isFocusable = (v === 0 && i === 1) || i === v;
        if (readonly) {
            html += `<span class="star ${checked ? 'filled' : ''}" data-val="${i}" role="img" aria-label="${i} of 5 stars">★</span>`;
        } else {
            html += `<span class="star ${checked ? 'filled' : ''}" data-val="${i}" role="radio" aria-checked="${checked}" aria-label="${i} star${i>1?'s':''}" tabindex="${isFocusable ? '0' : '-1'}" onclick="setStarRating(this)" onkeydown="handleStarKeydown(event,this)">★</span>`;
        }
    }
    html += '</div>';
    return html;
}

function setStarRating(starEl) {
    const wrap = starEl.closest('.star-rating');
    const val = parseInt(starEl.dataset.val);
    wrap.dataset.value = val;
    wrap.querySelectorAll('.star').forEach(s => {
        const sv = parseInt(s.dataset.val);
        s.classList.toggle('filled', sv <= val);
        if (s.getAttribute('role') === 'radio') {
            s.setAttribute('aria-checked', sv <= val ? 'true' : 'false');
            s.tabIndex = sv === val ? 0 : -1;
        }
    });
}

function handleStarKeydown(e, starEl) {
    const wrap = starEl.closest('.star-rating');
    const stars = wrap.querySelectorAll('[role="radio"]');
    const cur = parseInt(starEl.dataset.val);
    let next = cur;
    if (e.key === 'ArrowRight' || e.key === 'ArrowUp') { e.preventDefault(); next = Math.min(5, cur + 1); }
    else if (e.key === 'ArrowLeft' || e.key === 'ArrowDown') { e.preventDefault(); next = Math.max(1, cur - 1); }
    else if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); setStarRating(starEl); return; }
    else return;
    const target = stars[next - 1];
    if (target) { setStarRating(target); target.focus(); }
}

function toggleCollapse(el) {
    const isCollapsed = el.classList.toggle('collapsed');
    el.nextElementSibling.classList.toggle('collapsed');
    el.setAttribute('aria-expanded', !isCollapsed);
}
function handleCollapseKeydown(e, el) {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggleCollapse(el); }
}
function handleTabKeydown(e) {
    if (!['ArrowLeft', 'ArrowRight', 'Home', 'End'].includes(e.key)) return;
    e.preventDefault();
    const tabs = [...e.target.parentElement.querySelectorAll('[role="tab"]')];
    const cur = tabs.indexOf(e.target);
    let next;
    if (e.key === 'ArrowRight') next = (cur + 1) % tabs.length;
    else if (e.key === 'ArrowLeft') next = (cur - 1 + tabs.length) % tabs.length;
    else if (e.key === 'Home') next = 0;
    else next = tabs.length - 1;
    tabs[next].focus();
    tabs[next].click();
}
function tabAttrs(isActive) {
    return `role="tab" aria-selected="${isActive}" tabindex="${isActive ? '0' : '-1'}" onkeydown="handleTabKeydown(event)"`;
}

function readinessDot(val) {
    if (typeof val === 'number') return `<span class="dot ${val >= 100 ? 'green' : val > 0 ? 'yellow' : 'red'}"></span> ${val}%`;
    return `<span class="dot ${val ? 'green' : 'red'}"></span>`;
}

/* =============================================================
   API HELPER
   ============================================================= */
async function api(endpoint, options = {}) {
    const impAs = state.impersonating;
    const sep = endpoint.includes('?') ? '&' : '?';
    const fullEndpoint = BASE_PATH + endpoint;
    const url = impAs ? fullEndpoint + sep + 'as=' + encodeURIComponent(impAs) : fullEndpoint;
    const opts = {
        ...options,
        headers: {
            'Content-Type': 'application/json',
            'X-Requested-With': 'XMLHttpRequest',
            ...(options.headers || {}),
        },
    };
    if (options.body && typeof options.body === 'object' && !(options.body instanceof FormData)) {
        opts.body = JSON.stringify(options.body);
    }
    let lastErr;
    for (let attempt = 0; attempt < 3; attempt++) {
        try {
            const res = await fetch(url, opts);
            if (res.status === 401) { window.location.href = BASE_PATH + '/login'; return; }
            if (res.status === 403) { showToast('Access denied', 'error'); return; }
            const ct = res.headers.get('content-type') || '';
            if (ct.includes('application/json')) {
                const data = await res.json();
                if (!res.ok) { showToast(data.error || 'Request failed', 'error'); return null; }
                return data;
            }
            if (ct.includes('application/vnd.openxmlformats') || ct.includes('application/octet-stream')) {
                const blob = await res.blob();
                const a = document.createElement('a');
                const cd = res.headers.get('content-disposition') || '';
                const match = cd.match(/filename="?([^";\n]+)"?/);
                a.download = match ? match[1] : 'document.docx';
                a.href = URL.createObjectURL(blob);
                document.body.appendChild(a); a.click(); a.remove();
                URL.revokeObjectURL(a.href);
                return { ok: true };
            }
            if (!res.ok) { showToast('Request failed (' + res.status + ')', 'error'); return null; }
            return await res.text();
        } catch (e) {
            lastErr = e;
            if (attempt < 2) await new Promise(r => setTimeout(r, 2000));
        }
    }
    showToast('Network error: ' + (lastErr?.message || 'Connection failed'), 'error');
    return null;
}

/* =============================================================
   TOAST & MODAL
   ============================================================= */
function showToast(message, type = 'success') {
    const container = document.getElementById('toast-container');
    const el = document.createElement('div');
    el.className = 'toast ' + type;
    const icons = { success: '✓', error: '✕', warning: '⚠', info: 'ℹ' };
    el.innerHTML = `<span>${icons[type]||''}</span><span>${esc(message)}</span><button class="toast-close" aria-label="Dismiss" onclick="this.parentElement.remove()">&times;</button>`;
    container.appendChild(el);
    setTimeout(() => { el.style.animation = 'slideOut 0.3s ease forwards'; setTimeout(() => el.remove(), 300); }, 8000);
}

/* ── Phase completion celebration ── */
function showCelebration(message) {
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
        showToast(message || '🎉 Phase complete!', 'success');
        return;
    }
    const container = document.createElement('div');
    container.className = 'confetti-container';
    document.body.appendChild(container);
    const colors = ['#3D5A99', '#E8A84C', '#5CB89F', '#A78BDF', '#E86B5E', '#FFD700', '#00B4D8'];
    for (let i = 0; i < 60; i++) {
        const piece = document.createElement('div');
        piece.className = 'confetti-piece';
        const c = colors[Math.floor(Math.random() * colors.length)];
        piece.style.left = Math.random() * 100 + '%';
        piece.style.background = c;
        piece.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
        piece.style.width = (4 + Math.random() * 8) + 'px';
        piece.style.height = (4 + Math.random() * 8) + 'px';
        piece.style.animationDelay = (Math.random() * 0.8) + 's';
        piece.style.animationDuration = (2 + Math.random() * 2) + 's';
        container.appendChild(piece);
    }
    showToast(message || '🎉 Phase complete! Great progress!', 'success');
    setTimeout(() => container.remove(), 4500);
}

async function checkPhaseCompletion(tasks, employeeId) {
    if (!tasks || !tasks.length) return;
    const phases = {};
    tasks.forEach(t => {
        const p = t.phase || 'general';
        if (!phases[p]) phases[p] = { total: 0, done: 0 };
        phases[p].total++;
        if (t.status === 'completed' || t.status === 'skipped') phases[p].done++;
    });
    const PHASE_NICE = { pre_boarding: 'Pre-Boarding', company_onboarding: 'Company Onboarding', department_onboarding: 'Department Onboarding', role_training: 'Role Training' };
    for (const [phase, counts] of Object.entries(phases)) {
        if (counts.total > 0 && counts.done === counts.total) {
            const key = 'phase_done_' + (employeeId || 'me') + '_' + phase;
            if (!sessionStorage.getItem(key)) {
                sessionStorage.setItem(key, '1');
                const label = PHASE_NICE[phase] || phase.replace(/_/g, ' ');
                showCelebration('🎉 ' + label + ' phase complete!');
                return; // one celebration at a time
            }
        }
    }
}

function showModal(title, contentHtml, options = {}) {
    const overlay = document.getElementById('modal-overlay');
    const modal = document.getElementById('modal-container');
    // Store opener for focus return
    overlay._previousFocus = document.activeElement;
    document.getElementById('modal-title').textContent = title;
    document.getElementById('modal-body').innerHTML = contentHtml;
    const footer = document.getElementById('modal-footer');
    if (options.footer) { footer.innerHTML = options.footer; footer.style.display = ''; }
    else { footer.style.display = 'none'; }
    modal.style.maxWidth = options.width || (options.wide ? '800px' : '560px');
    overlay.setAttribute('aria-label', title);
    overlay.classList.add('open');
    // Focus trap
    if (overlay._trapHandler) document.removeEventListener('keydown', overlay._trapHandler);
    overlay._trapHandler = function(e) {
        if (e.key === 'Escape') { e.preventDefault(); closeModal(); return; }
        if (e.key !== 'Tab') return;
        const focusable = modal.querySelectorAll('button, [href], input:not([type="hidden"]), select, textarea, [tabindex]:not([tabindex="-1"])');
        if (!focusable.length) return;
        const first = focusable[0], last = focusable[focusable.length - 1];
        if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
        else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    };
    document.addEventListener('keydown', overlay._trapHandler);
    // Move focus into modal
    setTimeout(() => {
        const focusable = modal.querySelectorAll('button, [href], input:not([type="hidden"]), select, textarea, [tabindex]:not([tabindex="-1"])');
        if (focusable.length) focusable[0].focus();
        // Auto-save: listen for input changes in modal forms
        const modalBody = document.getElementById('modal-body');
        modalBody.querySelectorAll('input, textarea, select').forEach(el => {
            el.addEventListener('input', () => saveFormDraft('modal_' + document.getElementById('modal-title').textContent));
        });
        restoreFormDraft('modal_' + document.getElementById('modal-title').textContent);
    }, 100);
}

function closeModal() {
    const overlay = document.getElementById('modal-overlay');
    // Clear saved draft for this modal
    try {
        const title = document.getElementById('modal-title')?.textContent;
        if (title) localStorage.removeItem('celito_draft_modal_' + title);
    } catch(e) {}
    // Remove focus trap
    if (overlay._trapHandler) {
        document.removeEventListener('keydown', overlay._trapHandler);
        overlay._trapHandler = null;
    }
    overlay.classList.remove('open');
    // Reset any per-modal size overrides
    var mc = document.getElementById('modal-container');
    mc.style.maxHeight = '';
    mc.style.height = '';
    document.getElementById('modal-body').style.height = '';
    // Return focus to opener
    if (overlay._previousFocus && overlay._previousFocus.focus) {
        try { overlay._previousFocus.focus(); } catch(e) {}
        overlay._previousFocus = null;
    }
}

function saveFormDraft(key) {
    try {
        const modalBody = document.getElementById('modal-body');
        const data = {};
        modalBody.querySelectorAll('input, textarea, select').forEach((el, i) => {
            const id = el.id || el.name || ('field_' + i);
            if (el.type === 'checkbox') data[id] = el.checked;
            else data[id] = el.value;
        });
        localStorage.setItem('celito_draft_' + key, JSON.stringify(data));
    } catch(e) {}
}

function restoreFormDraft(key) {
    try {
        const raw = localStorage.getItem('celito_draft_' + key);
        if (!raw) return;
        const data = JSON.parse(raw);
        const modalBody = document.getElementById('modal-body');
        modalBody.querySelectorAll('input, textarea, select').forEach((el, i) => {
            const id = el.id || el.name || ('field_' + i);
            if (id in data) {
                if (el.type === 'checkbox') el.checked = data[id];
                else el.value = data[id];
            }
        });
    } catch(e) {}
}

function confirmDialog(message, onConfirm) {
    showModal('Confirm', `<div class="confirm-dialog"><p>${esc(message)}</p></div>`,
        { footer: `<button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
                    <button class="btn btn-danger" id="confirm-btn">Confirm</button>` });
    document.getElementById('confirm-btn').onclick = () => { closeModal(); onConfirm(); };
}

/* =============================================================
   THEME TOGGLE
   ============================================================= */
function toggleTheme() {
    const html = document.documentElement;
    const current = html.getAttribute('data-theme');
    const next = current === 'dark' ? 'light' : 'dark';
    html.setAttribute('data-theme', next);
    localStorage.setItem('celito_theme', next);
    updateThemeToggle();
}

function updateThemeToggle() {
    const el = document.getElementById('theme-toggle');
    if (!el) return;
    const isDark = document.documentElement.getAttribute('data-theme') === 'dark' ||
        (!document.documentElement.getAttribute('data-theme') && window.matchMedia('(prefers-color-scheme: dark)').matches);
    el.textContent = isDark ? '☀️ Light Mode' : '🌙 Dark Mode';
}

function navItem(view, icon, label, badgeCount) {
    const active = state.currentView === view;
    const bHtml = badgeCount ? `<span class="badge-count">${badgeCount}</span>` : '';
    return `<a class="nav-item ${active ? 'active' : ''}" href="#${view}" ${active ? 'aria-current="page"' : ''} onclick="navigate('${view}');toggleSidebar();return false;">
        <span class="icon">${icon}</span>${esc(label)}${bHtml}</a>`;
}

/* =============================================================
   ROUTER
   ============================================================= */
function navigate(view, data) {
    state.currentView = view;
    if (data !== undefined) state.selectedEmployee = data;
    const hash = '#' + view + (data !== undefined && typeof data === 'number' ? '/' + data : '');
    if (window.location.hash !== hash) {
        history.pushState({ view, data }, '', hash);
    }
    buildNavigation();
    render();
    // Scroll to top on navigation
    document.getElementById('main-content')?.scrollTo(0, 0);
}

function render() {
    const main = document.getElementById('main-content');
    const view = state.currentView;
    switch (view) {
        case 'dashboard': renderDashboard(main); break;
        case 'employees': renderEmployees(main); break;
        case 'employee-detail': renderEmployeeDetail(main); break;
        case 'onboarding': renderOnboarding(main); break;
        case 'offboarding': renderOffboarding(main); break;
        case 'tasks': renderTasks(main); break;
        case 'templates': renderTemplates(main); break;
        case 'cohorts': renderCohorts(main); break;
        case 'reports': renderReports(main); break;
        case 'executive': renderExecutiveDashboard(main); break;
        case 'admin': renderAdmin(main); break;
        case 'api-docs': renderApiDocs(main); break;
        case 'my-team': renderMyTeam(main); break;
        case 'buddy-assignments': renderBuddyAssignments(main); break;
        case 'manager-reports': renderManagerReports(main); break;
        case 'team-onboarding': renderTeamOnboarding(main); break;
        case 'my-onboarding': renderMyOnboarding(main); break;
        case 'this-week': renderMyOnboarding(main); break;
        case 'my-tasks': renderMyTasks(main); break;
        case 'my-milestones': renderMyMilestones(main); break;
        case 'my-buddy': renderMyBuddy(main); break;
        case 'my-meet-greets': renderMyMeetGreets(main); break;
        case 'my-documents': renderMyDocuments(main); break;
        case 'my-contacts': renderMyContacts(main); break;
        case 'my-surveys': renderMySurveys(main); break;
        case 'navigation-guide': renderNavigationGuide(main); break;
        case 'profile': renderProfile(main); break;
        default: renderDashboard(main);
    }
}

                ${avatar(name, 42)}
                <div style="flex:1;min-width:160px">
                    <div style="font-weight:600;font-size:14px">${esc(name)}</div>
                    <div style="font-size:12px;color:var(--text-light)">${esc(m.role_title||'')} · ${esc(m.department||'')}</div>
                </div>
                ${statusLabel}
                ${phaseBadge(phase)}
                ${dayLabel}
                <div style="width:120px">${progressBar(m.progress||0)}</div>
                <div style="font-size:11px;color:var(--text-light);min-width:70px;text-align:right">${m.completed_tasks||0}/${m.total_tasks||0} tasks</div>
            </div>`;
        }).join('');
    }

    // My tasks — sort by urgency: overdue first, then by due date
    myTasks.sort((a, b) => {
        const aOverdue = a.due_date && daysUntil(a.due_date) < 0 ? 0 : 1;
        const bOverdue = b.due_date && daysUntil(b.due_date) < 0 ? 0 : 1;
        if (aOverdue !== bOverdue) return aOverdue - bOverdue;
        if (a.due_date && b.due_date) return a.due_date.localeCompare(b.due_date);
        if (a.due_date) return -1;
        return 1;
    });

    const mtEl = document.getElementById('mgr-my-tasks');
    if (!myTasks.length) {
        mtEl.innerHTML = '<div class="empty-state"><p>No pending tasks — you\'re all caught up! ✅</p></div>';
    } else {
        mtEl.innerHTML = `<div style="max-height:400px;overflow-y:auto">${myTasks.map(t => {
            const isOverdue = t.due_date && daysUntil(t.due_date) !== null && daysUntil(t.due_date) < 0;
            const dueText = t.due_date ? formatDate(t.due_date) : 'No due date';
            const overdueBadge = isOverdue ? `<span class="badge badge-danger">${Math.abs(daysUntil(t.due_date))}d late</span>` : '';
            return `<div style="padding:10px 14px;border-bottom:1px solid var(--border-light);display:flex;align-items:center;gap:10px;${isOverdue?'background:var(--danger-light)':''}">
                <input type="checkbox" onchange="quickCompleteTask(${t.id}, this.checked)" style="cursor:pointer" title="Mark complete">
                <div style="flex:1;min-width:0">
                    <div style="font-weight:500;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(t.title)}</div>
                    <div style="font-size:11px;color:var(--text-light)">${esc(t.employee_name||'')} · ${dueText}</div>
                </div>
                ${overdueBadge}
                ${phaseBadge(t.phase||'company_onboarding')}
            </div>`;
        }).join('')}</div>`;
    }

    // Upcoming milestones
    const msEl = document.getElementById('mgr-milestones');
    if (!milestones.length) {
        msEl.innerHTML = '<div class="empty-state"><p>No upcoming milestones in the next 14 days</p></div>';
    } else {
        msEl.innerHTML = `<div style="max-height:400px;overflow-y:auto">${milestones.map(m => {
            const du = daysUntil(m.target_date);
            const urgency = du !== null && du <= 3 ? 'badge-warning' : 'badge-secondary';
            return `<div style="padding:10px 14px;border-bottom:1px solid var(--border-light);cursor:pointer;display:flex;align-items:center;gap:10px" onclick="navigate('employee-detail',${m.employee_id})">
                <span style="font-size:1.25rem">🎯</span>
                <div style="flex:1;min-width:0">
                    <div style="font-weight:500;font-size:13px">${esc(m.title)}</div>
                    <div style="font-size:11px;color:var(--text-light)">${esc(m.employee_name||'')} · Day ${m.day_marker||''}</div>
                </div>
                <span class="badge ${urgency}">${du !== null ? (du === 0 ? 'Today' : du > 0 ? du + 'd away' : Math.abs(du) + 'd past') : formatDate(m.target_date)}</span>
            </div>`;
        }).join('')}</div>`;
    }

    // Overdue tasks — grouped by employee
    if (overdue.length > 0) {
        const ovEl = document.getElementById('mgr-overdue');
        const byEmployee = {};
        overdue.forEach(t => {
            const name = t.employee_name || 'Unknown';
            if (!byEmployee[name]) byEmployee[name] = [];
            byEmployee[name].push(t);
        });
        let ovHtml = '';
        Object.keys(byEmployee).sort().forEach(empName => {
            const tasks = byEmployee[empName];
            ovHtml += `<div style="margin-bottom:12px;border:1px solid var(--danger-light);border-radius:var(--radius);overflow:hidden">
                <div style="padding:10px 14px;background:var(--danger-light);display:flex;align-items:center;gap:8px;cursor:pointer" onclick="this.nextElementSibling.style.display=this.nextElementSibling.style.display==='none'?'block':'none'">
                    <span style="font-weight:600">${esc(empName)}</span>
                    <span class="badge badge-danger">${tasks.length} overdue</span>
                    <span style="margin-left:auto;font-size:12px;color:var(--text-light)">▼</span>
                </div>
                <div><table style="margin:0"><tbody>${tasks.map(t => {
                    const days = Math.abs(daysUntil(t.due_date)||0);
                    return `<tr><td>${esc(t.title)}</td><td>${esc(t.assigned_to||'')}</td>
                        <td>${formatDate(t.due_date)}</td><td><span class="badge badge-danger">${days}d late</span></td></tr>`;
                }).join('')}</tbody></table></div>
            </div>`;
        });
        ovEl.innerHTML = ovHtml;
    }
}

async function loadEmployees() {
    const search = document.getElementById('emp-search')?.value || '';
    const status = document.getElementById('emp-status-filter')?.value || '';
    const dept = document.getElementById('emp-dept-filter')?.value || '';
    const params = new URLSearchParams({ page: state.pagination.page, per_page: state.pagination.perPage });
    if (search) params.set('search', search);
    if (status) params.set('status', status);
    if (dept) params.set('department', dept);
    const data = await api('/api/employees?' + params);
    if (!data) return;
    state.employees = data.employees || data || [];
    state.pagination.total = data.total || state.employees.length;
    renderEmployeeTable();
}

function filterEmployees() { state.pagination.page = 1; loadEmployees(); }

function renderEmployeeTable() {
    const wrap = document.getElementById('emp-table-wrap');
    if (!wrap) return;
    const emps = state.employees;
    if (!emps.length) { wrap.innerHTML = '<div class="empty-state"><div class="icon">👥</div><h3>No employees found</h3><p>Adjust filters or add a new employee.</p></div>'; return; }
    wrap.innerHTML = `<table><thead><tr><th>Name</th><th>Email</th><th>Department</th><th>Role</th><th>Location</th><th>Status</th><th>Start Date</th><th>Actions</th></tr></thead><tbody>${
        emps.map(e => `<tr>
            <td><strong>${esc(e.first_name)} ${esc(e.last_name)}</strong>${e.is_rehire ? ' <span class="badge badge-info" style="font-size:10px">🔄 Rehire</span>' : ''}</td>
            <td>${esc(e.email)}</td><td>${esc(e.department)}</td><td>${esc(e.role_title)}</td>
            <td><span class="badge badge-secondary">${esc(e.location_mode||e.location||'')}</span></td>
            <td>${statusBadge(e.status)}</td><td>${formatDate(e.start_date)}</td>
            <td><button class="btn btn-sm btn-secondary" onclick="navigate('employee-detail',${e.id})">View</button>
            ${isRole('admin','hr')?`<button class="btn btn-sm btn-secondary" onclick="showEditEmployeeModal(${e.id})">Edit</button>`:''}</td></tr>`).join('')
    }</tbody></table>`;
    // Pagination
    const totalPages = Math.ceil(state.pagination.total / state.pagination.perPage) || 1;
    const pagEl = document.getElementById('emp-pagination');
    if (pagEl && totalPages > 1) {
        let ph = '<div class="pagination">';
        ph += `<button ${state.pagination.page<=1?'disabled':''} onclick="state.pagination.page--;loadEmployees()">‹</button>`;
        for (let i = 1; i <= totalPages; i++) {
            if (totalPages > 7 && i > 2 && i < totalPages - 1 && Math.abs(i - state.pagination.page) > 1) {
                if (i === 3 || i === totalPages - 2) ph += `<button disabled>…</button>`;
                continue;
            }
            ph += `<button class="${i===state.pagination.page?'active':''}" onclick="state.pagination.page=${i};loadEmployees()">${i}</button>`;
        }
        ph += `<button ${state.pagination.page>=totalPages?'disabled':''} onclick="state.pagination.page++;loadEmployees()">›</button></div>`;
        pagEl.innerHTML = ph;
    }
}

function getEmployeeFormData() {
    const first = document.getElementById('ef-first')?.value.trim();
    const last = document.getElementById('ef-last')?.value.trim();
    const email = document.getElementById('ef-email')?.value.trim();
    const dept = document.getElementById('ef-dept')?.value;
    const start = document.getElementById('ef-start')?.value;
    if (!first || !last || !email || !dept || !start) { showToast('Please fill in all required fields', 'warning'); return null; }
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { showToast('Please enter a valid email', 'warning'); return null; }
    const locMode = document.querySelector('input[name="ef-locmode"]:checked')?.value || 'in-office';
    return {
        first_name: first, last_name: last, email, phone: document.getElementById('ef-phone')?.value.trim(),
        role_title: document.getElementById('ef-role')?.value.trim(), department: dept,
        manager_email: document.getElementById('ef-manager')?.value.trim(),
        location: document.getElementById('ef-location')?.value.trim(), start_date: start,
        hire_type: document.getElementById('ef-hire')?.value,
        buddy_email: document.getElementById('ef-buddy')?.value.trim(),
        hr_owner_email: document.getElementById('ef-hr-owner')?.value.trim(),
        location_mode: locMode,
        is_rehire: document.getElementById('ef-rehire')?.checked ? 1 : 0,
        previous_end_date: document.getElementById('ef-prev-end')?.value || '',
    };
}

function getEquipmentData() {
    const items = [];
    const map = { computer: 'eq-computer', phone: 'eq-phone', monitors: 'eq-monitors', headphones: 'eq-headphones', camera: 'eq-camera', desk: 'eq-desk', chair: 'eq-chair', stationery: 'eq-stationery' };
    for (const [type, id] of Object.entries(map)) {
        if (document.getElementById(id)?.checked) {
            const itemType = type === 'computer' ? (document.getElementById('eq-comp-type')?.value || 'laptop') : type;
            items.push({ item_type: itemType, notes: document.getElementById('eq-notes')?.value || '' });
        }
    }
    return items;
}

function updateHireTypeHelp() {
    const el = document.getElementById('ef-hire-help');
    if (!el) return;
    const val = document.getElementById('ef-hire')?.value || 'full-time';
    const helpText = {
        'full-time': 'Full onboarding: 30/60/90 plan, buddy program, all meet-and-greets, benefits enrollment, and complete training track.',
        'part-time': 'Same onboarding as full-time with adjusted timelines for reduced hours. Benefits enrollment included.',
        'contractor': 'Streamlined onboarding: SOW review, time-limited system access, essential meet-and-greets only, contract milestone reviews. No benefits enrollment or SWAG.',
        'intern': 'Intern program: dedicated mentor, project-based milestones, mid/end-of-internship reviews, presentation slot. Simplified benefits.',
    };
    el.textContent = helpText[val] || '';
}

async function saveNewEmployee() {
    const data = getEmployeeFormData();
    if (!data) return;
    const btn = document.getElementById('save-emp-btn');
    if (btn) { btn.disabled = true; btn.textContent = 'Saving...'; }
    const result = await api('/api/employees', { method: 'POST', body: data });
    if (result) {
        showToast('Employee added');
        // Add equipment
        const equip = getEquipmentData();
        if (equip.length && result.id) {
            for (const item of equip) {
                await api('/api/employees/' + result.id + '/equipment', { method: 'POST', body: item });
            }
        }
        // Auto onboard
        if (document.getElementById('ef-auto-onboard')?.checked && result.id) {
            await api('/api/employees/' + result.id + '/onboard', { method: 'POST' });
            showToast('Onboarding started!');
        }
        closeModal();
        if (state.currentView === 'employees') loadEmployees();
    }
    if (btn) { btn.disabled = false; btn.textContent = 'Save & Start Onboarding'; }
}

async function updateEmployee(id) {
    const data = getEmployeeFormData();
    if (!data) return;
    const result = await api('/api/employees/' + id, { method: 'PUT', body: data });
    if (result) { showToast('Employee updated'); closeModal(); render(); }
}
